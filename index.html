  <section class=&quot;blk&quot; id=&quot;s1&quot;>
    <h2><span class=&quot;no&quot;>01</span>高圧ガス保安法・定義</h2>
    <p class=&quot;lead-q&quot;>法の目的の問題は、<b>「〜のみを目的としている」「〜は定めていない」が入っていたら✕</b>。これだけです。</p>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「容器の製造及び取扱を規制することは<b>定めていない</b>」→ 容器もちゃんと規制対象です</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>製造・貯蔵・販売・移動・消費＋<b>容器</b>＋<b>民間事業者と保安協会の自主的な活動の促進</b>、全部入っていれば正しい</span></div>
    <p class=&quot;lead-q&quot;>定義の判定は<b>「又は」の後ろも必ず見る</b>。片方の基準だけで「高圧ガスではない」と言い切る文は大体✕です。</p>
    <table class=&quot;numtable&quot;>
      <tr><th>ガス</th><th>どちらかに当てはまれば高圧ガス</th></tr>
      <tr><td>圧縮ガス</td><td>常用の温度で<b>1MPa</b>以上、かつ現在<b>1MPa</b>以上　／　<b>35度</b>で<b>1MPa</b>以上</td></tr>
      <tr><td>圧縮アセチレン</td><td>常用の温度で<b>0.2MPa</b>以上、かつ現在<b>0.2MPa</b>以上　／　<b>15度</b>で<b>0.2MPa</b>以上</td></tr>
      <tr><td>液化ガス</td><td>常用の温度で<b>0.2MPa</b>以上、かつ現在<b>0.2MPa</b>以上　／　0.2MPaになる温度が<b>35度以下</b></td></tr>
    </table>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「現在0.9MPaだが35度で1MPaになる。だから<b>高圧ガスではない</b>」→ 35度で1MPaになる時点でアウト（R6問1ロ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>「35度で0.2MPa未満の液化ガスでも、<b>高圧ガスとなるものがある</b>」→ 0.2MPaになる温度が35度以下なら該当（R6問1ハ）</span></div>
    <div class=&quot;note&quot;>ざっくり言うと<b>「〜高圧ガスである」は○、「〜高圧ガスではない」は✕</b>になりやすい、と覚えておくと初見でも拾えます。ただし「常用の温度40度で1MPa・現在0.9MPa」のように、<b>35度では1MPaに届かない圧縮ガスは本当に高圧ガスではない</b>（R5問1ハは○）ので、最後は表で確認してください。</div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s2&quot;>
    <h2><span class=&quot;no&quot;>02</span>法の適用除外</h2>
    <p class=&quot;lead-q&quot;>基本は<b>「適用を受けない」と書いてあったら✕</b>。少ない量でも高圧ガスは高圧ガスです。ただし例外が2つだけあります。</p>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>圧縮空気</b>（空気分離装置用を除く）で35度・<b>5MPa以下</b>のもの → 適用除外</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>オートクレーブ</b>内の高圧ガス → 適用除外。ただし<b>水素・アセチレン・塩化ビニルは除かれる</b>（＝この3つは法の適用を受ける）</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「内容積1デシリットル以下の容器の<b>全ての</b>高圧ガスは適用除外」→ 一部の条項だけです</span></div>
    <div class=&quot;note&quot;>オートクレーブの問題は<b>「水素・アセチレン・塩化ビニル」の3つが並んでいるかどうか</b>だけ見れば判定できます。</div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s3&quot;>
    <h2><span class=&quot;no&quot;>03</span>許可・届出（製造）</h2>
    <p class=&quot;lead-q&quot;>ここは数字を覚えるしかありません。でも覚えるのは<b>300と100</b>だけです。</p>
    <table class=&quot;numtable&quot;>
      <tr><th>ガス</th><th>許可が必要</th></tr>
      <tr><td>第一種ガス（<b>窒素</b>など）</td><td>1日 <b>300m³</b>以上</td></tr>
      <tr><td>それ以外</td><td>1日 <b>100m³</b>以上</td></tr>
      <tr><td>混ざっている場合</td><td>X=100+(2/3)×第一種ガス量。合計がX以上で許可</td></tr>
    </table>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「ガスの<b>種類にかかわらず</b>1日100立方メートル」→ 種類によって違います（R6問3イ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>「許可が必要な最小の値は、<b>製造する高圧ガスの種類により異なる</b>」→ こう書いてあれば正しい</span></div>
    <div class=&quot;note&quot;>問題文に<b>「種類にかかわらず」「関係なく」</b>が出てきたら、まず✕を疑ってください。よく使われるひっかけワードです。</div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s4&quot;>
    <h2><span class=&quot;no&quot;>04</span>ガス貯蔵関係</h2>
    <p class=&quot;lead-q&quot;>さっきと似ています。<b>3000と1000</b>を覚えます。</p>
    <table class=&quot;numtable&quot;>
      <tr><th>ガス</th><th>第一種貯蔵所（許可）</th></tr>
      <tr><td>第一種ガス（窒素など）</td><td><b>3000m³</b>以上</td></tr>
      <tr><td>それ以外</td><td><b>1000m³</b>以上</td></tr>
      <tr><td>混ざっている場合</td><td>X=1000+(2/3)×第一種ガス量。合計がX以上で許可</td></tr>
    </table>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>第一種製造者が<b>製造の許可を受けたところに従って</b>貯蔵するとき → <b>第一種貯蔵所の許可は不要</b>（超頻出）</span></div>
    <div class=&quot;note&quot;>「許可を受けたところに従って貯蔵」というフレーズが見えたら、<b>もう一回許可は要りません</b>。反射で答えられるようにしておくとおいしい問題です。</div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s5&quot;>
    <h2><span class=&quot;no&quot;>05</span>変更について</h2>
    <p class=&quot;lead-q&quot;><b>軽微な変更以外は全部「許可」</b>。ガスの種類・製造の方法・設備の変更など、簡単にできないものは許可が要ります。</p>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>製造する<b>ガスの種類</b>の変更、<b>製造の方法</b>の変更 → <b>許可</b>が必要</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「製造の方法を変更したときは<b>軽微な変更</b>として届け出ればよい」→ 許可が必要です（R6問13ハ）</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「<b>特定設備</b>の取替え工事は軽微な変更に該当する」→ 特定設備<b>でない</b>設備の取替えが軽微です（R6問13イ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>許可を受けた工事のうち<b>特定変更工事は完成検査の対象</b></span></div>
    <div class=&quot;note&quot;>「特定」の2文字が付いたら重いほう（許可・完成検査が必要）、付いてなければ軽いほう、とイメージすると整理しやすいです。</div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s6&quot;>
    <h2><span class=&quot;no&quot;>06</span>販売・消費の届出</h2>
    <p class=&quot;lead-q&quot;>基本は<b>全部「20日前まで」に届出</b>。「開始後遅滞なく」「30日以内」などが出てきたら✕です。</p>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>販売事業の届出／特定高圧ガス消費者の届出 → <b>20日前まで</b></span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>第一種製造者が<b>自分で製造したガスを自分の事業所で販売</b> → 販売の届出は<b>不要</b>（何気によく出ます）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>ただし<b>特定高圧ガス消費者だけは第一種製造者でも20日前までに届出が必要</b></span></div>
    <div class=&quot;note&quot;>「第一種製造者だから不要」が○になるのは<b>販売と貯蔵</b>。<b>特定高圧ガスの消費は例外なく必要</b>。ここの線引きだけ押さえてください。</div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s7&quot;>
    <h2><span class=&quot;no&quot;>07</span>事故届・承継・危険時の措置</h2>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>紛失・盗難があれば必ず届出</b>。ガスが入っていようが<b>空の容器だろうが届出が必要</b>（R6問2ロ）</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「充塡されていない容器なら届出の<b>必要はない</b>」→ 空でも必要です</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>事故届は<b>高圧ガスを扱う者なら誰でも</b>義務あり（製造者・販売業者に限らない）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>合併・相続・分割は承継できる</b></span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span><b>譲り受け・譲り渡し</b>による承継 → <b>認められていません</b></span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>危険時の応急措置義務が「第一種・第二種製造者の施設に<b>限られる</b>」→ 施設の所有者・占有者なら誰でも義務あり（R6問4ハ）</span></div>
    <div class=&quot;note&quot;>この節は<b>「必要はない」「限られる」を見たら✕</b>で8割いけます。範囲を狭める表現がひっかけです。</div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s8&quot;>
    <h2><span class=&quot;no&quot;>08</span>輸入検査・刻印・くず化</h2>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>船舶から導管で陸揚げ</b>する輸入は、輸入検査を<b>受けなくてよい</b>（R6問2イ）</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「輸入した<b>高圧ガスのみ</b>検査を受ければよい」→ <b>ガスと容器の両方</b>が対象</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>刻印事項に「<b>最大充塡質量の数値</b>」→ <b>そんな刻印事項はありません</b>。刻印された容積から計算するものです（毎年出ます）</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>刻印事項に「<b>気密試験圧力</b>」→ 刻印するのは<b>耐圧試験圧力（TP）</b>です（R6問6イ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>廃棄するときは<b>くず化</b>して処分。<b>附属品も同じ</b>（「附属品には定めがない」は✕）</span></div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s9&quot;>
    <h2><span class=&quot;no&quot;>09</span>容器の検査と再検査</h2>
    <div class=&quot;formula&quot;>G = V / C　←　この式だけは覚える</div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>再検査の期間は<b>一般継目なし容器＝5年（経過年数に関係なく一律）</b>／装置されていない附属品＝2年／その他＝経過年数に応じて</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「一般継目なし容器の再検査は<b>刻印の月の末日から起算</b>して5年」→ <b>容器製造検査に合格した後</b>から一律5年（R6問6ハ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>輸入容器の容器検査は<b>都道府県知事等・高圧ガス保安協会・指定容器検査機関</b>が行う（R6問5イ）</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>再検査に不合格で3か月以内に刻印がされなくても「<b>容器として使用できる</b>」→ <b>くず化</b>してください（R6問5ハ）</span></div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s10&quot;>
    <h2><span class=&quot;no&quot;>10</span>液石則（消費者施設）</h2>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>設備距離は<b>減圧設備の外面から</b>。第一種保安物件に第一種設備距離以上、第二種に第二種設備距離以上</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「<b>貯蔵設備と減圧設備の間の配管</b>の外面から」→ 起点は<b>減圧設備の外面</b>です（R6問7イ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>貯槽の<b>基礎と支柱は同一の基礎に緊結</b>。<b>地盤が堅固でも緊結は必要</b>（R6問7ロ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>周囲<b>5m以内</b>は火気禁止・引火性発火性の物を置かない。禁止対象は<b>貯蔵設備だけでなく導管・減圧設備・その間の配管も</b>（R6問7ハで「貯蔵設備のみ」は✕）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>取扱主任者は<b>所定の免状</b>か<b>1年以上の経験</b>の<b>どちらか</b>を満たせば選任できる</span></div>
    <div class=&quot;note&quot;>距離の話で<b>「障壁を設ければ短縮できる」「埋設すれば減じられる」</b>は液石則では✕。ここは緩みません。</div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s11&quot;>
    <h2><span class=&quot;no&quot;>11</span>所定の距離・特殊反応設備</h2>
    <table class=&quot;numtable&quot;>
      <tr><th>場面</th><th>距離</th></tr>
      <tr><td>隣接する保安区画</td><td><b>30m</b>以上（燃焼熱量に<b>関係なく一律</b>）</td></tr>
      <tr><td>新設するとき</td><td><b>50m</b></td></tr>
      <tr><td>貯槽どうしの間</td><td><b>1m</b> または <b>最大直径の和の1/4</b> の大きいほう</td></tr>
      <tr><td>保安のための宿直施設</td><td>敷地<b>内</b>でも<b>外</b>でも所定の距離が<b>必要</b>（R3問10イ・R6問8イ）</td></tr>
    </table>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「隣接保安区画の距離は<b>燃焼熱量に応じて</b>算定」→ <b>一律30m</b>です</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>貯槽間の距離が「防火・消火に有効な措置を講じれば<b>短縮できる</b>」→ 短縮できません</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>特殊反応設備の緊急遮断は<b>計器室で操作できる</b>か<b>自動で遮断</b>できるものであること</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>内部反応監視装置は<b>自動的に警報</b>を発するもの＋<b>計測結果を自動記録</b>できるもの</span></div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s12&quot;>
    <h2><span class=&quot;no&quot;>12</span>緊急遮断装置・危害予防規程・保安教育計画</h2>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>導管の緊急遮断装置は<b>市街地・主要河川・湖沼</b>などを横断する場合に必要</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「<b>市街地を横断するものに限り</b>」→ 河川や湖沼もあります。<b>「〜に限り」は✕の合図</b>（R6問9ロ）</span></div>
    <div class=&quot;bigcompare&quot;>
      <div class=&quot;bc-item ok&quot;><div class=&quot;bc-t&quot;>危害予防規程</div><div class=&quot;bc-b&quot;>届出<b>必要</b><br>（変更時も必要）<br>変更を<b>命じられる</b>こともある</div></div>
      <div class=&quot;bc-item ng&quot;><div class=&quot;bc-t&quot;>保安教育計画</div><div class=&quot;bc-b&quot;>届出<b>不要</b><br>定めて忠実に実行するだけ<br>（勧告されることはある）</div></div>
    </div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「保安教育計画を<b>都道府県知事等に届け出る</b>とともに」→ 届出は不要です（R6問12ハ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>危害予防規程には<b>製造施設の新設・変更の安全審査に関すること</b>も定める（「定めるべき事項ではない」は✕）</span></div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s13&quot;>
    <h2><span class=&quot;no&quot;>13</span>保安統括者・保安係員</h2>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>保安統括者は<b>事業の実施を統括管理する者</b>であればよく、<b>製造保安責任者免状は不要</b>（R6問10イ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>保安統括者の代理者だけ</b>、選任・解任の<b>届出が必要</b>（ここ重要）</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「他の役職（保安係員・保安主任者など）の代理者<b>も届出が必要</b>」→ <b>不要</b>です</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>保安係員は<b>所定の免状</b>＋<b>製造の経験</b>の<b>両方</b>が必要（「どちらか一方」は✕）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>保安主任者の職務＝<b>保安技術管理者を補佐し、保安係員を指揮する</b>（R6問10ハ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>保安主任者の免状は<b>甲種でも乙種でもOK</b>（「甲種に限る」は✕）</span></div>
    <div class=&quot;note&quot;>保安係員の職務は<b>「製造の方法」の監督と自主検査の監督</b>。<b>保安検査の監督はしません</b>。ここだけ覚えておけば十分です。</div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s14&quot;>
    <h2><span class=&quot;no&quot;>14</span>保安技術管理者・講習・完成検査・保安検査</h2>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>保安技術管理者は<b>所定の経験</b>＋<b>甲種または乙種の免状</b>が必要</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>講習を受けるのは<b>保安企画推進員・保安主任者・保安係員</b>。<b>保安技術管理者は受講不要</b>（R6問11ハ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>講習は選任後の定められた期間内に受けさせ、その後も<b>定期的に</b>受けさせる（「選任後1回のみ」は✕）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>特定施設は<b>都道府県知事等・保安協会・指定保安検査機関のいずれか</b>の保安検査を定期に受ける（R6問11イ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>認定を受けた事業者が<b>自ら検査＋記録を届出</b>したら、都道府県知事等の検査は<b>不要</b></span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「認定完成検査実施者だから<b>新設・追加工事も自分で</b>完成検査できる」→ 新設・追加はできません</span></div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s15&quot;>
    <h2><span class=&quot;no&quot;>15</span>耐震・耐圧試験・気密試験・圧力計</h2>
    <p class=&quot;lead-q&quot;><b>ポンプと圧縮機は耐震設計の対象外</b>。それ以外は全部対象、と覚えます。</p>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>液化窒素の貯槽も耐震性能が必要</b>（不活性ガスでも貯槽は対象。R6問15イ）</span></div>
    <table class=&quot;numtable&quot;>
      <tr><th>試験</th><th>圧力</th></tr>
      <tr><td>耐圧試験（水などの液体）</td><td>常用の<b>1.5倍</b>以上</td></tr>
      <tr><td>耐圧試験（空気などの気体）</td><td>常用の<b>1.25倍</b>以上</td></tr>
      <tr><td>気密試験</td><td>常用の圧力<b>以上</b></td></tr>
    </table>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「気密試験は常用の圧力以上で<b>行ってはならない</b>」→ 常用の圧力<b>以上で行う</b>のが正解（R6問15ハ）</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「気密試験は<b>1.5倍</b>」「気密試験は<b>1.25倍</b>」→ どちらも耐圧試験の数字です</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>圧力計・液面計は全ての設備・貯槽に必要</b>（窒素も含む）。<b>酸素と窒素以外は丸形ガラス管液面計は使用不可</b></span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>耐圧試験は<b>原則、水などの液体</b>。困難なときだけ空気・窒素などの気体でOK</span></div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s16&quot;>
    <h2><span class=&quot;no&quot;>16</span>漏えいガスの措置・貯槽の配管</h2>
    <p class=&quot;lead-q&quot;>漏えいガスの検知・警報は<b>リストの通りアンモニアとアセチレンだけ</b>。それ以外が書いてあれば✕です。</p>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>5000L以上</b>の貯槽は<b>送り出し・受け入れの両方</b>の配管に遮断措置が必要</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「<b>いずれか一方</b>の配管に」→ 両方です。<b>「いずれか一方」は✕の合図</b></span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>遮断措置が必要なのは<b>可燃性ガス・毒性ガス・酸素</b>の貯槽。<b>液化窒素の貯槽には定めなし</b>（R6問16イで「窒素にも定めがある」は✕）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>貯槽の直近のバルブは<b>使用時以外は閉めておく</b></span></div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s17&quot;>
    <h2><span class=&quot;no&quot;>17</span>流出防止・温度上昇防止・沈下測定</h2>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>流出防止措置（防液堤）はアンモニアだけ</b>。厳密には<b>可燃性ガス・酸素は1000t以上、毒性ガスは5t以上</b>が対象</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「アンモニア・<b>酸素・窒素</b>の貯槽にも流出防止措置が必要」→ この事業所の酸素20t・窒素20tは対象外</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>温度上昇防止</b>と<b>沈下状況の測定</b>は<b>全てのガスが対象</b>（ここは窒素も酸素も入る）</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「液化酸素の貯槽に温度上昇防止措置を講じるべき<b>定めはない</b>」→ 周辺に可燃性物質があれば必要（R6問16ハ）</span></div>
    <div class=&quot;note&quot;>問題文の<b>「例による事業所」の貯蔵能力（何トンか）を必ず確認</b>してください。5tか1000tかで答えが変わります。</div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s18&quot;>
    <h2><span class=&quot;no&quot;>18</span>貯槽への充塡・危険標識・配管の接合</h2>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>全ての貯槽は<b>90％を超えない</b>ように充塡する</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>90％超過の<b>自動検知＋警報</b>が必要なのは<b>毒性ガス（アンモニア）だけ</b></span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「<b>これら全ての貯槽</b>に自動検知・警報の措置が必要」→ アンモニアだけです（R6問19イ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>危険標識もアンモニア（毒性ガス）だけ</b>。酸素の製造施設には定めなし（R6問16ロ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>配管の接合は<b>原則、溶接</b>。無理なら<b>フランジ接合・ねじ接合でも可</b></span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「<b>いかなる場合であっても</b>フランジ接合・ねじ接合により行ってはならない」→ 代替できます（R6問17ハ）</span></div>
    <div class=&quot;note&quot;>問題文に<b>「バルブ」「ポンプ」「危険標識」</b>が出てきたら<b>アンモニアの話だな</b>と反応できるようにしておくと速いです。</div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s19&quot;>
    <h2><span class=&quot;no&quot;>19</span>防爆性能・容器置場</h2>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>電気設備の防爆性能はアセチレンだけ</b>。他のガスが出てきたら✕</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>容器置場の距離は<b>貯蔵するガスの種類と容器置場の面積</b>から算出</span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「<b>貯蔵能力から</b>算出」「<b>処理能力に応じて</b>算出」→ どちらも✕。<b>面積</b>です（R6問18イ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>充塡容器と残ガス容器は<b>それぞれ区分</b>して置く。<b>窒素だけでも区分は必要</b>（R6問20ロで「定めはない」は✕）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>容器は<b>常に温度40度以下</b>。<b>窒素も対象</b></span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>周囲<b>2m以内</b>は火気禁止・引火性発火性の物を置かない（所定の措置を講じない場合）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>内容積5L超</b>の容器は<b>転落・転倒防止措置</b>＋<b>粗暴な取扱い禁止</b>（R6問20ハ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>アセチレンは<b>12cm以上の鉄筋コンクリート</b>等の障壁が必要。可燃性ガスの容器置場は<b>携帯電燈以外持ち込み禁止</b></span></div>
  </section>

  <section class=&quot;blk&quot; id=&quot;s20&quot;>
    <h2><span class=&quot;no&quot;>20</span>安全弁・止め弁・放出管・使用材料</h2>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>安全弁は全ての設備に必要</b>（窒素も含む）。<b>止め弁は常時開</b></span></div>
    <div class=&quot;ruleline ng&quot;><span class=&quot;mk&quot;>✕</span><span>「止め弁は製造していない場合には<b>常に閉止</b>」→ <b>常に全開</b>です（毎年のように出ます）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>放出管はリストの3ガス（酸素・アンモニア・アセチレン）</b>の設備に必要。窒素には定めなし</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>使用材料は全ての製造施設の高圧ガス設備が対象</b>（R6問14イ）。リストの3ガスは<b>高圧ガス設備以外のガス設備も</b>対象</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span><b>防消火設備もリストの3ガス</b>。<b>窒素の製造施設には不要</b>（R6問14ロ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>アセチレンの設備から<b>酸素</b>の設備までは<b>10m以上</b>／可燃性ガス設備どうしは<b>5m以上</b></span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>火気取扱施設への<b>8m</b>の距離が必要なのは<b>アンモニアとアセチレン</b>（「アセチレンのみ」は✕。R6問15ロ）</span></div>
    <div class=&quot;ruleline ok&quot;><span class=&quot;mk&quot;>○</span><span>修理・清掃は<b>全てのガス設備</b>で作業計画と作業責任者が必要（「3ガスに限られる」は✕。R6問19ハ）</span></div>
  </section>

  <div class=&quot;closing&quot;>
    <div class=&quot;cl-head&quot;>最後に</div>
    <p>法令は範囲こそ広いですが、<b>出るところはほぼ決まっています</b>。全部を完璧に理解しようとせず、上の<b>「絶対に覚えてほしいリスト」</b>と、各節の<b>✕になる言い回し</b>を頭に入れてください。</p>
    <p>そのうえで「一問一答」タブで<b>過去問140問</b>を回せば、かなりの確率で見たことのある問題に当たります。合格基準は<b>60％</b>です。満点は要りません。</p>
    <p class=&quot;cl-fin&quot;>一発で合格できるよう頑張りましょう。</p>
  </div>

ot;: &quot;イ. 内容積47リットルの容器に充塡してある高圧ガスの輸入をした者は、輸入した高圧ガスのみについて、都道府県知事等が行う輸入検査を受け、これが輸入検査技術基準に適合していると認められた場合は、その高圧ガスを移動することができる。\nロ. 特定不活性ガス以外の不活性ガスは、廃棄に係る技術上の基準に従うべき高圧ガスとして定められていない。\nハ. 第一種製造者(冷凍のため高圧ガスの製造をする者を除く。)は、高圧ガスを容器により授受した場合には、事業所ごとに所定の事項を記載した帳簿を備え、これを記載の日から2年間保存しなければならない。&quot;, &quot;c&quot;: [&quot;(1) ロ&quot;, &quot;(2) ハ&quot;, &quot;(3) イ,ハ&quot;, &quot;(4) ロ,ハ&quot;, &quot;(5) イ,ロ,ハ&quot;], &quot;a&quot;: 3, &quot;w&quot;: [&quot;✕ この組合せは誤りです。正解は選択肢(4)。下の解説を確認してください。&quot;, &quot;✕ この組合せは誤りです。正解は選択肢(4)。下の解説を確認してください。&quot;, &quot;✕ この組合せは誤りです。正解は選択肢(4)。下の解説を確認してください。&quot;, &quot;○ 正解。イ:(×)輸入検査は『高圧ガス及び容器』の両方が対象であり、高圧ガスのみでは足りない。\nロ:(○)特定不活性ガス以外の不活性ガスについて、廃棄の場所・数量・方法の技術上の基準は定められていない。\nハ:(○)高圧ガスの製造施設の異常等を記載する帳簿(10年保存)とは別に、容器による授受の記録を記載する帳簿は『記載の日から2年間』保存する規定がある。&quot;, &quot;✕ この組合せは誤りです。正解は選択肢(4)。下の解説を確認してください。&quot;]}, {&quot;s&quot;: &quot;令和7年度&quot;, &quot;n&quot;: &quot;問5&quot;, &quot;q&quot;: &quot;イ. 容器が損傷を受けた場合、容器再検査を受け、これに合格し、かつ、所定の刻印又は標章の掲示がされたものでなければ高圧ガスを充塡してはならない。\nロ. 容器の所有者は、容器再検査に合格しなかった容器について、所定の期間内に所定の刻印等がされなかったときは、遅滞なく、この容器を容器として使用することができないように処分すること又はその外面に「使用禁止」である旨の表示をすることと定められている。\nハ. 容器(高圧ガスを充塡していないもの)を輸入した者は、特に定められたものを除き、その容器が所定の容器検査を受け、これに合格し所定の刻印等がされているもの又は外国登録容器製造業者が製造した容器であって、所定の自主検査刻印等がされているものでなければ、その容器を譲渡し、又は引き渡してはならない。&quot;, &quot;c&quot;: [&quot;(1) イ&quot;, &quot;(2) イ,ロ&quot;, &quot;(3) イ,ハ&quot;, &quot;(4) ロ,ハ&quot;, &quot;(5) イ,ロ,ハ&quot;], &quot;a&quot;: 2, &quot;w&quot;: [&quot;✕ この組合せは誤りです。正解は選択肢(3)。下の解説を確認してください。&quot;, &quot;✕ この組合せは誤りです。正解は選択肢(3)。下の解説を確認してください。&quot;, &quot;○ 正解。イ:(○)法48条1項5号の規定どおり正しい。\nロ:(×)再検査不合格の容器は使用不可への処分が必要であり、『使用禁止の表示』による代替は認められていない。\nハ:(○)所定の容器検査合格・刻印等のほか、外国登録容器製造業者が製造し自主検査刻印等がされた容器も譲渡・引渡しが可能。&quot;, &quot;✕ この組合せは誤りです。正解は選択肢(3)。下の解説を確認してください。&quot;, &quot;✕ この組合せは誤りです。正解は選択肢(3)。下の解説を確認してください。&quot;]}, {&quot;s&quot;: &quot;令和7年度&quot;, &quot;n&quot;: &quot;問6&quot;, &quot;q&quot;: &quot;イ. 毒性ガスを充塡する容器には、充塡すべき高圧ガスの名称が刻印で示されているので、高圧ガスの名称を明示する必要はなく、高圧ガスの性質を示す文字を明示することと定められている。\nロ. 超低温容器の容器再検査にお }

  choiceEls.forEach((el, j)=>{
    if(j === q.a) el.classList.add('correct');
    if(j === i &amp;&amp; i !== q.a) el.classList.add('wrong');
    if(j !== q.a &amp;&amp; j !== i) el.classList.add('dim');
    const reasonEl = el.querySelector('[data-reason]');
    if(reasonEl &amp;&amp; reasonEl.textContent.trim()){
      reasonEl.classList.add('show');
    }
  });
  const banner = document.getElementById('resultBanner');
  banner.classList.add('show');
  if(i === q.a){
    score++;
    banner.classList.add('ok');
    banner.textContent = '✓ 正解!';
  } else {
    banner.classList.add('ng');
    banner.textContent = `✗ 不正解 — 正解は (${q.a+1})`;
  }
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('scoreLabel').textContent = `正解 ${score}`;
}

function renderDone(){
  const total = filtered.length;
  const pct = total ? Math.round((score/total)*100) : 0;
  document.getElementById('progLabel').textContent = `${total} / ${total}`;
  document.getElementById('progFill').style.width = `100%`;
  document.getElementById('scoreLabel').textContent = `正解 ${score}`;
  const card = document.getElementById('quizCard');
  card.innerHTML = `
    <div class=&quot;done-screen&quot;>
      <span class=&quot;sec-tag&quot;>${activeCat==='ALL' ? '全問' : activeCat} 完了</span>
      <div class=&quot;big&quot;>${score} / ${total}</div>
      <div style=&quot;font-family:-apple-system,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-weight:600;&quot;>正答率 ${pct}%</div>
      <div class=&quot;actions&quot; style=&quot;margin-top:22px;&quot;>
        <button class=&quot;btn btn-secondary&quot; id=&quot;retryBtn&quot;>もう一度</button>
      </div>
    </div>
  `;
  document.getElementById('retryBtn').onclick = () => {
    idx = 0; score = 0;
    answered = new Array(filtered.length).fill(false);
    render();
  };
}

function escapeHtml(str){
  return str
    .replace(/&amp;/g,'&amp;amp;')
    .replace(/</g,'&amp;lt;')
    .replace(/>/g,'&amp;gt;')
    .replace(/\n/g,'<br>');
}

render();

document.addEventListener(&quot;click&quot;, function (e) {

  if (!a) return;
  var id = a.getAttribute(&quot;href&quot;).slice(1);
  if (!id) return;
  var el = document.getElementById(id);
  if (el) {
    e.preventDefault();
    el.scrollIntoView({ behavior: &quot;smooth&quot;, block: &quot;start&quot; });
  }
});
