/* ===== 計算タブ ===== */
#p-calc .cstep{background:#fff; border:2.5px solid var(--ink); border-radius:9px;
  padding:10px 13px 10px 42px; margin-bottom:8px; position:relative; counter-increment:cs;}
#p-calc .csteps{counter-reset:cs; margin-top:14px;}
#p-calc .cstep::before{content:counter(cs); position:absolute; left:11px; top:11px;
  width:22px; height:22px; border-radius:50%; background:var(--danger); color:#fff;
  font-family:-apple-system,&quot;Helvetica Neue&quot;,Arial,sans-serif; font-size:13px; display:flex; align-items:center; justify-content:center;}
#p-calc .cstep-t{font-weight:900; font-size:14.5px;}
#p-calc .cstep-b{font-size:12.8px; color:#4a4740; margin-top:2px;}

#p-calc .grp{margin-top:28px;}
#p-calc .grp-h{background:var(--ink); color:var(--paper); border-radius:9px 9px 0 0;
  padding:11px 14px; display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
#p-calc .grp-t{font-size:17px; font-weight:900;}
#p-calc .grp-tag{font-family:-apple-system,&quot;Helvetica Neue&quot;,Arial,sans-serif; font-size:10px; letter-spacing:.08em;
  background:var(--hazard); color:var(--ink); padding:2px 8px; border-radius:99px;}
#p-calc .grp-freq{font-size:11px; opacity:.8; margin-left:auto;}
#p-calc .grp-note{background:#fffbea; border:2.5px solid var(--ink); border-top:none;
  border-radius:0 0 9px 9px; padding:10px 14px; font-size:13px;}

#p-calc .form{background:#fff; border:2.5px solid var(--calc); border-radius:10px;
  margin-top:12px; overflow:hidden;}
#p-calc .ask{padding:11px 13px 5px;}
#p-calc .ask-l{font-family:-apple-system,&quot;Helvetica Neue&quot;,Arial,sans-serif; font-size:10px; letter-spacing:.1em;
  color:#6b675e; margin-bottom:6px;}
#p-calc .akw{display:inline-block; background:#ffe89a; border:1.5px solid var(--hazard-dark);
  border-radius:99px; padding:3px 11px; font-size:13px; font-weight:700; margin:0 5px 6px 0;}
#p-calc .tpl{background:var(--calc); color:#fff; margin:4px 13px 12px; border-radius:8px;
  padding:14px 12px; text-align:center; font-size:16.5px; font-weight:700;
  color:#ffd75e; line-height:1.6; word-break:keep-all;}
#p-calc .keys{padding:0 13px 12px; margin:0; list-style:none; counter-reset:k;}
#p-calc .keys li{counter-increment:k; font-size:13.5px; padding-left:26px; position:relative; margin-bottom:6px;}
#p-calc .keys li::before{content:counter(k); position:absolute; left:0; top:3px;
  width:18px; height:18px; border-radius:4px; background:#e3ecf6; color:var(--calc);
  font-family:-apple-system,&quot;Helvetica Neue&quot;,Arial,sans-serif; font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:700;}
#p-calc .cex{background:#f7f4ea; border-top:2px dashed var(--calc); padding:11px 13px;}
#p-calc .cex-l{font-family:-apple-system,&quot;Helvetica Neue&quot;,Arial,sans-serif; font-size:10px; letter-spacing:.08em;
  color:var(--danger); font-weight:600; margin-bottom:6px;}
#p-calc .cex-w{background:#fff; border-left:5px solid var(--safe); border-radius:0 5px 5px 0;
  padding:9px 11px; font-size:14px;}
#p-calc .cex-w div{margin-bottom:4px;}
#p-calc .cex-a{font-weight:900; color:var(--safe); font-size:15px; margin-top:6px !important;}
#p-calc .cwarn{background:#fdeceb; padding:9px 13px; font-size:12.8px; color:#7a2419;
  border-top:2px dashed var(--danger);}

#p-calc .utbl{width:100%; border-collapse:collapse; font-size:13px; background:#fff;}
#p-calc .utbl td{padding:9px 11px; border-bottom:1px solid var(--line); vertical-align:top;}
#p-calc .utbl tr:last-child td{border-bottom:none;}
#p-calc .utbl td:first-child{font-weight:900; width:44%;}
#p-calc .ueg{display:inline-block; background:#ffe89a; padding:1px 7px; border-radius:4px;
  font-weight:700; margin-top:3px; font-size:12.5px;}
#p-calc .unote{font-size:11.8px; color:#6b675e; margin-top:3px;}
#p-calc .ubox{border:2.5px solid var(--ink); border-radius:9px; overflow:hidden; margin-top:12px;}
#p-calc .closing{background:var(--ink); color:var(--paper); border-radius:9px;
  padding:14px 16px; margin:26px 0 0; font-size:14.5px; font-weight:700; line-height:1.8;}
#p-calc .closing b{color:var(--hazard);}



/* ===== 計算タブ 追加（型まとめ） ===== */
#p-calc .kc-mt{margin-top:26px;}

#p-calc .kc-finder a{text-decoration:none; color:var(--ink); background:#fff; border:2px solid var(--ink);
  border-radius:99px; padding:5px 12px; font-size:13px; font-weight:700; line-height:1.4;}
#p-calc .kc-finder a:active{background:var(--hazard);}
#p-calc .kc-finder a i{font-style:normal; font-weight:400; font-size:10.5px; color:var(--danger); margin-left:5px;}
#p-calc .kc-finder a:focus-visible{outline:3px solid #2b6cb0; outline-offset:2px;}
#p-calc .kc-tt{display:grid; gap:7px; margin-top:12px;}
#p-calc .kc-tt div{border:2.5px solid; border-radius:9px; padding:9px 13px; font-size:13px; background:#fff;}
#p-calc .kc-tt b{display:block; font-size:14.5px;}
#p-calc .kc-tt .k{border-color:var(--danger);} #p-calc .kc-tt .k b{color:var(--danger);}
#p-calc .kc-tt .d{border-color:var(--calc);} #p-calc .kc-tt .d b{color:var(--calc);}
#p-calc .kc-tt .n{border-color:var(--safe);} #p-calc .kc-tt .n b{color:var(--safe);}
#p-calc .kc-card{scroll-margin-top:64px;}
#p-calc .kc-h{background:var(--calc); color:#fff; padding:9px 13px; font-weight:900; font-size:16px;
  display:flex; align-items:center; gap:8px;}
#p-calc .kc-q{margin-left:auto; font-family:-apple-system,&quot;Helvetica Neue&quot;,Arial,sans-serif; font-size:11px;
  background:var(--hazard); color:var(--ink); padding:1px 9px; border-radius:99px; font-weight:700;}
#p-calc .kc-tags{padding:0 13px 4px;}
#p-calc .kc-tag{display:inline-block; font-size:11.5px; font-weight:700; padding:1px 8px; border-radius:4px;
  margin:0 4px 4px 0; border:1.5px solid;}
#p-calc .kc-tag.k{color:var(--danger); background:#fdeceb;}
#p-calc .kc-tag.d{color:var(--calc); background:#e3ecf6;}
#p-calc .kc-tag.n{color:var(--safe); background:#eef4ef;}
#p-calc .kc-extra{font-size:12.5px; color:#4a4740; margin:0 13px 8px;}
#p-calc .kc-kl{font-family:-apple-system,&quot;Helvetica Neue&quot;,Arial,sans-serif; font-size:10px; letter-spacing:.1em;
  color:#6b675e; margin:0 13px 6px;}
#p-calc .kc-keys{display:flex; flex-wrap:wrap; gap:6px; padding:0 13px 12px;}
#p-calc .kc-keys span{min-width:32px; text-align:center; padding:4px 9px; border-radius:7px; font-size:13px;
  line-height:1.35; background:#f7f4ea; border:1.5px solid #b7ae98; border-bottom-width:3.5px; font-weight:700;}
#p-calc .kc-keys span.op{background:var(--ink); color:var(--paper); border-color:var(--ink);}
#p-calc .kc-keys span.eq{background:var(--hazard); border-color:var(--hazard-dark);}
#p-calc .kc-d{border-top:2px dashed var(--line);}
#p-calc .kc-d summary{cursor:pointer; list-style:none; padding:10px 13px; font-weight:900; font-size:13.5px; color:var(--calc);}
#p-calc .kc-d summary::-webkit-details-marker{display:none;}
#p-calc .kc-d summary::before{content:&quot;＋ &quot;; color:var(--danger);}
#p-calc .kc-d[open] summary::before{content:&quot;－ &quot;;}
#p-calc .kc-d .cex{border-top:none; padding-top:2px;}
#p-calc .kc-calcwrap{padding:0 13px 13px;}
#p-calc .kc-calc{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px;}
#p-calc .kc-calc label{font-size:11.5px; color:#5b564c; display:flex; flex-direction:column; gap:2px; font-weight:700;}
#p-calc .kc-calc input,#p-calc .kc-calc select{font:inherit; font-size:16px; font-weight:400; color:var(--ink);
  background:#fff; border:2px solid var(--ink); border-radius:6px; padding:5px 8px; width:100%;}
#p-calc .kc-calc input:focus-visible,#p-calc .kc-calc select:focus-visible{outline:3px solid #2b6cb0; outline-offset:1px;}
#p-calc .kc-calcwrap .kc-extra{margin:6px 0 0;}
#p-calc .kc-out{margin-top:10px;}

  <div class=&quot;tabbar&quot;>
    <div class=&quot;tabs&quot; role=&quot;tablist&quot;>
      <button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot;  data-panel=&quot;p-guide&quot;>攻略</button>
      <button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-panel=&quot;p-quiz&quot;>一問一答</button>
      <button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-panel=&quot;p-calc&quot;>計算</button>

      <button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-panel=&quot;p-ref&quot;>早見表</button>
    </div>
  </div>

  <section class=&quot;panel on&quot; id=&quot;p-guide&quot;><div class=&quot;lead&quot;>学識は<b>問1から問15までテーマが固定</b>です。ただし計算問題が約7問あるので作戦が要ります。
<b>問1・問6・問8は取りやすい</b>ので、ここを落とさないことを最優先にしてください。
計算問題には<b>その年に実際に出た問題の解き方</b>を数字入りで載せてあります。式だけ見て手が止まったら、すぐ下の例を真似してください。</div><nav class=&quot;toc&quot;><div class=&quot;toc-h&quot;>目次</div><ol><li><a href=&quot;#s1&quot;>SI単位</a></li><li><a href=&quot;#s2&quot;>気体の計算①<span class=&quot;calcmark&quot;>計算</span></a></li><li><a href=&quot;#s3&quot;>熱力学の計算②<span class=&quot;calcmark&quot;>計算</span></a></li><li><a href=&quot;#s4&quot;>熱力学の記述</a></li><li><a href=&quot;#s5&quot;>反応速度</a></li><li><a href=&quot;#s6&quot;>化学反応式の係数</a></li><li><a href=&quot;#s7&quot;>化学平衡</a></li><li><a href=&quot;#s8&quot;>エンタルピー計算<span class=&quot;calcmark&quot;>計算</span></a></li><li><a href=&quot;#s9&quot;>ガスの分類・必要空気量<span class=&quot;calcmark&quot;>計算</span></a></li><li><a href=&quot;#s10&quot;>爆発下限界・爆風<span class=&quot;calcmark&quot;>計算</span></a></li><li><a href=&quot;#s11&quot;>最小発火エネルギー・連鎖反応</a></li><li><a href=&quot;#s12&quot;>燃焼速度・静電気</a></li><li><a href=&quot;#s13&quot;>消炎距離・爆ごう</a></li><li><a href=&quot;#s14&quot;>個別ガスの性質①</a></li><li><a href=&quot;#s15&quot;>個別ガスの性質②</a></li></ol></nav><section class=&quot;sec&quot; id=&quot;s1&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問1</span><span class=&quot;sec-t&quot;>SI単位</span></div><p class=&quot;sec-lead&quot;>指数を見るだけ。計算不要の確定得点です。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>1 N＝kg・m・s⁻²</b></li><li><b>1 Pa＝kg・m⁻¹・s⁻²</b>（Nを面積で割る→mが−1乗）</li><li><b>1 J＝kg・m²・s⁻²</b>（Nに距離を掛ける→mが2乗）</li><li><b>1 W＝kg・m²・s⁻³</b>（Jを時間で割る→sが−3乗）</li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>Jの<b>mが1乗</b>になっている → ✕</li><li>Paの<b>mが−2乗</b>になっている → ✕</li><li>Wの<b>sが−2乗</b>になっている → ✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>覚え方は <b>N →(×m)→ J →(÷s)→ W</b>。この流れだけで4つとも作れます。組立の理屈は不要です。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s2&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問2</span><span class=&quot;sec-t&quot;>気体の計算①</span></div><p class=&quot;sec-lead&quot;>毎年ここが最初の計算です。問題文の語で式が1つに決まります。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li>まず<b>最後の一文</b>だけ読んで、何を求めるか確定させる</li><li>そのあと問題文から<b>下の4つの語のどれか</b>を探す。それで式が決まります</li></ul></div></div><div class=&quot;calcbox&quot;><div class=&quot;box-h&quot;>計算のやり方</div><div class=&quot;pattern&quot;><div class=&quot;trig-lbl&quot;>この語が出たら</div><span class=&quot;tchip&quot;>◯molの体積は</span><span class=&quot;tchip&quot;>内容積◯Lに充填</span><span class=&quot;tchip&quot;>理想気体として</span><div class=&quot;f-box&quot;><div class=&quot;f&quot;>p V = n R T</div><div class=&quot;fn&quot;>R＝8.314　pはPa　Vはm³　TはK</div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R1 問2</div><div class=&quot;ex-q&quot;>温度27℃、圧力0.3 MPaの理想気体3 molの体積はおよそいくらか。</div><div class=&quot;ex-w&quot;><div>V = nRT / p</div><div>= 3 × 8.314 × (27+273) ÷ (0.3×10⁶)</div><div class=&quot;ex-ans&quot;>＝ 約2.5×10⁻² m³</div></div></div></div><div class=&quot;pattern&quot;><div class=&quot;trig-lbl&quot;>この語が出たら</div><span class=&quot;tchip&quot;>密度が◯kg/m³</span><span class=&quot;tchip&quot;>モル質量は</span><span class=&quot;tchip&quot;>分子量は</span><div class=&quot;f-box&quot;><div class=&quot;f&quot;>ρ = p M / R T</div><div class=&quot;fn&quot;>Mはkg/mol。モル質量を求めるなら M = ρRT / p</div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R2 問2</div><div class=&quot;ex-q&quot;>27℃、0.1 MPaの理想気体の密度が1.12 kg/m³。モル質量はおよそいくらか。</div><div class=&quot;ex-w&quot;><div>M = ρRT / p</div><div>= 1.12 × 8.314 × 300 ÷ (0.1×10⁶)</div><div>= 0.0279 kg/mol</div><div class=&quot;ex-ans&quot;>＝ 約28 g/mol（窒素）</div></div></div></div><div class=&quot;pattern&quot;><div class=&quot;trig-lbl&quot;>この語が出たら</div><span class=&quot;tchip&quot;>分圧</span><span class=&quot;tchip&quot;>全圧</span><span class=&quot;tchip&quot;>ドルトンの法則</span><span class=&quot;tchip&quot;>気体Aと気体B</span><div class=&quot;f-box&quot;><div class=&quot;f&quot;>n(A) : n(B) ＝ p(A) : p(B)</div><div class=&quot;fn&quot;>molの比＝圧力の比。RもTもVも使いません</div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R4 問2</div><div class=&quot;ex-q&quot;>分子量44の気体Aと分子量28の気体Bの混合気体。全圧120 kPa、Aの質量17.6 gで分圧30 kPa。Bの質量は。</div><div class=&quot;ex-w&quot;><div>n(A) = 17.6 ÷ 44 = 0.4 mol</div><div>p(B) = 120 − 30 = 90 kPa</div><div>n(B) = 0.4 × (90 ÷ 30) = 1.2 mol</div><div class=&quot;ex-ans&quot;>＝ 1.2 × 28 = 約34 g</div></div></div></div><div class=&quot;pattern&quot;><div class=&quot;trig-lbl&quot;>この語が出たら</div><span class=&quot;tchip&quot;>シャルルの法則</span><span class=&quot;tchip&quot;>体積が◯倍</span><span class=&quot;tchip&quot;>圧力一定のもとで</span><span class=&quot;tchip&quot;>加熱後の温度</span><div class=&quot;f-box&quot;><div class=&quot;f&quot;>p₁V₁ / T₁ ＝ p₂V₂ / T₂</div><div class=&quot;fn&quot;>「◯◯一定」と書かれた文字を両辺から消すのがコツ</div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R5 問2</div><div class=&quot;ex-q&quot;>20℃の気体を圧力一定で加熱したところ体積が1.5倍になった。加熱後の温度は。</div><div class=&quot;ex-w&quot;><div>圧力一定 → V₁/T₁ = V₂/T₂</div><div>T₂ = (20+273) × 1.5 = 439.5 K</div><div class=&quot;ex-ans&quot;>＝ 439.5 − 273 = 約167℃</div></div><div class=&quot;ex-warn&quot;>20℃を1.5倍して30℃とするのがひっかけ。<b>Kに直してから</b>倍にします。</div></div></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>℃のまま代入している → 必ず<b>+273</b>してKに</li><li>MPaのまま代入している → <b>×10⁶</b>してPaに</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>気体の分子運動論、理想気体と実在気体の違いといった理屈は問われません。式に当てはめるだけです。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s3&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問3</span><span class=&quot;sec-t&quot;>熱力学の計算②</span></div><p class=&quot;sec-lead&quot;>問2の続き。使う式は4つだけです。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>モル熱容量のときだけ温度は「差」</b>。+273しません</li><li>それ以外はすべて<b>絶対温度（K）</b></li></ul></div></div><div class=&quot;calcbox&quot;><div class=&quot;box-h&quot;>計算のやり方</div><div class=&quot;pattern&quot;><div class=&quot;trig-lbl&quot;>この語が出たら</div><span class=&quot;tchip&quot;>定圧モル熱容量</span><span class=&quot;tchip&quot;>加熱するのに必要な熱量</span><span class=&quot;tchip&quot;>◯℃まで加熱</span><div class=&quot;f-box&quot;><div class=&quot;f&quot;>Q = n × Cm × ΔT</div><div class=&quot;fn&quot;>Cmを求めるなら Cm = Q ÷ (n × ΔT)。ΔTは温度差なので℃のまま引く</div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R2 問3</div><div class=&quot;ex-q&quot;>理想気体16 gを圧力一定で0℃から100℃まで加熱するのに1.5 kJ必要だった。定圧モル熱容量は。分子量32。</div><div class=&quot;ex-w&quot;><div>n = 16 ÷ 32 = 0.5 mol</div><div>ΔT = 100 − 0 = 100 K</div><div>Cm = 1500 ÷ (0.5 × 100)</div><div class=&quot;ex-ans&quot;>＝ 30 J/(mol・K)</div></div><div class=&quot;ex-warn&quot;>ここだけ<b>273を足しません</b>。温度の差だからです。</div></div></div><div class=&quot;pattern&quot;><div class=&quot;trig-lbl&quot;>この語が出たら</div><span class=&quot;tchip&quot;>圧縮係数</span><span class=&quot;tchip&quot;>圧縮率因子</span><div class=&quot;f-box&quot;><div class=&quot;f&quot;>z = p V / (n R T)</div><div class=&quot;fn&quot;>理想気体ならz＝1。実在気体では1からずれる（過去問の条件では1より小さい答えが多い）</div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R3 問3</div><div class=&quot;ex-q&quot;>0℃、30 MPaにおけるメタン3 molの体積は2.0×10⁻⁴ m³。圧縮係数に最も近いものは。</div><div class=&quot;ex-w&quot;><div>pV = 30×10⁶ × 2.0×10⁻⁴ = 6000</div><div>nRT = 3 × 8.314 × 273 = 6809</div><div class=&quot;ex-ans&quot;>＝ 6000 ÷ 6809 = 約0.88</div></div></div></div><div class=&quot;pattern&quot;><div class=&quot;trig-lbl&quot;>この語が出たら</div><span class=&quot;tchip&quot;>エントロピー変化</span><span class=&quot;tchip&quot;>蒸発潜熱</span><div class=&quot;f-box&quot;><div class=&quot;f&quot;>ΔS = Q / T</div><div class=&quot;fn&quot;>潜熱がkJ/molで与えられたら、まず質量をmolに直す</div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R1 問3</div><div class=&quot;ex-q&quot;>100℃の水1 kgの蒸発のエントロピー変化は。蒸発潜熱は40.7 kJ/mol。</div><div class=&quot;ex-w&quot;><div>n = 1000 ÷ 18 = 55.6 mol　（水の分子量18）</div><div>ΔS = 55.6 × 40.7 ÷ (100+273)</div><div class=&quot;ex-ans&quot;>＝ 約6 kJ/K</div></div></div></div><div class=&quot;pattern&quot;><div class=&quot;trig-lbl&quot;>この語が出たら</div><span class=&quot;tchip&quot;>カルノーサイクル</span><span class=&quot;tchip&quot;>熱効率</span><div class=&quot;f-box&quot;><div class=&quot;f&quot;>η = 1 − T低 / T高</div><div class=&quot;fn&quot;>必ずK。温度の「差」ではなく「比」を1から引く</div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R4 問3</div><div class=&quot;ex-q&quot;>150℃の高熱源と20℃の低熱源の間で作動するカルノーサイクルの熱効率は。</div><div class=&quot;ex-w&quot;><div>η = 1 − (20+273) ÷ (150+273)</div><div>= 1 − 293 ÷ 423</div><div class=&quot;ex-ans&quot;>＝ 約0.31</div></div></div></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>熱効率で温度の<b>差</b>を使っている → 比を1から引くので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>エンタルピーや内部エネルギーの定義を理解する必要はありません。式に入れるだけです。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s4&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問4</span><span class=&quot;sec-t&quot;>熱力学の記述</span></div><p class=&quot;sec-lead&quot;>言葉のすり替えを見抜くだけ。計算はありません。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>断熱変化＝「熱」の出入りがない</b></li><li><b>自然に起こる変化＝ギブズエネルギーが「減少」する方向</b></li><li><b>カルノーサイクル＝熱効率が最大となる理想サイクル</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「<b>仕事</b>の出入りがない状態変化を断熱変化という」→ 熱なので✕</li><li>「自然に起こる変化はギブズエネルギーが<b>増加</b>する方向」→ ✕</li><li>「断熱圧縮では温度は<b>変化しない</b>」→ 上昇するので✕</li><li>「機械的仕事が熱に変換されるときエネルギーの総量は<b>減少</b>する」→ 保存されるので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>エンタルピー、内部エネルギーの定義文は素直な内容で○になります。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s5&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問5</span><span class=&quot;sec-t&quot;>反応速度</span></div><p class=&quot;sec-lead&quot;>触媒と反応次数。この2点だけ狙われます。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>触媒は活性化エネルギーを下げて速度を上げるが、平衡は動かさない</b></li><li><b>反応次数は実験で決まる</b>（反応式の係数とは限らない）</li><li><b>アレニウス式は指数関数</b>　k = A・exp(−E/RT)</li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「触媒により<b>平衡が生成物側へ移動</b>する」→ ✕</li><li>「反応次数は<b>反応式の係数</b>と一致する」→ ✕</li><li>「速度定数は温度の<b>べき関数</b>」→ 指数関数なので✕</li><li>「超臨界反応では触媒は<b>不要</b>である」→ ✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>活性化エネルギーが大きいほど温度の影響を強く受ける、という向きだけ押さえれば足ります。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s6&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問6</span><span class=&quot;sec-t&quot;>化学反応式の係数</span></div><p class=&quot;sec-lead&quot;>数えるだけ。計算不要の得点源です。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li>左右で<b>C・H・O・Nの数を合わせる</b>だけ</li><li>選択肢に係数の組が並んでいるので、<b>Cの数だけで大半が絞れる</b></li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>反応の意味を理解する必要はまったくありません。原子を数えるだけです。問1と並んで確実に取りたい問題。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s7&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問7</span><span class=&quot;sec-t&quot;>化学平衡</span></div><p class=&quot;sec-lead&quot;>ルシャトリエと、平衡の定義。5年連続で同じ論点です。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>化学平衡＝正反応と逆反応の速度が「等しい」</b>（0ではない）</li><li><b>圧力を上げる → 気体の分子数が減る方向へ</b></li><li><b>温度を上げる → 吸熱方向へ</b></li><li><b>平衡定数は温度だけで決まる</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「化学平衡とは正反応と逆反応の速度が<b>ともに0</b>になった状態」→ 等しいだけなので✕</li><li>「圧力を高くすると平衡は体積が<b>増加</b>する方向に移動」→ 減少方向なので✕</li><li>「不可逆反応では化学平衡の計算は<b>できない</b>」→ ✕</li><li>「触媒により<b>平衡定数が大きく</b>なる」→ ✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>題材はほぼアンモニア合成です。<b>発熱・分子数が減る</b>反応なので<b>低温・高圧</b>が有利、とだけ覚えておけば応用が効きます。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s8&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問8</span><span class=&quot;sec-t&quot;>エンタルピー計算</span></div><p class=&quot;sec-lead&quot;>5年分すべてが、たった1つの式で解けます。ここは絶対に落とさないでください。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>394と286は毎年同じ数字</b>（二酸化炭素と水の標準生成エンタルピー）</li><li>単体（O₂・N₂・H₂・C）の標準生成エンタルピーは<b>すべて0</b></li></ul></div></div><div class=&quot;calcbox&quot;><div class=&quot;box-h&quot;>計算のやり方</div><div class=&quot;pattern&quot;><div class=&quot;trig-lbl&quot;>この語が出たら</div><span class=&quot;tchip&quot;>標準生成エンタルピー</span><span class=&quot;tchip&quot;>標準燃焼エンタルピー</span><span class=&quot;tchip&quot;>燃焼熱</span><span class=&quot;tchip&quot;>総発熱量</span><div class=&quot;f-box&quot;><div class=&quot;f&quot;>Q = 394×C数 + 286×(H数÷2) + 燃料の値</div><div class=&quot;fn&quot;>C数・H数は燃料の分子式から数えるだけ。「燃料の値」は与えられた標準生成エンタルピーを<b>符号ごとそのまま</b>足す</div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R4 問8　プロパン C₃H₈（燃料の値が −105）</div><div class=&quot;ex-q&quot;>プロパンの燃焼熱はおよそいくらか。</div><div class=&quot;ex-w&quot;><div>C数は3、H数は8　→　水の係数は 8÷2 = 4</div><div>394×3 + 286×4 + (−105)</div><div>= 1182 + 1144 − 105</div><div class=&quot;ex-ans&quot;>＝ 約2220 kJ/mol</div></div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R5 問8　ベンゼン C₆H₆（燃料の値が ＋49）</div><div class=&quot;ex-q&quot;>燃料の値がプラスでも、そのまま足すだけです。</div><div class=&quot;ex-w&quot;><div>394×6 + 286×3 + (＋49)</div><div>= 2364 + 858 + 49</div><div class=&quot;ex-ans&quot;>＝ 3271 kJ/mol</div></div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R1 問8　逆に生成エンタルピーを聞かれた例</div><div class=&quot;ex-q&quot;>アセチレン C₂H₂ の標準燃焼エンタルピーは −1300。標準生成エンタルピーは。</div><div class=&quot;ex-w&quot;><div>1300 = 394×2 + 286×1 + x</div><div>1300 = 1074 + x</div><div class=&quot;ex-ans&quot;>＝ x = 226 kJ/mol</div></div><div class=&quot;ex-warn&quot;>式を左に置いて、<b>xを求める形に移項するだけ</b>です。</div></div></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>単体の値を<b>0以外</b>にしている → ✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>符号は、<b>燃焼熱・総発熱量ならプラス</b>、<b>燃焼エンタルピーならマイナス</b>を付けて答えます。それ以外の熱力学の理屈は不要です。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s9&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問9</span><span class=&quot;sec-t&quot;>ガスの分類・必要空気量</span></div><p class=&quot;sec-lead&quot;>3グループの暗記と、割り算1回の計算です。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>分解爆発性</b>：C₂H₂ アセチレン／C₂H₄O 酸化エチレン／N₂O 亜酸化窒素／O₃ オゾン／N₂H₄ ヒドラジン／GeH₄ モノゲルマン</li><li><b>自然発火性</b>：SiH₄ シラン／B₂H₆ ジボラン／PH₃ ホスフィン／AsH₃ アルシン／Si₂H₆ ジシラン</li><li><b>支燃性</b>：O₂ 酸素／Cl₂ 塩素／F₂ フッ素／N₂O 亜酸化窒素</li></ul></div></div><div class=&quot;calcbox&quot;><div class=&quot;box-h&quot;>計算のやり方</div><div class=&quot;pattern&quot;><div class=&quot;trig-lbl&quot;>この語が出たら</div><span class=&quot;tchip&quot;>必要な空気量</span><span class=&quot;tchip&quot;>完全燃焼させるのに</span><span class=&quot;tchip&quot;>酸素濃度21 vol%</span><div class=&quot;f-box&quot;><div class=&quot;f&quot;>空気量 ＝ 酸素の係数 ÷ 0.21</div><div class=&quot;fn&quot;>kgで聞かれたら → 燃料をmolに直す → 酸素molを出す → ÷0.21 → ×29÷1000（空気の分子量29）</div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R2 問8　mol で聞かれた場合</div><div class=&quot;ex-q&quot;>プロペン1 molの完全燃焼に必要な空気量は。</div><div class=&quot;ex-w&quot;><div>C₃H₆ + 4.5O₂ → 3CO₂ + 3H₂O</div><div>4.5 ÷ 0.21</div><div class=&quot;ex-ans&quot;>＝ 約22 mol</div></div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R3 問9　kg で聞かれた場合</div><div class=&quot;ex-q&quot;>メタン1 kgの完全燃焼に必要な空気量は。</div><div class=&quot;ex-w&quot;><div>1000 ÷ 16 = 62.5 mol　（メタンの分子量16）</div><div>CH₄ + 2O₂ なので 酸素は 62.5×2 = 125 mol</div><div>空気 = 125 ÷ 0.21 = 595 mol</div><div class=&quot;ex-ans&quot;>＝ 595 × 29 ÷ 1000 = 約17.3 kg</div></div><div class=&quot;ex-warn&quot;>kgで聞かれたら最後に×29÷1000（空気の分子量29、gをkgに）を忘れないでください。</div></div></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「分解爆発には<b>空気（酸素）が必要</b>」→ 単独で爆発するので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p><b>N₂O 亜酸化窒素は支燃性かつ分解爆発性</b>の両方に入ります。ここが毎年狙われるので、これだけは別で覚えてください。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s10&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問10</span><span class=&quot;sec-t&quot;>爆発下限界・爆風</span></div><p class=&quot;sec-lead&quot;>暗記した数値を当てはめるだけ。理屈は不要です。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>分子が大きいほど下限界は小さい</b>：CH₄ メタン5.0＞C₂H₆ エタン3.0＞C₃H₈ プロパン2.1＞C₄H₁₀ ブタン1.8</li><li>H₂ 水素4.0／C₂H₂ アセチレン2.5／C₂H₄ エチレン2.7／NH₃ アンモニア15</li></ul></div></div><div class=&quot;calcbox&quot;><div class=&quot;box-h&quot;>計算のやり方</div><div class=&quot;pattern&quot;><div class=&quot;trig-lbl&quot;>この語が出たら</div><span class=&quot;tchip&quot;>混合ガスの爆発下限界</span><span class=&quot;tchip&quot;>ル・シャトリエ</span><span class=&quot;tchip&quot;>濃度の組合せ</span><div class=&quot;f-box&quot;><div class=&quot;f&quot;>100 / L ＝ Σ ( C / L )</div><div class=&quot;fn&quot;>Lは混合ガスの下限界、Cは各成分の濃度、分母は各成分の下限界</div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R1 問11　選択肢を順に当てはめるのが速い</div><div class=&quot;ex-q&quot;>混合ガスの爆発下限界が3.7のとき、正しい組成の組合せは。</div><div class=&quot;ex-w&quot;><div>まず目標値を出す：100 ÷ 3.7 = 27.0</div><div>選択肢(5) メタン60・エタン30・プロパン10 を試す</div><div>60/5.0 + 30/3.0 + 10/2.1 = 12 + 10 + 4.8 = 26.8</div><div class=&quot;ex-ans&quot;>＝ 27.0に最も近いので(5)が正解</div></div><div class=&quot;ex-warn&quot;>式を解こうとせず、<b>選択肢を1つずつ入れて近い値を探す</b>方が確実で速いです。</div></div></div><div class=&quot;pattern&quot;><div class=&quot;trig-lbl&quot;>この語が出たら</div><span class=&quot;tchip&quot;>ホプキンソン</span><span class=&quot;tchip&quot;>三乗根法則</span><span class=&quot;tchip&quot;>ピーク過圧</span><span class=&quot;tchip&quot;>換算距離</span><div class=&quot;f-box&quot;><div class=&quot;f&quot;>λ = R / ∛M</div><div class=&quot;fn&quot;>同じ過圧が観測された＝λが等しい。変形すると M₂ = M₁ ×（R₂/R₁）³</div></div><div class=&quot;ex&quot;><div class=&quot;ex-lbl&quot;>R1 問10</div><div class=&quot;ex-q&quot;>1 kgの爆発物の20 m地点と同じ過圧が16 m地点で観測された。その爆発物の質量は。</div><div class=&quot;ex-w&quot;><div>M₂ = 1 × (16 ÷ 20)³</div><div>= 0.8³ = 0.512 kg</div><div class=&quot;ex-ans&quot;>＝ 512 g</div></div></div></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「ホプキンソンの<b>平方根</b>法則」→ 三乗根なので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>下限界の暗記は<b>CH₄ メタン5.0とNH₃ アンモニア15</b>を軸にすれば十分です。この2つが両端の目印になります。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s11&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問11</span><span class=&quot;sec-t&quot;>最小発火エネルギー・連鎖反応</span></div><p class=&quot;sec-lead&quot;>両端だけ覚えれば順序問題は取れます。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>最小発火エネルギーが極小＝H₂ 水素・C₂H₂ アセチレン</b></li><li><b>極大＝NH₃ アンモニア</b>（水素の約1000倍）</li><li><b>連鎖成長＝ラジカルの数が変わらない</b>／<b>連鎖分岐＝数が増える</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「最小発火エネルギーは<b>種類によらず</b>ほぼ同じ」→ ✕</li><li>「連鎖発火理論では活性化学種の<b>種類</b>が増加すれば発火する」→ 「数」なので✕</li><li>「第三体はラジカルのエネルギーを<b>増加</b>し反応を加速」→ 安定化させるので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>連鎖成長か分岐かは、<b>矢印の右側のラジカルを数えるだけ</b>。1個→1個なら成長、1個→2個なら分岐です。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s12&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問12</span><span class=&quot;sec-t&quot;>燃焼速度・静電気</span></div><p class=&quot;sec-lead&quot;>順序と向きだけ。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li>燃焼速度の順：<b>H₂ 水素＞C₂H₂ アセチレン＞C₂H₄ エチレン＞C₃H₈ プロパン・CH₄ メタン</b></li><li><b>爆燃＝音速以下</b>／<b>爆ごう＝音速超え</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「<b>爆燃</b>で発生する爆風は音速より<b>速く</b>伝ぱ」→ ✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>燃焼速度の順は、最小発火エネルギーが小さい順とほぼ同じです。<b>水素が先頭</b>とだけ覚えれば足ります。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s13&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問13</span><span class=&quot;sec-t&quot;>消炎距離・爆ごう</span></div><p class=&quot;sec-lead&quot;>「最大」と「最小」の取り違えを狙われます。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>消炎距離＝火炎が消える「最大」のすき間</b>（定義）</li><li><b>化学量論組成付近で、消炎距離と最小発火エネルギーは「最小」</b></li><li><b>化学量論組成付近で、燃焼速度は「最大」</b></li><li><b>圧力が高いほど爆ごう誘導距離は短くなる</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「消炎距離は化学量論組成付近で<b>最大</b>となる」→ 最小なので✕</li><li>「爆ごうは<b>どんな細い管でも</b>伝ぱする」→ 最大安全すき間があるので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p><b>燃焼速度だけが「最大」</b>、あとは「最小」。この1行だけ覚えてください。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s14&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問14</span><span class=&quot;sec-t&quot;>個別ガスの性質①</span></div><p class=&quot;sec-lead&quot;>問15と合わせて、分子量29の判定と毒性だけ。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li>基準は<b>空気の分子量29</b>。分子式から足し算で出せます</li><li><b>HCN シアン化水素＝1+12+14＝27で「軽い」</b></li><li><b>COCl₂ ホスゲン＝12+16+35.5×2＝99で「重い」</b></li><li>液体空気の精留で酸素と窒素は<b>分離できる</b>（沸点差がある）</li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「シアン化水素 HCN は空気より<b>重い</b>」→ 27なので軽い。✕</li><li>「酸素と窒素は沸点差がほとんどなく<b>分離できない</b>」→ 液化分離法で分離するので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>原子の重さは <b>H=1／C=12／N=14／O=16／F=19／S=32／Cl=35.5</b> の7つだけ覚えれば、分子量はその場で足し算で出せます。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s15&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問15</span><span class=&quot;sec-t&quot;>個別ガスの性質②</span></div><p class=&quot;sec-lead&quot;>問14の続き。可燃性か不燃性かを確認するだけ。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>CO 一酸化炭素＝可燃性・無色無臭・毒性あり</b></li><li><b>CO₂ 二酸化炭素＝不燃性・水に溶ける</b></li><li><b>F₂ フッ素＝常温でほとんどの金属と反応</b></li><li><b>B₂H₆ ジボラン＝自然発火性・毒性</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「一酸化炭素 CO は<b>不燃性</b>」→ ✕</li><li>「二酸化炭素 CO₂ は<b>可燃性</b>」「水に<b>ほとんど溶けない</b>」→ どちらも✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>ガスの用途（麻酔ガス、冷媒など）は覚えなくて構いません。可燃性・毒性・比重の3つで大半が判定できます。</p></div></div></section><div class=&quot;rules&quot;><div class=&quot;rules-h&quot;>単位で落とさないための3つの鉄則</div><div class=&quot;rule&quot;><div class=&quot;rule-t&quot;><span>1.</span>温度は「絶対温度」か「差」かを最初に判定</div><div class=&quot;rule-b&quot;>式に <code>T</code> が単独で入るなら <code>+273</code>。<code>ΔT</code>（温度差）なら℃のまま引き算。<br>単独で入る＝問2・問3の大半。差になるのは<b>モル熱容量だけ</b>です。</div></div><div class=&quot;rule&quot;><div class=&quot;rule-t&quot;><span>2.</span>R＝8.314 を使うなら Pa と m³ に揃える</div><div class=&quot;rule-b&quot;><code>MPa → ×10⁶</code>　<code>kPa → ×10³</code>　<code>L → ×10⁻³ m³</code><br>忘れると答えが1000倍ずれます。選択肢に「けた違いの似た数字」が並んでいたら、この罠です。</div></div><div class=&quot;rule&quot;><div class=&quot;rule-t&quot;><span>3.</span>ゲージ圧力と書いてあったら +0.1 MPa</div><div class=&quot;rule-b&quot;>式に入れる圧力は必ず<b>絶対圧力</b>。<code>絶対圧力 = ゲージ圧力 + 大気圧(0.1 MPa)</code><br>何も書いていなければ絶対圧力としてそのまま使います。</div></div></div></section>
  <section class=&quot;panel&quot; id=&quot;p-quiz&quot;><div class=&quot;lead&quot;>過去問<b>105問</b>を1問ずつ解きます。選択肢をタップすると、その選択肢が正解／不正解である理由が全部出ます。下のチップで<b>年度別</b>に絞れます。進み具合は自動で保存されます。</div><div class=&quot;yearbox&quot;><div class=&quot;yearbox-h&quot;>年度を選ぶ</div><div class=&quot;cats&quot; id=&quot;catBar&quot;></div></div><div class=&quot;progress-row&quot;><span class=&quot;progress-label&quot; id=&quot;progLabel&quot;>1 / 1</span><div class=&quot;progress-track&quot;><div class=&quot;progress-fill&quot; id=&quot;progFill&quot; style=&quot;width:0%&quot;></div></div><span class=&quot;score-label&quot; id=&quot;scoreLabel&quot;>正解 0</span></div><div class=&quot;card&quot; id=&quot;quizCard&quot;></div></section>
  <section class=&quot;panel&quot; id=&quot;p-calc&quot;><div class=&quot;lead&quot; id=&quot;kcTop&quot;>計算は<b>全14型</b>。問題文の言葉で型を選び、<b>電卓キーの順</b>に打つだけです。
各型の「過去問で確認」は実際の出題、「数字を変えて試す」は自分の問題の検算に使えます。</div>
<div class=&quot;rules-h&quot;>問題文のこの言葉をタップ</div>
<div class=&quot;kc-finder&quot; id=&quot;kcFinder&quot;></div>
<div class=&quot;rules-h kc-mt&quot;>解く手順は4つだけ</div>
<div class=&quot;csteps&quot;><div class=&quot;cstep&quot;><div class=&quot;cstep-t&quot;>問題の<b>最後の一文</b>だけ読む</div><div class=&quot;cstep-b&quot;>「〜はおよそいくらか」の〜が求めるものです。</div></div><div class=&quot;cstep&quot;><div class=&quot;cstep-t&quot;>上の言葉から<b>型を選ぶ</b></div><div class=&quot;cstep-b&quot;>言葉で式が1つに決まります。</div></div><div class=&quot;cstep&quot;><div class=&quot;cstep-t&quot;><b>単位を直す</b>（下の表）</div><div class=&quot;cstep-b&quot;>失点の9割はここです。</div></div><div class=&quot;cstep&quot;><div class=&quot;cstep-t&quot;><b>電卓キーの順</b>に打つ</div><div class=&quot;cstep-b&quot;>式は変形ずみ。左から順に押すだけです。</div></div></div>
<div class=&quot;rules-h kc-mt&quot;>温度は +273 する？しない？</div>
<div class=&quot;kc-tt&quot;><div class=&quot;k&quot;><b>+273 して K に</b>体積・密度・モル質量・シャルル・圧縮係数・エントロピー・カルノー</div><div class=&quot;d&quot;><b>℃のまま引き算（差）</b>モル熱容量だけ</div><div class=&quot;n&quot;><b>温度を使わない</b>燃焼熱・必要空気量・分圧・爆発下限界・ホプキンソン・バージェス・ホイーラー</div></div>
<div class=&quot;ubox&quot;><table class=&quot;utbl&quot;><tbody><tr><td>MPa → Pa</td><td><span class=&quot;ueg&quot;>×10⁶</span><div class=&quot;unote&quot;>0.3 MPa → 300000</div></td></tr><tr><td>kPa → Pa</td><td><span class=&quot;ueg&quot;>×10³</span><div class=&quot;unote&quot;>101.3 kPa → 101300</div></td></tr><tr><td>L → m³</td><td><span class=&quot;ueg&quot;>×10⁻³</span><div class=&quot;unote&quot;>5 L → 0.005。答えが1000倍ずれたらたいていこれ</div></td></tr><tr><td>g/mol → kg/mol</td><td><span class=&quot;ueg&quot;>÷1000</span><div class=&quot;unote&quot;>28 → 0.028（密度の型）</div></td></tr><tr><td>kJ → J</td><td><span class=&quot;ueg&quot;>×1000</span><div class=&quot;unote&quot;>1.5 kJ → 1500（モル熱容量）</div></td></tr><tr><td>ゲージ圧力</td><td><span class=&quot;ueg&quot;>+0.1 MPa</span><div class=&quot;unote&quot;>書いてなければそのまま</div></td></tr></tbody></table></div>
<div id=&quot;kcCards&quot;></div>
<div class=&quot;closing&quot;>毎年かならず出るのは <b>問2・問3・問8</b> の3つだけです。
そのうち<b>問8がいちばん簡単</b>なので、まずここから手をつけてください。
学識は暗記だけで11問取れて、合格は9問です。<b>計算が全部できなくても受かります。</b></div>
<a class=&quot;top&quot; href=&quot;#kcTop&quot;>▲ 計算の先頭へ</a></section>
  <section class=&quot;panel&quot; id=&quot;p-kw&quot;><div class=&quot;lead&quot;>誤り選択肢の作り方は<b>4つの型</b>しかありません。中身がわからなくても、言い回しだけで✕を外せます。<b>5択のうち2つ外れれば正答率は倍</b>です。</div><div class=&quot;kwgrp&quot;><div class=&quot;rules-h&quot;>① 地雷ワード</div><div class=&quot;mine&quot;><div class=&quot;mine-head&quot;><div class=&quot;mine-x&quot;>この言い回しが出たら</div><div class=&quot;mine-p&quot;>必要ない／不要／考えなくてよい／〜しなかった</div><span class=&quot;mine-stat&quot;>過去7年 7回登場 → 7回とも✕</span></div><div class=&quot;mine-why&quot;>保安の試験は「やらなくていい」と言い切る文をまず疑う設計になっています。安全側の手間を省く記述はまず正解になりません。</div><div class=&quot;mine-ex&quot;><div class=&quot;mine-ex-lbl&quot;>実際に出た文</div><p>金属ガスケットは復元力が大きく、高温増し締めは<b>必要ない</b>。</p><p>破裂板は破裂するまで使えるので、定期的に交換する<b>必要がない</b>。</p><p>往復ポンプはNPSHを<b>考えなくてもよい</b>。</p><p>雪や氷の荷重は考慮したが、風圧による荷重は<b>考慮しなかった</b>。</p><p>改定理由を明記したので、運転員への教育を<b>実施しなかった</b>。</p><p>対応策で生じる新しいハザードの発生可能性は<b>考えなくてもよい</b>。（R2・R7保安 問9で連続出題）</p></div></div><div class=&quot;mine&quot;><div class=&quot;mine-head&quot;><div class=&quot;mine-x&quot;>この言い回しが出たら</div><div class=&quot;mine-p&quot;>できない／適さない／適用できない／取り付けてはならない</div><span class=&quot;mine-stat&quot;>過去7年 18回登場 → 17回が✕</span></div><div class=&quot;mine-why&quot;>「この方法は使えない」と範囲を狭める文も、たいてい言い過ぎです。実際は条件付きで使えることがほとんど。</div><div class=&quot;mine-ex&quot;><div class=&quot;mine-ex-lbl&quot;>実際に出た文</div><p>超音波探傷試験は材料表面の欠陥の検出には<b>適用できない</b>。（表面波で可能）</p><p>ブルドン管圧力計は負のゲージ圧力の測定には<b>使用できない</b>。（可能）</p><p>HAZOPはバッチ反応系には<b>適さない</b>。（適用できる手法がある）</p><p>オイルフィルムシールはアンモニアガスには<b>適用できない</b>。（むしろ適用対象）</p><p>スイング逆止弁は垂直配管に<b>取り付けてはならない</b>。（取り付け可）</p><p>半導体式ガス検知器は毒性ガスの検知には<b>適さない</b>。（毒性ガス用の製品もある）</p><p>浸透探傷試験は非金属には<b>適用できない</b>。（表面が多孔質でなければ、セラミックスやプラスチックなど非金属にも使える）</p></div><div class=&quot;mine-why&quot;>唯一の例外は「破裂板は圧力上昇が速く<b>不適当</b>な場合に効果的」（R3保安 問11）。これは○です。</div></div><div class=&quot;mine&quot;><div class=&quot;mine-head&quot;><div class=&quot;mine-x&quot;>この言い回しが出たら</div><div class=&quot;mine-p&quot;>影響はない／変化しない／可能性はない</div><span class=&quot;mine-stat&quot;>出れば✕がほぼ確定</span></div><div class=&quot;mine-why&quot;>何かが起きても無害だと言い切る文は、危険を見落とさせるための誤り選択肢です。</div><div class=&quot;mine-ex&quot;><div class=&quot;mine-ex-lbl&quot;>実際に出た文</div><p>加熱管の局部的な輝度上昇は、管の強度への<b>影響はない</b>。（過昇温で破壊のおそれ）</p><p>断熱圧縮では温度は<b>変化しない</b>。（上昇する）</p><p>液密度が高くなっても原動機の過負荷の<b>可能性はない</b>。（過負荷になり得る）</p><p>圧力が上昇しても最小発火エネルギーは<b>変化しない</b>。（著しく低下する）</p></div></div><div class=&quot;mine&quot;><div class=&quot;mine-head&quot;><div class=&quot;mine-x&quot;>この言い回しが出たら</div><div class=&quot;mine-p&quot;>種類によらず／に関係なく／いずれも同じ</div><span class=&quot;mine-stat&quot;>過去7年 8回登場 → 6回が✕</span></div><div class=&quot;mine-why&quot;>物質ごとに値が違うからこそ試験問題になります。「どれも同じ」は成立しません。</div><div class=&quot;mine-ex&quot;><div class=&quot;mine-ex-lbl&quot;>実際に出た文</div><p>最小発火エネルギーは可燃性混合ガスの<b>種類によらず</b>ほぼ同じ。（水素とアンモニアで約1000倍違う）</p><p>不活性ガスの効果は、体積比率が同じなら<b>種類によらず</b>同じ。（二酸化炭素＞窒素）</p><p>接地による静電気の低減速度は、導電率が違っても<b>同じ</b>。（導電率で変わる）</p><p>ヘンリーの法則で溶ける気体の量は分圧に<b>よらず一定</b>。（実際は分圧に比例する）</p><p>圧力を高くすると融点・凝固点は物質の<b>種類に関係なく</b>上がる。（水は逆に下がる例外あり）</p></div></div><div class=&quot;mine&quot;><div class=&quot;mine-head&quot;><div class=&quot;mine-x&quot;>この言い回しが出たら</div><div class=&quot;mine-p&quot;>必ず／すべて／だけ</div><span class=&quot;mine-stat&quot;>言い切りは半分以上が✕</span></div><div class=&quot;mine-why&quot;>完全に言い切る文は例外が1つあれば崩れます。ただし定義を述べる文では正しいこともあるので、地雷ワードの中ではやや弱め(過去7年で6回登場、✕は3回・○も3回と五分五分)。</div><div class=&quot;mine-ex&quot;><div class=&quot;mine-ex-lbl&quot;>実際に出た文</div><p>不導体に蓄積した静電エネルギーの<b>全部が必ず</b>一度に放電する。（一部のことがある）</p><p>リスク評価は社外の第三者によって行われ<b>なければならない</b>。（社内でよい）</p><p>爆ごうはどんな細い管の中でも伝ぱする。（管径が細すぎると伝ぱできない）</p></div></div></div><div class=&quot;kwgrp&quot;><div class=&quot;rules-h&quot;>② どっちがどっち</div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>学識 問12・13 爆風</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>ホプキンソンの三乗根法則</div><div class=&quot;pair-desc&quot;>λ = R / ∛M　これが正しい。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>平方根法則</div><div class=&quot;pair-desc&quot;>と書いてあれば<b>✕</b>。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>爆風・換算距離が出たら必ず三乗根。5年間で表現を変えて何度も出ています。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>学識 問13 爆発</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>爆燃</div><div class=&quot;pair-desc&quot;>火炎が<b>音速以下</b>で伝ぱ。通常の爆発。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>爆ごう</div><div class=&quot;pair-desc&quot;>火炎が<b>音速を超えて</b>伝ぱ。衝撃波と反応帯が一体。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>「爆燃の爆風は音速より速い」は✕。爆ごう誘導距離＝爆ごうに転移するまでの助走距離。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>学識 問11・13 連鎖反応</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>連鎖成長反応</div><div class=&quot;pair-desc&quot;>ラジカルの<b>数が変わらない</b>。例：OH + H₂ → H₂O + H</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>連鎖分岐反応</div><div class=&quot;pair-desc&quot;>ラジカルの<b>数が増える</b>。例：H + O₂ → OH + O</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>生成物側のラジカルを数えるだけ。1個→1個なら成長、1個→2個なら分岐。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>学識 問4 熱力学</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>断熱変化</div><div class=&quot;pair-desc&quot;><b>熱</b>の出入りがない状態変化。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>（誤りの記述）</div><div class=&quot;pair-desc&quot;>「<b>仕事</b>の出入りがない」と書かれていたら✕。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>断「熱」なので熱。ここを仕事にすり替えるのが定番。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>学識 問7 化学平衡</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>化学平衡の状態</div><div class=&quot;pair-desc&quot;>正反応と逆反応の速度が<b>等しい</b>（見かけ上停止）。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>（誤りの記述）</div><div class=&quot;pair-desc&quot;>「速度がともに<b>0</b>である」と書かれていたら✕。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>止まっているのではなく、行きと帰りが釣り合っているだけ。R3・R4で連続出題。</div></div></div><div class=&quot;kwgrp&quot;><div class=&quot;rules-h&quot;>③ 向きで覚える</div><div class=&quot;dgrp&quot;><div class=&quot;dgrp-h&quot;>燃焼・爆発</div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>圧力を上げる</div><div class=&quot;dthen&quot;>爆発範囲は<b>広がる</b>（下限界↓・上限界↑）</div><div class=&quot;dnote&quot;>「狭くなる」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>温度を上げる</div><div class=&quot;dthen&quot;>爆発範囲は<b>広がる</b></div><div class=&quot;dnote&quot;>同上</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>空気中 → 酸素中</div><div class=&quot;dthen&quot;>爆発範囲は<b>広がる</b></div><div class=&quot;dnote&quot;>「酸素中では狭くなる」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>圧力を上げる</div><div class=&quot;dthen&quot;>消炎距離は<b>小さく</b>なる</div><div class=&quot;dnote&quot;>「大きくなる」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>圧力を上げる</div><div class=&quot;dthen&quot;>最小発火エネルギーは<b>低下</b></div><div class=&quot;dnote&quot;>「変化しない」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>化学量論組成に近づく</div><div class=&quot;dthen&quot;>消炎距離・最小発火エネルギーは<b>最小</b></div><div class=&quot;dnote&quot;>この2つは最小</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>化学量論組成に近づく</div><div class=&quot;dthen&quot;>燃焼速度は<b>最大</b></div><div class=&quot;dnote&quot;>これだけ最大。取り違えが定番</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>最大安全すき間と消炎距離</div><div class=&quot;dthen&quot;>最大安全すき間の方が<b>小さい</b></div></div></div><div class=&quot;dgrp&quot;><div class=&quot;dgrp-h&quot;>化学平衡・熱力学</div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>圧力を上げる</div><div class=&quot;dthen&quot;>気体の<b>分子数が減る</b>方向へ移動</div><div class=&quot;dnote&quot;>体積が増える方向は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>温度を上げる</div><div class=&quot;dthen&quot;><b>吸熱</b>方向へ移動</div><div class=&quot;dnote&quot;>発熱反応なら生成物が減る</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>自然に起こる変化</div><div class=&quot;dthen&quot;>ギブズエネルギーが<b>減少</b>する方向</div><div class=&quot;dnote&quot;>「増加」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>触媒を加える</div><div class=&quot;dthen&quot;>速度は上がるが<b>平衡は動かない</b></div><div class=&quot;dnote&quot;>平衡定数も変わらない</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>平衡定数 K</div><div class=&quot;dthen&quot;><b>温度だけ</b>で決まる</div><div class=&quot;dnote&quot;>圧力・濃度・触媒では変わらない</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>断熱圧縮</div><div class=&quot;dthen&quot;>温度は<b>上昇</b>する</div><div class=&quot;dnote&quot;>「変化しない」は✕</div></div></div></div><div class=&quot;kwgrp&quot;><div class=&quot;rules-h&quot;>④ 数字で覚える</div><div class=&quot;num&quot;><div class=&quot;num-h&quot;>ガスの見分け方 ─ 基準は空気の分子量29</div><table class=&quot;num-t&quot;><tr><td>空気より<b>重い</b></td><td>塩素71／ホスゲン99／硫化水素34／二酸化炭素44／プロパン44／ブタン58</td><td>漏えい時は低所に滞留</td></tr><tr><td>空気より<b>軽い</b></td><td>水素2／メタン16／アンモニア17／シアン化水素27／一酸化炭素28</td><td>漏えい時は上方へ拡散</td></tr></table><div class=&quot;tips&quot;><p class=&quot;tip&quot;><b>シアン化水素27は「軽い」</b>。毒性が強いので重そうに見えるのが罠。最頻出。</p><p class=&quot;tip&quot;><b>メタン16も「軽い」</b>。「空気より重く低所に滞留」と書いてあれば✕。</p><p class=&quot;tip&quot;><b>一酸化炭素は可燃性</b>（不燃性は✕）。<b>二酸化炭素は不燃性</b>（可燃性は✕）。</p></div></div><div class=&quot;num&quot;><div class=&quot;num-h&quot;>爆発下限界と最小発火エネルギー</div><table class=&quot;num-t&quot;><tr><td>水素</td><td>下限界 4.0 vol%</td><td>最小発火エネルギー 0.016 mJ ＝最小クラス</td></tr><tr><td>アセチレン</td><td>2.5 vol%</td><td>0.019 mJ</td></tr><tr><td>エチレン</td><td>2.7 vol%</td><td>0.07 mJ</td></tr><tr><td>エタン</td><td>3.0 vol%</td><td>0.25 mJ</td></tr><tr><td>プロパン</td><td>2.1 vol%</td><td>0.25 mJ</td></tr><tr><td>ブタン</td><td>1.8 vol%</td><td>0.25 mJ</td></tr><tr><td>メタン</td><td>5.0 vol%</td><td>0.28 mJ</td></tr><tr><td>アンモニア</td><td>15 vol%</td><td>14 mJ ＝最大クラス</td></tr></table><div class=&quot;tips&quot;><p class=&quot;tip&quot;><b>下限界は分子が大きいほど小さい</b>。メタン5.0＞エタン3.0＞プロパン2.1＞ブタン1.8。並べ替え問題はこれで解けます。</p><p class=&quot;tip&quot;><b>最小発火エネルギーは水素・アセチレンが極小、アンモニアが極大</b>。両端だけ押さえれば順序問題は落としません。</p></div></div><div class=&quot;num&quot;><div class=&quot;num-h&quot;>試験に出る「決まった数字」</div><table class=&quot;num-t&quot;><tr><td>窒素置換の基準</td><td>爆発下限界の <b>1/4以下</b></td><td>「爆発下限界以下」は✕</td></tr><tr><td>入槽前の酸素濃度</td><td><b>18〜22 vol%</b></td><td>入る前に測定する。入ってからは✕</td></tr><tr><td>空気中の酸素濃度</td><td><b>21 vol%</b></td><td>必要空気量＝酸素mol÷0.21</td></tr><tr><td>空気の平均分子量</td><td><b>29</b></td><td></td></tr><tr><td>大気圧</td><td><b>0.1013 MPa</b></td><td>ゲージ圧力に足すと絶対圧力</td></tr><tr><td>緊急遮断装置の操作場所</td><td>貯槽外面から <b>5m以上</b></td><td>コンビナート則なら10m以上</td></tr><tr><td>CO₂・H₂Oの標準生成エンタルピー</td><td><b>−394</b>／<b>−286</b> kJ/mol</td><td>問8はこの2つで解ける</td></tr><tr><td>気体定数 R</td><td><b>8.314</b> J/(mol・K)</td><td></td></tr></table><div class=&quot;tips&quot;><p class=&quot;tip&quot;><b>1/4</b>と<b>18〜22</b>と<b>5m</b>は保安の問14・問11で毎年狙われます。数字そのものをすり替えてくるので、値ごと覚えます。</p></div></div></div></section>
  <section class=&quot;panel&quot; id=&quot;p-ref&quot;>
<div class=&quot;ref&quot; id=&quot;ref&quot;>
  <div class=&quot;rules-h&quot;>付録　化学式・ガス早見表</div>

  <div class=&quot;refbox&quot;>
    <div class=&quot;refbox-h&quot;>原子の重さ ─ この7つだけ</div>
    <table class=&quot;reft small&quot;><tbody><tr><td>H（水素）</td><td><b>1</b></td></tr><tr><td>C（炭素）</td><td><b>12</b></td></tr><tr><td>N（窒素）</td><td><b>14</b></td></tr><tr><td>O（酸素）</td><td><b>16</b></td></tr><tr><td>F（フッ素）</td><td><b>19</b></td></tr><tr><td>S（硫黄）</td><td><b>32</b></td></tr><tr><td>Cl（塩素）</td><td><b>35.5</b></td></tr></tbody></table>
    <div class=&quot;reftips&quot;>
      <p class=&quot;tip&quot;>分子量は<b>この数字を足すだけ</b>です。暗記する必要はありません。例：H₂O（水）＝ 1＋1＋16 ＝ <b>18</b>。</p>
      <p class=&quot;tip&quot;><b>2個セットで書くガス</b>：H₂ 水素・N₂ 窒素・O₂ 酸素・F₂ フッ素・Cl₂ 塩素。原子1個では存在しないので、必ず<b>2倍</b>します（O₂＝16×2＝32）。</p>
      <p class=&quot;tip&quot;><b>1個のままのガス</b>：He ヘリウム・Ne ネオン・Ar アルゴン。この3つは<b>He₂ とは書きません</b>。原子の重さがそのまま分子量です（He＝<b>4</b>）。</p>
    </div>
  </div>

  <div class=&quot;refbox&quot;>
    <div class=&quot;refbox-h&quot;>空気の中身</div>
    <table class=&quot;reft&quot;><tbody><tr><td>N₂（窒素）</td><td>約78 vol%</td><td>空気の大部分はこれ</td></tr><tr><td>O₂（酸素）</td><td><b>約21 vol%</b></td><td>必要空気量の計算で <b>÷0.21</b> するのはこれ</td></tr><tr><td>Ar（アルゴン）</td><td>約0.9 vol%</td><td>覚えなくてよい</td></tr><tr><td>空気の平均分子量</td><td><b>29</b></td><td>重い・軽いの判定基準はこの数字</td></tr></tbody></table>
    <div class=&quot;reftips&quot;><p class=&quot;tip&quot;>問題文に「空気」と出たら、<b>酸素21%</b>と<b>平均分子量29</b>の2つだけ思い出せば足ります。</p></div>
  </div>

  <div class=&quot;refbox&quot;>

/span></td><td class=&quot;gw&quot;><b>28</b></td><td class=&quot;gc&quot;>10.8×2 + 1×6</td><td class=&quot;gk&quot;>可燃・自然発火・毒性</td></tr><tr><td class=&quot;gf&quot;>C₂H₆<span class=&quot;gn&quot;>（エタン）</span></td><td class=&quot;gw&quot;><b>30</b></td><td class=&quot;gc&quot;>12×2 + 1×6</td><td class=&quot;gk&quot;>可燃</td></tr><tr><td class=&quot;gf&quot;>O₂<span class=&quot;gn&quot;>（酸素）</span></td><td class=&quot;gw&quot;><b>32</b></td><td class=&quot;gc&quot;>16×2</td><td class=&quot;gk&quot;>支燃</td></tr><tr><td class=&quot;gf&quot;>CH₃OH<span class=&quot;gn&quot;>（メタノール）</span></td><td class=&quot;gw&quot;><b>32</b></td><td class=&quot;gc&quot;>12 + 1×4 + 16</td><td class=&quot;gk&quot;>可燃</td></tr><tr><td class=&quot;gf&quot;>SiH₄<span class=&quot;gn&quot;>（シラン）</span></td><td class=&quot;gw&quot;><b>32</b></td><td class=&quot;gc&quot;>28 + 1×4</td><td class=&quot;gk&quot;>可燃・自然発火</td></tr><tr><td class=&quot;gf&quot;>H₂S<span class=&quot;gn&quot;>（硫化水素）</span></td><td class=&quot;gw&quot;><b>34</b></td><td class=&quot;gc&quot;>1×2 + 32</td><td class=&quot;gk&quot;>可燃・毒性</td></tr><tr><td class=&quot;gf&quot;>F₂<span class=&quot;gn&quot;>（フッ素）</span></td><td class=&quot;gw&quot;><b>38</b></td><td class=&quot;gc&quot;>19×2</td><td class=&quot;gk&quot;>支燃・毒性</td></tr><tr><td class=&quot;gf&quot;>Ar<span class=&quot;gn&quot;>（アルゴン）</span></td><td class=&quot;gw&quot;><b>40</b></td><td class=&quot;gc&quot;>40（1原子のまま）</td><td class=&quot;gk&quot;>不活性</td></tr><tr><td class=&quot;gf&quot;>C₃H₆<span class=&quot;gn&quot;>（プロピレン）</span></td><td class=&quot;gw&quot;><b>42</b></td><td class=&quot;gc&quot;>12×3 + 1×6</td><td class=&quot;gk&quot;>可燃</td></tr><tr><td class=&quot;gf&quot;>CO₂<span class=&quot;gn&quot;>（二酸化炭素）</span></td><td class=&quot;gw&quot;><b>44</b></td><td class=&quot;gc&quot;>12 + 16×2</td><td class=&quot;gk&quot;>不燃</td></tr><tr><td class=&quot;gf&quot;>C₃H₈<span class=&quot;gn&quot;>（プロパン）</span></td><td class=&quot;gw&quot;><b>44</b></td><td class=&quot;gc&quot;>12×3 + 1×8</td><td class=&quot;gk&quot;>可燃</td></tr><tr><td class=&quot;gf&quot;>N₂O<span class=&quot;gn&quot;>（亜酸化窒素）</span></td><td class=&quot;gw&quot;><b>44</b></td><td class=&quot;gc&quot;>14×2 + 16</td><td class=&quot;gk&quot;>支燃・分解爆発</td></tr><tr><td class=&quot;gf&quot;>C₂H₄O<span class=&quot;gn&quot;>（酸化エチレン）</span></td><td class=&quot;gw&quot;><b>44</b></td><td class=&quot;gc&quot;>12×2 + 1×4 + 16</td><td class=&quot;gk&quot;>可燃・毒性・分解爆発</td></tr><tr><td class=&quot;gf&quot;>C₄H₁₀<span class=&quot;gn&quot;>（ブタン）</span></td><td class=&quot;gw&quot;><b>58</b></td><td class=&quot;gc&quot;>12×4 + 1×10</td><td class=&quot;gk&quot;>可燃</td></tr><tr><td class=&quot;gf&quot;>Cl₂<span class=&quot;gn&quot;>（塩素）</span></td><td class=&quot;gw&quot;><b>71</b></td><td class=&quot;gc&quot;>35.5×2</td><td class=&quot;gk&quot;>支燃・毒性</td></tr><tr><td class=&quot;gf&quot;>C₆H₆<span class=&quot;gn&quot;>（ベンゼン）</span></td><td class=&quot;gw&quot;><b>78</b></td><td class=&quot;gc&quot;>12×6 + 1×6</td><td class=&quot;gk&quot;>可燃</td></tr><tr><td class=&quot;gf&quot;>COCl₂<span class=&quot;gn&quot;>（ホスゲン）</span></td><td class=&quot;gw&quot;><b>99</b></td><td class=&quot;gc&quot;>12 + 16 + 35.5×2</td><td class=&quot;gk&quot;>毒性</td></tr></tbody></table></div>
    <div class=&quot;reftips&quot;><p class=&quot;tip&quot;><b>29より下が「軽い」、上が「重い」</b>。表は分子量の小さい順に並べてあるので、<b>C₂H₆（エタン）30から下が重い、それより上が軽いと覚えると早いです。</p><p class=&quot;tip&quot;><b>分子量28が4つ</b>あります（N₂ 窒素・CO 一酸化炭素・C₂H₄ エチレン・B₂H₆ ジボラン）。<b>44も4つ</b>（CO₂ 二酸化炭素・C₃H₈ プロパン・N₂O 亜酸化窒素・C₂H₄O 酸化エチレン）。28の4つは29よりわずかに小さいので「軽い」、44の4つは「重い」です。HCN（シアン化水素）27は「軽い」</b>。毒性が強いので重そうに見えるのが最頻出のひっかけです。</p><p class=&quot;tip&quot;><b>N₂O（亜酸化窒素）だけが支燃性かつ分解爆発性</b>。ここが毎年狙われます。</p><p class=&quot;tip&quot;><b>不活性なのは He ヘリウム・Ne ネオン・Ar アルゴンの3つだけ</b>。「ヘリウム、ネオン、塩素、アルゴンはいずれも不活性」という文が実際に出ましたが、<b>Cl₂ 塩素が混ざっているので✕</b>です。仲間はずれを探す問題として頻出。</p></div>

  <div class=&quot;refbox hot&quot;>
    <div class=&quot;refbox-h&quot;>燃焼の反応式の作り方 ─ 数えるだけ</div>
    <ol class=&quot;refsteps&quot;><li>燃料の分子式から <b>C の数</b>と <b>H の数</b>を数える</li><li><b>CO₂ の係数 ＝ C の数</b></li><li><b>H₂O の係数 ＝ H の数 ÷ 2</b></li><li><b>O₂ の係数 ＝ C数 ＋ H数÷4</b>　（燃料に O が入っていれば、さらに <b>− O数÷2</b>）</li></ol>
    <div class=&quot;scroll&quot;><table class=&quot;reft&quot;><thead>
      <tr><th>燃料（名前）</th><th>数える</th><th>O₂の係数</th><th>反応式</th></tr></thead>
      <tbody><tr><td>CH₄（メタン）</td><td>C=1, H=4</td><td>O₂ = 1 + 1 = 2</td><td class=&quot;gf&quot;>CH₄ + 2O₂ → CO₂ + 2H₂O</td></tr><tr><td>C₃H₈（プロパン）</td><td>C=3, H=8</td><td>O₂ = 3 + 2 = 5</td><td class=&quot;gf&quot;>C₃H₈ + 5O₂ → 3CO₂ + 4H₂O</td></tr><tr><td>C₃H₆（プロピレン）</td><td>C=3, H=6</td><td>O₂ = 3 + 1.5 = 4.5</td><td class=&quot;gf&quot;>C₃H₆ + 4.5O₂ → 3CO₂ + 3H₂O</td></tr><tr><td>C₂H₂（アセチレン）</td><td>C=2, H=2</td><td>O₂ = 2 + 0.5 = 2.5</td><td class=&quot;gf&quot;>C₂H₂ + 2.5O₂ → 2CO₂ + H₂O</td></tr><tr><td>C₆H₆（ベンゼン）</td><td>C=6, H=6</td><td>O₂ = 6 + 1.5 = 7.5</td><td class=&quot;gf&quot;>C₆H₆ + 7.5O₂ → 6CO₂ + 3H₂O</td></tr><tr><td>CH₃OH（メタノール）</td><td>C=1, H=4, O=1</td><td>O₂ = 1 + 1 − 0.5 = 1.5</td><td class=&quot;gf&quot;>CH₃OH + 1.5O₂ → CO₂ + 2H₂O</td></tr></tbody></table></div>
    <div class=&quot;reftips&quot;><p class=&quot;tip&quot;>この係数の出し方ひとつで、<b>問6（係数を選ぶ）・問8（エンタルピー）・問9（必要空気量）</b>の3問すべてが解けます。学識でいちばん割の良い公式です。</p><p class=&quot;tip&quot;>係数に <b>4.5 や 7.5 のような小数が出ても構いません</b>。1 mol あたりで考えているためです。整数にしたければ全体を2倍します。</p></div>

ot;q&quot;: &quot;爆風の影響を推算する際に用いる換算距離λとして正しいものはどれか。ただし，物質の質量をM[kg]，距離をR[m]とする。&quot;, &quot;c&quot;: [&quot;λ = R/M&quot;, &quot;λ = RM²&quot;, &quot;λ = R√M&quot;, &quot;λ = R/³√M&quot;, &quot;λ = R³M&quot;], &quot;a&quot;: 3, &quot;w&quot;: [&quot;✕ 質量をそのまま割るのではない。 正しくは λ = R/³√M。&quot;, &quot;✕ 距離と質量を掛ける形ではない。 正しくは λ = R/³√M。&quot;, &quot;✕ 質量の平方根を掛ける形ではない。 正しくは λ = R/³√M。&quot;, &quot;◎ 正解です。ホプキンソンの三乗根法則の換算距離は λ = R/³√M(距離を質量の三乗根で割る)。&quot;, &quot;✕ 距離を三乗する形ではない。 正しくは λ = R/³√M。&quot;]}, {&quot;s&quot;: &quot;学識 R2(令和2年度)&quot;, &quot;n&quot;: &quot;問13&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，燃焼・爆発について正しいものはどれか。\nイ．アセチレン1 molの燃焼熱は，エタン1 molの燃焼熱より小さい。\nロ．粉じん爆発は，化学的爆発であり，BLEVEと呼ばれる。\nハ．一般に可燃性ガスと空気の混合ガスの爆発範囲は，圧力が増加すると狭くなる。\nニ．燃焼速度は，一般に化学量論組成付近で最大となる。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ハ&quot;, &quot;ハ, ニ&quot;, &quot;イ, ロ, ハ&quot;], &quot;a&quot;: 1, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ロ:✕ 誤り。BLEVEは蒸気爆発のこと。粉じん爆発は石炭粉，小麦粉，プラスチック粉体，金属粉体などの可燃性微粉が空気中に浮遊した状態で発火する爆発。&quot;, &quot;◎ 正しい組み合わせです。　イ:○ 正しい。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。BLEVEは蒸気爆発のこと。粉じん爆発は石炭粉，小麦粉，プラスチック粉体，金属粉体などの可燃性微粉が空気中に浮遊した状態で発火する爆発。　ハ:✕ 誤り。一般に高圧になるほど爆発下限界は低下，上限界は上昇して爆発範囲は広がる。&quot;, &quot;✕ 誤りを含む組み合わせです。　ハ:✕ 誤り。一般に高圧になるほど爆発下限界は低下，上限界は上昇して爆発範囲は広がる。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ロ:✕ 誤り。BLEVEは蒸気爆発のこと。粉じん爆発は石炭粉，小麦粉，プラスチック粉体，金属粉体などの可燃性微粉が空気中に浮遊した状態で発火する爆発。　ハ:✕ 誤り。一般に高圧になるほど爆発下限界は低下，上限界は上昇して爆発範囲は広がる。&quot;]}, {&quot;s&quot;: &quot;学識 R2(令和2年度)&quot;, &quot;n&quot;: &quot;問14&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，酸素および窒素について正しいものはどれか。\nイ．赤熱した鉄を酸素ガス中に入れると激しく燃焼する。\nロ．窒素は，酸素と反応することはない。\nハ．高温の窒素はマグネシウムなどの金属と反応し，窒化物を生成する。\nニ．酸素と窒素の沸点差はほとんどないため，液体空気を精留する液化分離法を適用することはできない。&quot;, &quot;c&quot;: [&quot;イ, ハ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ハ&quot;, &quot;イ, ロ, ニ&quot;, &quot;ロ, ハ, ニ&quot;], &quot;a&quot;: 0, &quot;w&quot;: [&quot;◎ 正しい組み合わせです。　イ:○ 正しい。　ハ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ニ:✕ 誤り。酸素の沸点-183℃，窒素の沸点-196℃と差があり，この差 uot;: &quot;次のイ，ロ，ハ，ニの記述のうち，化学平衡について正しいものはどれか。\nイ．定圧下で反応温度を下げると，平衡は吸熱反応の方向に移動する。\nロ．すべての化学反応は可逆的に進行するとして化学平衡の計算をしてよい。\nハ．化学平衡では正反応と逆反応の反応速度がともに0である。\nニ．濃度平衡定数は，反応温度が一定であれば，各成分の濃度によらず一定である。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ハ&quot;, &quot;ロ, ニ&quot;, &quot;ハ, ニ&quot;], &quot;a&quot;: 3, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。温度を下げると平衡は発熱反応の方向に移動する。　ロ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。温度を下げると平衡は発熱反応の方向に移動する。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:○ 正しい。　ハ:✕ 誤り。正反応と逆反応の速度は等しくなる(見かけ上反応停止)のであり，0ではない。&quot;, &quot;◎ 正しい組み合わせです。　ロ:○ 正しい。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ハ:✕ 誤り。正反応と逆反応の速度は等しくなる(見かけ上反応停止)のであり，0ではない。　ニ:○ 正しい。&quot;]}, {&quot;s&quot;: &quot;学識 R4(令和4年度)&quot;, &quot;n&quot;: &quot;問8&quot;, &quot;q&quot;: &quot;プロパン(C₃H₈)の燃焼熱(総発熱量)は，およそいくらか。ただし，プロパン，二酸化炭素および水(l)の標準生成エンタルピーはそれぞれ，-105 kJ/mol，-394 kJ/molおよび-286 kJ/molとする。&quot;, &quot;c&quot;: [&quot;1430 kJ/mol&quot;, &quot;2220 kJ/mol&quot;, &quot;2330 kJ/mol&quot;, &quot;2430 kJ/mol&quot;, &quot;3370 kJ/mol&quot;], &quot;a&quot;: 1, &quot;w&quot;: [&quot;この値は計算結果と一致しません。上の解説を参照してください。&quot;, &quot;◎ 正解です。Qc=(反応物のΔHf°の和)-(生成物のΔHf°の和)=-105-{-394×3+(-286×4)}≒2220kJ/mol。&quot;, &quot;この値は計算結果と一致しません。上の解説を参照してください。&quot;, &quot;この値は計算結果と一致しません。上の解説を参照してください。&quot;, &quot;この値は計算結果と一致しません。上の解説を参照してください。&quot;]}, {&quot;s&quot;: &quot;学識 R4(令和4年度)&quot;, &quot;n&quot;: &quot;問9&quot;, &quot;q&quot;: &quot;次のガスのうち，自然発火性のガスはどれか。\nイ.NH₃　ロ.Si₂H₆　ハ.PH₃　ニ.CH₂OCH₂(酸化エチレン)　ホ.C₂H₂(アセチレン)&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ホ&quot;, &quot;ロ, ハ&quot;, &quot;ハ, ニ&quot;, &quot;ニ, ホ&quot;], &quot;a&quot;: 2, &quot;w&quot;: [&quot;✕ NH₃は自然発火性ではありません。&quot;, &quot;✕ NH₃・アセチレンとも自然発火性ではありません。&quot;, &quot;◎ 正解。Si₂H₆(ジシラン)とPH₃(ホスフィン)は自然発火性のガスである。&quot;, &quot;✕ 酸化エチレンは自然発火性ではありません(可燃性・毒性ガス)。&quot;, &quot;✕ 酸化エチレン・アセチレンとも自然発火性ではありません。&quot;]}, {&quot;s&quot;: &quot;学識 R4(令和4年度)&quot;, &quot;n&quot;: &quot;問10&quot;, &quot;q&quot;: &quot;エタンとプロピレンが等モル含まれる，メタン，エタン，プロピレンの混 (令和5年度)&quot;, &quot;n&quot;: &quot;問4&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの熱力学に関する記述のうち，正しいものはどれか。\nイ．熱は状態量ではない。\nロ．気体は，圧力を一定に保って加熱しても体積が膨張するだけで内部エネルギーは変化しない。\nハ．系と外界との間で仕事の出入りがない場合の状態変化を断熱変化という。\nニ．可逆カルノーサイクルは，2つの等温可逆変化と2つの断熱可逆変化とにより組み立てられた熱効率が最大となる理想的なサイクルである。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ハ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ハ&quot;, &quot;ロ, ニ&quot;], &quot;a&quot;: 2, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ロ:✕ 誤り。加熱すると体積が膨張し，その熱はエネルギー増加と外部仕事の両方に使われる。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ハ:✕ 誤り。仕事ではなく熱の出入りがない状態変化を断熱変化という。&quot;, &quot;◎ 正しい組み合わせです。　イ:○ 正しい。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。加熱すると体積が膨張し，その熱はエネルギー増加と外部仕事の両方に使われる。　ハ:✕ 誤り。仕事ではなく熱の出入りがない状態変化を断熱変化という。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。加熱すると体積が膨張し，その熱はエネルギー増加と外部仕事の両方に使われる。　ニ:○ 正しい。&quot;]}, {&quot;s&quot;: &quot;学識 R5(令和5年度)&quot;, &quot;n&quot;: &quot;問5&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの反応速度についての記述のうち，正しいものはどれか。\nイ．反応速度は，どの反応物または生成物の濃度変化に注目するかによって異なる。\nロ．アレニウスの式の活性化エネルギーは，通常は正である。\nハ．反応次数は，常に正の数となる。\nニ．固体触媒を用いる系では，反応速度式が反応物の分圧の整数ではないべき指数になる場合が多い。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ハ&quot;, &quot;ロ, ハ&quot;, &quot;ロ, ニ&quot;, &quot;ハ, ニ&quot;], &quot;a&quot;: 3, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。どの化合物の濃度変化に着目しても反応速度は同じ値になる。　ロ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。どの化合物の濃度変化に着目しても反応速度は同じ値になる。　ハ:✕ 誤り。反応次数は0や負の数となることもある。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:○ 正しい。　ハ:✕ 誤り。反応次数は0や負の数となることもある。&quot;, &quot;◎ 正しい組み合わせです。　ロ:○ 正しい。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ハ:✕ 誤り。反応次数は0や負の数となることもある。　ニ:○ 正しい。&quot;]}, {&quot;s&quot;: &quot;学識 R5(令和5年度)&quot;, &quot;n&quot;: &quot;問6&quot;, &quot;q&quot;: &quot;次の化学反応式において，a，b，cおよびdの数値の組合せで正しいものはどれか。\na C₃H₆ + 11O₂ + b NH₃ → 2C₂H₃CN + c HCN + d CO₂ + 14H₂O&quot;, &quot;c&quot;: [&quot;a=2,b=2,c=1,d=2&quot;, &quot;a=2,b=3,c=4,d=2&quot;, &quot;a=4,b=3,c=2,d=4&quot;, &quot;a=4,b=4,c=2,d=4&quot;, &quot;a=4,b=6,c=4,d=4&quot;], &quot;a&quot;: 3, &quot;w&quot;: [&quot;✕ 誤りです。O の数から d=4 が決まるので，d=4 でない組は アレニウスの式は，反応速度定数 k の濃度依存性を表す。\nハ．正反応の反応速度は，通常は生成物の濃度と反応物の濃度の積に比例する。\nニ．反応次数が 1、2、3 である反応を，それぞれ1次反応、2次反応、3次反応と呼ぶ。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ハ&quot;, &quot;ロ, ニ&quot;, &quot;ハ, ニ&quot;], &quot;a&quot;: 1, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ロ:✕ 誤り。アレニウスの式 k = A・exp(−E/RT) は<b>温度</b>依存性を表す。&quot;, &quot;◎ 正しい組み合わせです。　イ:○ 正しい。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。アレニウスの式 k = A・exp(−E/RT) は<b>温度</b>依存性を表す。　ハ:✕ 誤り。正反応の速度は<b>反応物</b>の濃度だけで決まる（生成物は関係ない）。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。アレニウスの式 k = A・exp(−E/RT) は<b>温度</b>依存性を表す。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ハ:✕ 誤り。正反応の速度は<b>反応物</b>の濃度だけで決まる（生成物は関係ない）。　ニ:○ 正しい。&quot;]}, {&quot;s&quot;: &quot;学識 R7(令和7年度)&quot;, &quot;n&quot;: &quot;問6&quot;, &quot;q&quot;: &quot;次の化学反応式において，a、b、c、d の数値の組合せで正しいものはどれか。\n\n　P₄ ＋ a NaOH ＋ b H₂O → c PH₃ ＋ d NaH₂PO₂&quot;, &quot;c&quot;: [&quot;a=1, b=2, c=2, d=1&quot;, &quot;a=2, b=1, c=3, d=3&quot;, &quot;a=2, b=3, c=1, d=2&quot;, &quot;a=3, b=2, c=2, d=2&quot;, &quot;a=3, b=3, c=1, d=3&quot;], &quot;a&quot;: 4, &quot;w&quot;: [&quot;✕ 左右で原子数が合いません。&quot;, &quot;✕ 左右で原子数が合いません。&quot;, &quot;✕ 左右で原子数が合いません。&quot;, &quot;✕ 左右で原子数が合いません。&quot;, &quot;◎ 正解です。P₄ + 3NaOH + 3H₂O → PH₃ + 3NaH₂PO₂\n　P：左4 ＝ 右 1+3 ✓\n　Na：左3 ＝ 右3 ✓\n　O：左 3+3=6 ＝ 右 3×2=6 ✓\n　H：左 3+6=9 ＝ 右 3+3×2=9 ✓\n数えるだけで解けます。&quot;]}, {&quot;s&quot;: &quot;学識 R7(令和7年度)&quot;, &quot;n&quot;: &quot;問7&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，化学平衡について正しいものはどれか。\nイ．可逆反応では，正反応が進んで生成物量が増加するにつれて逆反応の速度が遅くなり，ついには逆反応の速度がゼロになった状態が化学平衡である。\nロ．濃度平衡定数 Kc と圧平衡定数 Kp は常に同じ値である。\nハ．吸熱反応において，定圧下で反応温度を上げると，反応の平衡は生成系側に移動する。\nニ．定温下で圧力を高くすると，反応の平衡は体積が減少する方向に移動する。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ハ&quot;, &quot;ロ, ニ&quot;, &quot;ハ, ニ&quot;], &quot;a&quot;: 4, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。化学平衡は正反応と逆反応の速度が<b>等しい</b>状態。ゼロではない。　ロ:✕ 誤り。Kc と Kp は一般に異なる（気体の分子数が変わらない反応でのみ一致）。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。化学平衡は正反応と逆反応の速度が<b>等しい</b>状態。ゼロではない。  &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。窒素で希釈すると爆発上限界は<b>小さく</b>なる（爆発範囲は狭まる）。　ロ:○ 正しい。CO₂ はモル熱容量が大きいので窒素より少量で効く。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。窒素で希釈すると爆発上限界は<b>小さく</b>なる（爆発範囲は狭まる）。　ハ:○ 正しい。温度が上がると爆発範囲は広がる。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。窒素で希釈すると爆発上限界は<b>小さく</b>なる（爆発範囲は狭まる）。　ニ:✕ 誤り。爆ごう範囲は爆発範囲より<b>狭い</b>（爆発範囲の内側にある）。&quot;, &quot;◎ 正しい組み合わせです。　ロ:○ 正しい。CO₂ はモル熱容量が大きいので窒素より少量で効く。　ハ:○ 正しい。温度が上がると爆発範囲は広がる。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:○ 正しい。CO₂ はモル熱容量が大きいので窒素より少量で効く。　ニ:✕ 誤り。爆ごう範囲は爆発範囲より<b>狭い</b>（爆発範囲の内側にある）。&quot;]}, {&quot;s&quot;: &quot;学識 R7(令和7年度)&quot;, &quot;n&quot;: &quot;問11&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニのうち，すべてが分解爆発性を有するガスであるものはどれか。\n\n　イ．アセチレン、水素、メタン\n　ロ．アンモニア、亜酸化窒素、一酸化炭素\n　ハ．塩素、水素、プロパン\n　ニ．亜酸化窒素、アセチレン、モノゲルマン&quot;, &quot;c&quot;: [&quot;イ&quot;, &quot;ロ&quot;, &quot;ハ&quot;, &quot;ニ&quot;, &quot;ロ, ニ&quot;], &quot;a&quot;: 3, &quot;w&quot;: [&quot;✕ 水素とメタンは分解爆発性を持ちません（単独では爆発しない）。&quot;, &quot;✕ アンモニアと一酸化炭素は分解爆発性を持ちません。&quot;, &quot;✕ 塩素・水素・プロパンいずれも分解爆発性を持ちません。&quot;, &quot;◎ 正解です。<b>亜酸化窒素 N₂O・アセチレン C₂H₂・モノゲルマン GeH₄</b> はいずれも分解爆発性ガスです。分解爆発性ガスは<b>空気（酸素）がなくても単独で分解して爆発</b>します。代表格は アセチレン／酸化エチレン／亜酸化窒素／オゾン／ヒドラジン／モノゲルマン。&quot;, &quot;✕ ロには分解爆発性でないガスが含まれます。&quot;]}, {&quot;s&quot;: &quot;学識 R7(令和7年度)&quot;, &quot;n&quot;: &quot;問12&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，爆燃・爆ごうについて正しいものはどれか。\nイ．爆燃における火炎の伝ぱ速度は，音速より速い。\nロ．爆風の影響を調べるのに利用されるのが，相似則に基づいたホプキンソンの平方根法則である。\nハ．爆風は，爆燃や爆ごうで周囲に広がる圧力波である。\nニ．爆心から離れたある地点で観測された衝撃波を伴う強い爆発による爆風圧は，最大圧力に達したあと，一旦，負圧になるまで低下し大気圧に戻る。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ハ&quot;, &quot;ハ, ニ&quot;, &quot;イ, ハ, ニ&quot;], &quot;a&quot;: 3, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。爆燃は音速<b>以下</b>。音速を超えるのは<b>爆ごう</b>。　ロ:✕ 誤り。<b>平方根ではなく三乗根</b>。λ = R / ∛M。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。爆燃は音速<b>以下</b>。音速を超えるのは<b>爆ごう</b>。　ニ:○ 正しい。正圧のあと負圧になる（この負圧期も被害の原因になる）。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。<b>平方根ではなく三乗根</b>。λ = R / ∛M。　ハ:○ 正しい。&quot;, &quot;◎ 正しい組み合わせです。　ハ:○ 正しい。　ニ:○ 正しい。正圧のあと負圧になる（こ }, {&quot;s&quot;: &quot;学識 R7(令和7年度)&quot;, &quot;n&quot;: &quot;問15&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，シラン(モノシラン)について正しいものはどれか。\nイ．水素と硫黄の化合物である。\nロ．自然発火性を有しており，常温でも空気と接触すると発火する性質がある。\nハ．常温で，塩素および臭素と爆発的に反応する。\nニ．常温で，純水と爆発的に反応し水素を発生する。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ハ&quot;, &quot;ロ, ハ&quot;, &quot;ロ, ニ&quot;, &quot;ハ, ニ&quot;], &quot;a&quot;: 2, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。シランは <b>SiH₄</b>、<b>ケイ素</b>と水素の化合物。硫黄ではない。　ロ:○ 正しい。代表的な自然発火性ガス。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。シランは <b>SiH₄</b>、<b>ケイ素</b>と水素の化合物。硫黄ではない。　ハ:○ 正しい。ハロゲンと爆発的に反応する。&quot;, &quot;◎ 正しい組み合わせです。　ロ:○ 正しい。代表的な自然発火性ガス。　ハ:○ 正しい。ハロゲンと爆発的に反応する。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:○ 正しい。代表的な自然発火性ガス。　ニ:✕ 誤り。<b>純水</b>とは常温でほとんど反応しない（アルカリ性水溶液とは激しく反応して水素を発生）。&quot;, &quot;✕ 誤りを含む組み合わせです。　ハ:○ 正しい。ハロゲンと爆発的に反応する。　ニ:✕ 誤り。<b>純水</b>とは常温でほとんど反応しない（アルカリ性水溶液とは激しく反応して水素を発生）。&quot;]}, {&quot;s&quot;: &quot;学識 R6(令和6年度)&quot;, &quot;n&quot;: &quot;問1&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニのうち，SI単位について正しいものはどれか。\nイ．1 J＝1 kg・m3・s⁻2\nロ．1 N＝1 kg・m⁻2・s⁻2\nハ．1 Pa＝1 kg・m⁻1・s⁻2\nニ．1 W＝1 kg・m2・s⁻3&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ハ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ニ&quot;, &quot;ハ, ニ&quot;], &quot;a&quot;: 4, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。J＝kg・m2・s⁻2が正しく、m3ではない。　ロ:✕ 誤り。N＝kg・m・s⁻2が正しく、指数がm⁻2ではない。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。J＝kg・m2・s⁻2が正しい。　ハ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。J＝kg・m2・s⁻2が正しい。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。N＝kg・m・s⁻2が正しい。　ニ:○ 正しい。&quot;, &quot;◎ 正しい組み合わせです。　ハ:○ 正しい。Pa＝N/m2＝kg・m⁻1・s⁻2。　ニ:○ 正しい。W＝J/s＝kg・m2・s⁻3。&quot;]}, {&quot;s&quot;: &quot;学識 R6(令和6年度)&quot;, &quot;n&quot;: &quot;問2&quot;, &quot;q&quot;: &quot;温度27℃，圧力0.2MPaの理想気体がある。圧力一定で150℃まで加熱すると体積はおよそ何倍になるか。&quot;, &quot;c&quot;: [&quot;1.2&quot;, &quot;1.4&quot;, &quot;3.3&quot;, &quot;5.6&quot;, &quot;7.5&quot;], &quot;a&quot;: 1, &quot;w&quot;: [&quot;✕ 不正解です。シャルルの法則(定圧下でV∝T)より、V2/V1＝T2/T1＝423K/300K≈1.4倍。&quot;, &quot;◎ 正解です。絶対温度に変換すると27℃＝300K，150℃＝423K。定圧下で
