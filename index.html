t;ロ, ニ&quot;, &quot;ハ, ニ&quot;], &quot;a&quot;: 0, &quot;w&quot;: [&quot;◎ 正しい組み合わせです。　イ:○ 正しい。反応次数の定義通り。　ロ:○ 正しい。アレニウスの式の通り、温度が上がると速度定数は大きくなる。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ハ:✕ 誤り。触媒は反応速度や選択性には影響するが、反応平衡（平衡定数）は変えない。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:○ 正しい。　ハ:✕ 誤り。触媒は平衡定数には影響しない。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:○ 正しい。　ニ:✕ 誤り。反応速度（速度定数）は用いる触媒や反応条件によって変化する。&quot;, &quot;✕ 誤りを含む組み合わせです。　ハ:✕ 誤り。触媒は平衡定数には影響しない。　ニ:✕ 誤り。反応速度は触媒や条件により変わる。&quot;]}, {&quot;s&quot;: &quot;学識 R6(令和6年度)&quot;, &quot;n&quot;: &quot;問6&quot;, &quot;q&quot;: &quot;次の化学反応式において，ａ，ｂ，ｃおよびｄの数値の組合せで正しいものはどれか。\n2CH2=CHCH3 ＋ ａNH3 ＋ ｂO2 → ｃCH2=CHCN ＋ ｄH2O&quot;, &quot;c&quot;: [&quot;1, 2, 2, 4&quot;, &quot;1, 3, 1, 6&quot;, &quot;2, 2, 2, 4&quot;, &quot;2, 3, 1, 6&quot;, &quot;2, 3, 2, 6&quot;], &quot;a&quot;: 4, &quot;w&quot;: [&quot;✕ 不正解です。原子数を合わせると a=2, b=3, c=2, d=6 が正しい(プロピレンのアンモ酸化、ソハイオ法)。&quot;, &quot;✕ 不正解です。正しくは a=2, b=3, c=2, d=6。&quot;, &quot;✕ 不正解です。正しくは a=2, b=3, c=2, d=6。&quot;, &quot;✕ 不正解です。C(炭素)数は合うが、O(酸素)の数を合わせるとb=3ではなくd=6に対応するのはb=3のときで、c=1では左辺のC数(2×3=6)と右辺(1×3=3)が合わない。正しくはc=2。&quot;, &quot;◎ 正解です。両辺の原子数(C,H,N,O)を合わせると a=2, b=3, c=2, d=6 となる(プロピレンのアンモ酸化反応、ソハイオ法によるアクリロニトリル製造)。&quot;]}, {&quot;s&quot;: &quot;学識 R6(令和6年度)&quot;, &quot;n&quot;: &quot;問7&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，化学平衡について正しいものはどれか。\nイ．化学平衡にある系は平衡を決める因子の1つが変動すると変化を受けるが，その変化は変動した因子の効果を和らげる方向である。\nロ．逆反応の反応速度がほぼゼロである場合は，化学平衡を考えることはできない。\nハ．反応によらず，温度と圧力が同じであれば，濃度平衡定数Kcと圧平衡定数Kpは同じ値になる。\nニ．平衡定数が極端に大きいときは正反応の速度が逆反応の速度に比べて著しく大きく，逆反応が無視でき，実際には不可逆反応といえる状況になる。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ハ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ニ&quot;, &quot;ハ, ニ&quot;], &quot;a&quot;: 2, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい(ルシャトリエの原理)。　ロ:✕ 誤り。逆反応速度がほぼゼロでも、形式的には非常に大きい平衡定数として化学平衡を考えることができる。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ハ:✕ 誤り。KcとKpの関係はKp＝Kc(RT)^Δnであり、Δn(反応前後のモル数変化)が0でない限り、一般に同じ値にはならない。&quot;, &quot;◎ 正しい組み合わせです。　イ:○ 正しい。ルシャトリエの原理の通り。　ニ:○ 正しい。平衡定数が極端に大きいときの記述として妥当。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。逆反応速度がほぼゼロでも化学平衡は考えられる。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ハ:✕ 誤り。KcとKpはΔn＝0でない限り一般に異なる。　ニ:○ 正しい。&quot;]}, {&quot;s&quot;: &quot;学識 R6(令和6年度)&quot;, &quot;n&quot;: &quot;問8&quot;, &quot;q&quot;: &quot;エタンの燃焼熱Qc（総発熱量）はおよそいくらか。ただし，C2H6（g），CO2（g）およびH2O（l）の標準生成エンタルピーはそれぞれ－84 kJ/mol，－394 kJ/mol，－286 kJ/molである。&quot;, &quot;c&quot;: [&quot;596 kJ/mol&quot;, &quot;680 kJ/mol&quot;, &quot;1562 kJ/mol&quot;, &quot;1646 kJ/mol&quot;, &quot;1730 kJ/mol&quot;], &quot;a&quot;: 2, &quot;w&quot;: [&quot;✕ 不正解です。C2H6＋7/2O2→2CO2＋3H2Oより、ΔHc＝[2×(－394)＋3×(－286)]－(－84)＝－1562kJ/molなので、燃焼熱は1562kJ/mol。&quot;, &quot;✕ 不正解です。正しい計算では1562kJ/mol。&quot;, &quot;◎ 正解です。C2H6＋7/2O2→2CO2＋3H2Oの反応につき、ΔHc＝[2×(－394)＋3×(－286)]－[(－84)＋0]＝－1646＋84＝－1562kJ/mol。よって発熱量は1562kJ/mol。&quot;, &quot;✕ 不正解です。この値は生成物側の合計(1646)であり、反応物の生成エンタルピー(－84)を引く前の値。正しくは1562kJ/mol。&quot;, &quot;✕ 不正解です。正しくは1562kJ/mol。&quot;]}, {&quot;s&quot;: &quot;学識 R6(令和6年度)&quot;, &quot;n&quot;: &quot;問9&quot;, &quot;q&quot;: &quot;メタン20 vol％，エタン30 vol％およびプロピレン50 vol％の組成からなる混合ガスの常温，大気圧の空気中における爆発下限界はおよそいくらか。ル・シャトリエの式を用いて計算せよ。ただし，メタン，エタンおよびプロピレンの常温，大気圧の空気中における爆発下限界は，それぞれ5.0 vol％，3.0 vol％および2.0 vol％とする。&quot;, &quot;c&quot;: [&quot;2.2 vol%&quot;, &quot;2.6 vol%&quot;, &quot;3.0 vol%&quot;, &quot;3.3 vol%&quot;, &quot;4.0 vol%&quot;], &quot;a&quot;: 1, &quot;w&quot;: [&quot;✕ 不正解です。ル・シャトリエの式1/Lmix＝Σ(yi/Li)＝0.20/5.0＋0.30/3.0＋0.50/2.0＝0.39よりLmix≈2.6vol%。&quot;, &quot;◎ 正解です。1/Lmix＝0.20/5.0＋0.30/3.0＋0.50/2.0＝0.04＋0.10＋0.25＝0.39。Lmix＝1/0.39≈2.6vol%。&quot;, &quot;✕ 不正解です。正しくは約2.6vol%。&quot;, &quot;✕ 不正解です。正しくは約2.6vol%。&quot;, &quot;✕ 不正解です。正しくは約2.6vol%。&quot;]}, {&quot;s&quot;: &quot;学識 R6(令和6年度)&quot;, &quot;n&quot;: &quot;問10&quot;, &quot;q&quot;: &quot;次のガスのうち，支燃性ガスはどれか。\nイ．Cl2\nロ．CO\nハ．O2\nニ．COCl2&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ハ&quot;, &quot;ロ, ハ&quot;, &quot;ロ, ニ&quot;, &quot;ハ, ニ&quot;], &quot;a&quot;: 1, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい(塩素は支燃性)。　ロ:✕ 誤り。COは可燃性ガスであり支燃性ではない。&quot;, &quot;◎ 正しい組み合わせです。　イ:○ 正しい。塩素は支燃性ガス。　ハ:○ 正しい。酸素は代表的な支燃性ガス。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。COは可燃性ガス。　ハ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。COは可燃性ガス。　ニ:✕ 誤り。ホスゲン(COCl2)は毒性ガスであり支燃性には分類されない。&quot;, &quot;✕ 誤りを含む組み合わせです。　ハ:○ 正しい。　ニ:✕ 誤り。ホスゲンは支燃性ガスではない。&quot;]}, {&quot;s&quot;: &quot;学識 R6(令和6年度)&quot;, &quot;n&quot;: &quot;問11&quot;, &quot;q&quot;: &quot;次のガスのうち，大気圧，空気中での発火温度が低いものから順に並べたものはどれか。\nイ．エタン\nロ．プロパン\nハ．ブタン&quot;, &quot;c&quot;: [&quot;イ<ロ<ハ&quot;, &quot;イ<ハ<ロ&quot;, &quot;ロ<イ<ハ&quot;, &quot;ロ<ハ<イ&quot;, &quot;ハ<ロ<イ&quot;], &quot;a&quot;: 4, &quot;w&quot;: [&quot;✕ 不正解です。発火温度はエタン約515℃、プロパン約450℃、ブタン約405℃であり、低い順はブタン<プロパン<エタン。&quot;, &quot;✕ 不正解です。正しくはハ(ブタン405℃)<ロ(プロパン450℃)<イ(エタン515℃)。&quot;, &quot;✕ 不正解です。正しくはハ<ロ<イ。&quot;, &quot;✕ 不正解です。正しくはハ<ロ<イ。&quot;, &quot;◎ 正解です。発火温度はブタン(ハ)約405℃＜プロパン(ロ)約450℃＜エタン(イ)約515℃であり、炭素数が多いほど発火温度は低くなる傾向がある。&quot;]}, {&quot;s&quot;: &quot;学識 R6(令和6年度)&quot;, &quot;n&quot;: &quot;問12&quot;, &quot;q&quot;: &quot;次の爆発のうち，ブレビー（BLEVE）と呼ばれる現象が見られるのはどれか。\nイ．蒸気雲爆発\nロ．粉じん爆発\nハ．蒸気爆発\nニ．混合ガス爆発\nホ．液滴噴霧爆発&quot;, &quot;c&quot;: [&quot;イ&quot;, &quot;ロ&quot;, &quot;ハ&quot;, &quot;ニ&quot;, &quot;ホ&quot;], &quot;a&quot;: 2, &quot;w&quot;: [&quot;✕ 不正解です。蒸気雲爆発(UVCE)は漏えいした可燃性蒸気雲が拡散後に着火する現象で、BLEVEとは異なる。&quot;, &quot;✕ 不正解です。粉じん爆発は可燃性粉じんによる爆発で、BLEVEとは異なる現象。&quot;, &quot;◎ 正解です。ブレビー(BLEVE：沸騰液膨張蒸気爆発)は、高圧の液化ガス容器が破裂した際に内部の液体が爆発的に沸騰・蒸発する現象であり、蒸気爆発と呼ばれる。&quot;, &quot;✕ 不正解です。混合ガス爆発は可燃性ガスと酸素等の混合気体の爆発で、BLEVEとは異なる。&quot;, &quot;✕ 不正解です。液滴噴霧爆発は霧状の液滴による爆発現象で、BLEVEとは異なる。&quot;]}, {&quot;s&quot;: &quot;学識 R6(令和6年度)&quot;, &quot;n&quot;: &quot;問13&quot;, &quot;q&quot;: &quot;常温，大気圧，空気中にある次の可燃性ガスを，二酸化炭素で希釈した場合，限界酸素濃度が高い順に並べたものはどれか。\nイ．H2\nロ．CH4\nハ．C2H4&quot;, &quot;c&quot;: [&quot;イ>ロ>ハ&quot;, &quot;イ>ハ>ロ&quot;, &quot;ロ>イ>ハ&quot;, &quot;ロ>ハ>イ&quot;, &quot;ハ>ロ>イ&quot;], &quot;a&quot;: 3, &quot;w&quot;: [&quot;✕ 不正解です。限界酸素濃度はCH4(メタン)が最も高く、次いでC2H4(エチレン)、H2(水素)の順に低くなる。&quot;, &quot;✕ 不正解です。正しくはロ(メタン)＞ハ(エチレン)＞イ(水素)。&quot;, &quot;✕ 不正解です。正しくはロ＞ハ＞イ。&quot;, &quot;◎ 正解です。限界酸素濃度はメタン(ロ)が最も高く、エチレン(ハ)、水素(イ)の順に低くなる。水素は反応性が高く少量の酸素でも燃焼しうるため限界酸素濃度が低い。&quot;, &quot;✕ 不正解です。正しくはロ＞ハ＞イ。&quot;]}, {&quot;s&quot;: &quot;学識 R6(令和6年度)&quot;, &quot;n&quot;: &quot;問14&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，プロピレンについて正しいものはどれか。\nイ．エチレンと同様に淡黄色のガスである。\nロ．沸点は－103.7℃，臨界温度は9.5℃である。\nハ．ヒドロホルミル化することで1-ブタノールを製造できる。\nニ．水和することにより2-プロパノール（イソプロピルアルコール）が得られる。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ハ&quot;, &quot;ロ, ニ&quot;, &quot;ハ, ニ&quot;], &quot;a&quot;: 4, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。プロピレンもエチレンも実際は無色のガスである。　ロ:✕ 誤り。挙げられた沸点・臨界温度はエチレンの値であり、プロピレンのものではない(プロピレンの沸点は約－47.6℃)。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。プロピレンは無色のガス。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。挙げられた数値はエチレンのもの。　ハ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。挙げられた数値はエチレンのもの。　ニ:○ 正しい。&quot;, &quot;◎ 正しい組み合わせです。　ハ:○ 正しい。オキソ法(ヒドロホルミル化)によりブチルアルデヒドを経てブタノールを製造できる。　ニ:○ 正しい。プロピレンの水和反応でイソプロピルアルコールが得られる、標準的な工業製法。&quot;]}, {&quot;s&quot;: &quot;学識 R6(令和6年度)&quot;, &quot;n&quot;: &quot;問15&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，シアン化水素について正しいものはどれか。\nイ．蒸気は毒性が高く，特有のアーモンドのような臭いをもっている。\nロ．水にわずかに溶け，水溶液は塩基性を示す。\nハ．通常はソハイオ法によるアクリロニトリルを製造する際の副生物から回収して得られる。\nニ．主な用途として，窒素肥料の製造原料に使われる。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ハ&quot;, &quot;ロ, ハ&quot;, &quot;ロ, ニ&quot;, &quot;ハ, ニ&quot;], &quot;a&quot;: 1, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ロ:✕ 誤り。シアン化水素は水によく溶け、その水溶液（青酸）は弱酸性を示す。塩基性ではない。&quot;, &quot;◎ 正しい組み合わせです。　イ:○ 正しい。アーモンド様の臭いを持つ猛毒ガス。　ハ:○ 正しい。ソハイオ法によるアクリロニトリル製造の副生物として回収されるのが一般的。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。水溶液は酸性を示す。　ハ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。水溶液は酸性を示す。　ニ:✕ 誤り。主な用途はアクリル酸メチルやアジポニトリル(ナイロン原料)等の製造であり、窒素肥料の原料ではない。&quot;, &quot;✕ 誤りを含む組み合わせです。　ハ:○ 正しい。　ニ:✕ 誤り。窒素肥料の原料ではない。&quot;]}];


let filtered = DATA.slice();
let idx = 0;
let score = 0;
let answered = new Array(DATA.length).fill(false);
let activeCat = &quot;ALL&quot;;
const STORAGE_KEY = &quot;otsuka_gaku_v2&quot;;

const cats = [&quot;ALL&quot;, ...Array.from(new Set(DATA.map(d=>d.s)))];
function chipLabel(c){
  if(c === 'ALL') return `全問 ${DATA.length}問`;
  const m = c.match(/\((.+)\)/);
  const name = m ? m[1] : c;
  return `${name} ${DATA.filter(d=>d.s===c).length}問`;
}
const QROOT = document.getElementById('p-quiz');
const catBar = document.getElementById('catBar');
cats.forEach(c=>{
  const b = document.createElement('button');
  b.className = 'chip' + (c==='ALL' ? ' active' : '');
  b.textContent = chipLabel(c);
  b.onclick = () => selectCat(c, b);
  catBar.appendChild(b);
});

function selectCat(c, btn){
  activeCat = c;
  QROOT.querySelectorAll('.chip').forEach(ch=>ch.classList.remove('active'));
  btn.classList.add('active');
  filtered = c==='ALL' ? DATA.slice() : DATA.filter(d=>d.s===c);
  idx = 0; score = 0;
  answered = new Array(filtered.length).fill(false);
  render();
  saveProgress();
}

function render(){
  const total = filtered.length;
  if(idx >= total){ renderDone(); return; }
  const q = filtered[idx];
  document.getElementById('progLabel').textContent = `${idx+1} / ${total}`;
  document.getElementById('progFill').style.width = `${(idx/total)*100}%`;
  document.getElementById('scoreLabel').textContent = `正解 ${score}`;

  const card = document.getElementById('quizCard');
  card.innerHTML = `
    <span class=&quot;sec-tag&quot;>${q.s}</span>
    <div class=&quot;q-num&quot;>過去問題 ${q.n}</div>
    <div class=&quot;q-text&quot;>${escapeHtml(q.q)}</div>
    <div class=&quot;choices&quot; id=&quot;choicesWrap&quot;></div>
    <div class=&quot;result-banner&quot; id=&quot;resultBanner&quot;></div>
    <div class=&quot;actions&quot;>
      <button class=&quot;btn btn-secondary&quot; id=&quot;skipBtn&quot;>スキップ</button>
      <button class=&quot;btn btn-primary&quot; id=&quot;nextBtn&quot; disabled>次の問題 →</button>
    </div>
  `;
  const wrap = document.getElementById('choicesWrap');
  q.c.forEach((choiceText, i)=>{
    const el = document.createElement('div');
    el.className = 'choice';
    const reasonText = (q.w &amp;&amp; q.w[i]) ? q.w[i] : '';
    el.innerHTML = `
      <div class=&quot;choice-main&quot;><span class=&quot;choice-num&quot;>${i+1}</span><span>${escapeHtml(choiceText)}</span></div>
      <div class=&quot;choice-reason&quot; data-reason>${escapeHtml(reasonText)}</div>
    `;
    el.onclick = () => selectChoice(i);
    wrap.appendChild(el);
  });

  document.getElementById('skipBtn').onclick = () => { idx++; render(); saveProgress(); };
  document.getElementById('nextBtn').onclick = () => { idx++; render(); saveProgress(); };

  const resumeNote = document.getElementById('resumeNote');
  if(resumeNote){ resumeNote.remove(); }
}

function selectChoice(i){
  const q = filtered[idx];
  if(answered[idx]) return;
  answered[idx] = true;
  const choiceEls = QROOT.querySelectorAll('.choice');
  choiceEls.forEach((el, j)=>{
    if(j === q.a) el.classList.add('correct');
    if(j === i &amp;&amp; i !== q.a) el.classList.add('wrong');
    if(j !== q.a &amp;&amp; j !== i) el.classList.add('dim');
    const reasonEl = el.querySelector('[data-reason]');
    if(reasonEl &amp;&amp; reasonEl.textContent.trim()){
      reasonEl.classList.add('show');
      const tagSpan = document.createElement('span');
      tagSpan.className = (j === q.a) ? 'tag-ok' : 'tag-ng';
      tagSpan.textContent = (j === q.a) ? '○ ' : '✕ ';
      reasonEl.prepend(tagSpan);
    }
  });
  const banner = document.getElementById('resultBanner');
  banner.classList.add('show');
  if(i === q.a){
    score++;
    banner.classList.add('ok');
    banner.textContent = '✓ 正解!';
  } else {
    banner.classList.add('ng');
    banner.textContent = `✗ 不正解 — 正解は ${q.a+1}`;
  }
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('scoreLabel').textContent = `正解 ${score}`;
  saveProgress();
}

function renderDone(){
  const total = filtered.length;
  const pct = total ? Math.round((score/total)*100) : 0;
  document.getElementById('progLabel').textContent = `${total} / ${total}`;
  document.getElementById('progFill').style.width = `100%`;
  document.getElementById('scoreLabel').textContent = `正解 ${score}`;
  clearProgress();
  const card = document.getElementById('quizCard');
  card.innerHTML = `
    <div class=&quot;done-screen&quot;>
      <span class=&quot;sec-tag&quot;>${activeCat==='ALL' ? '全問' : activeCat} 完了</span>
      <div class=&quot;big&quot;>${score} / ${total}</div>
      <div style=&quot;font-family:-apple-system,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-weight:600;&quot;>正答率 ${pct}%</div>
      <div class=&quot;actions&quot; style=&quot;margin-top:22px;&quot;>
        <button class=&quot;btn btn-secondary&quot; id=&quot;retryBtn&quot;>もう一度</button>
      </div>
    </div>
  `;
  document.getElementById('retryBtn').onclick = () => {
    idx = 0; score = 0;
    answered = new Array(filtered.length).fill(false);
    render();
    saveProgress();
  };
}

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ cat: activeCat, idx, score, answered }));
  }catch(e){ /* storage unavailable, fail silently */ }
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function clearProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){ /* ignore */ }
}

function activateChipFor(cat){
  const label = chipLabel(cat);
  QROOT.querySelectorAll('.chip').forEach(ch=>{
    ch.classList.toggle('active', ch.textContent === label);
  });
}

function showResumeBanner(saved){
  const savedFiltered = saved.cat==='ALL' ? DATA.slice() : DATA.filter(d=>d.s===saved.cat);
  const card = document.getElementById('quizCard');
  card.innerHTML = `
    <div id=&quot;resumeNote&quot; style=&quot;text-align:center;padding:6px 4px;&quot;>
      <span class=&quot;sec-tag&quot;>前回の続き</span>
      <p style=&quot;font-size:14.5px;line-height:1.7;margin:12px 0 4px;&quot;>
        「${saved.cat==='ALL' ? '全問' : saved.cat}」を <b>${saved.idx} / ${savedFiltered.length}</b> 問目まで進めていました(正解 ${saved.score} 問)。
      </p>
      <div class=&quot;actions&quot; style=&quot;margin-top:16px;&quot;>
        <button class=&quot;btn btn-secondary&quot; id=&quot;restartBtn&quot;>最初から</button>
        <button class=&quot;btn btn-primary&quot; id=&quot;resumeBtn&quot;>続きから再開 →</button>
      </div>
    </div>
  `;
  document.getElementById('resumeBtn').onclick = () => {
    activeCat = saved.cat;
    filtered = savedFiltered;
    idx = saved.idx;
    score = saved.score;
    answered = (Array.isArray(saved.answered) &amp;&amp; saved.answered.length === filtered.length)
      ? saved.answered
      : new Array(filtered.length).fill(false);
    activateChipFor(activeCat);
    render();
  };
  document.getElementById('restartBtn').onclick = () => {
    clearProgress();
    activeCat = 'ALL';
    filtered = DATA.slice();
    idx = 0; score = 0;
    answered = new Array(filtered.length).fill(false);
    activateChipFor('ALL');
    render();
  };
}

function initApp(){
  const saved = loadProgress();
  const savedTotal = saved ? (saved.cat==='ALL' ? DATA.length : DATA.filter(d=>d.s===saved.cat).length) : 0;
  if(saved &amp;&amp; typeof saved.idx === 'number' &amp;&amp; saved.idx > 0 &amp;&amp; saved.idx < savedTotal){
    showResumeBanner(saved);
  } else {
    render();
  }
}

function escapeHtml(str){
  return str
    .replace(/&amp;/g,'&amp;amp;')
    .replace(/</g,'&amp;lt;')
    .replace(/>/g,'&amp;gt;')
    .replace(/\n/g,'<br>');
}




const tabs = Array.from(document.querySelectorAll('.tab'));
const panels = Array.from(document.querySelectorAll('.panel'));
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.setAttribute('aria-selected', String(x === t)));
  panels.forEach(p => p.classList.toggle('on', p.id === t.dataset.panel));
  window.scrollTo({top:0, behavior:'instant'});
}));

initApp();

  <section class=&quot;panel on&quot; id=&quot;p-guide&quot;><div class=&quot;lead&quot;>令和元〜7年度の過去問を全部ばらして、<b>問1から問15まで毎年テーマが固定</b>されていることを確認しました。
だから問ごとに「これだけ覚える」「この単語が出たら✕」を用意すれば足ります。
理屈がわからなくても構いません。<b>単語を見つけて○✕を付ける</b>、それだけで点は取れます。</div><nav class=&quot;toc&quot;><div class=&quot;toc-h&quot;>目次</div><ol><li><a href=&quot;#s1&quot;>燃焼・爆発</a></li><li><a href=&quot;#s2&quot;>ガスの性質</a></li><li><a href=&quot;#s3&quot;>金属の腐食・材料の劣化</a></li><li><a href=&quot;#s4&quot;>計装（計測機器・制御）</a></li><li><a href=&quot;#s5&quot;>配管・弁・装置</a></li><li><a href=&quot;#s6&quot;>ポンプ・圧縮機</a></li><li><a href=&quot;#s7&quot;>流動・伝熱・分離</a></li><li><a href=&quot;#s8&quot;>流体の漏えい防止</a></li><li><a href=&quot;#s9&quot;>リスクマネジメント</a></li><li><a href=&quot;#s10&quot;>静電気・防爆構造・非常用電源</a></li><li><a href=&quot;#s11&quot;>保安装置（安全弁・逆止弁）</a></li><li><a href=&quot;#s12&quot;>防災設備・除害措置</a></li><li><a href=&quot;#s13&quot;>運転管理</a></li><li><a href=&quot;#s14&quot;>設備管理・工事管理</a></li><li><a href=&quot;#s15&quot;>非破壊検査・設備の検査</a></li></ol></nav><section class=&quot;sec&quot; id=&quot;s1&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問1</span><span class=&quot;sec-t&quot;>燃焼・爆発</span></div><p class=&quot;sec-lead&quot;>爆発範囲が広がるか狭まるか、それだけ聞かれます。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>圧力を上げる・温度を上げる・酸素中にする</b> → 全部「<b>爆発範囲は広がる</b>」</li><li><b>圧力を上げる</b> → 消炎距離は<b>小さく</b>なる／最小発火エネルギーは<b>低下</b>する</li><li>最大安全すき間は消炎距離より<b>小さい</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「爆発範囲は<b>狭くなる</b>」→ 広がるので✕</li><li>「圧力が上昇しても最小発火エネルギーは<b>変化しない</b>」→ 低下するので✕</li><li>「最小発火エネルギーはガスの<b>種類によらず</b>ほぼ同じ」→ 水素とアンモニアで1000倍違うので✕</li><li>「不活性ガスの効果は<b>種類によらず</b>同じ」→ 二酸化炭素＞窒素なので✕</li><li>「高圧になると消炎距離は<b>大きく</b>なる」→ 小さくなるので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>粉じん爆発、液滴（スプレー）爆発、蒸気爆発の説明文は、そのまま○で出ることがほとんどです。読み飛ばして○にして構いません。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s2&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問2</span><span class=&quot;sec-t&quot;>ガスの性質</span></div><p class=&quot;sec-lead&quot;>空気より重いか軽いか、燃えるか燃えないか。この2つだけです。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li>基準は<b>空気の分子量29</b>。これより大きければ重い、小さければ軽い</li><li><b>軽い</b>：H₂ 水素2／CH₄ メタン16／NH₃ アンモニア17／HCN シアン化水素27／CO 一酸化炭素28</li><li><b>重い</b>：H₂S 硫化水素34／CO₂ 二酸化炭素44／C₃H₈ プロパン44／C₄H₁₀ ブタン58／Cl₂ 塩素71／COCl₂ ホスゲン99</li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「<b>メタン CH₄</b>は空気より重く低い所に滞留」→ 12+1×4＝16なので軽い。✕</li><li>「<b>一酸化炭素 CO</b>は不燃性」→ 可燃性なので✕</li><li>「<b>二酸化炭素 CO₂</b>は可燃性」→ 不燃性なので✕</li><li>「<b>酸化エチレン C₂H₄O</b>は毒性はない」→ 毒性ガスなので✕</li><li>「<b>塩素 Cl₂</b>は化学的に極めて不活性」→ 反応活性が高いので✕</li><li>「<b>エチレン C₂H₄</b>は無臭で水によく溶ける」→ 甘い臭いがあり水にほとんど溶けないので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>HCN シアン化水素＝アーモンド臭、N₂O 亜酸化窒素＝麻酔ガス。この2つだけ覚えれば臭い・用途の問題は足ります。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s3&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問3</span><span class=&quot;sec-t&quot;>金属の腐食・材料の劣化</span></div><p class=&quot;sec-lead&quot;>どの材料を選ぶか。ほぼ一択で決まります。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>高温が絡んだらクロムモリブデン鋼</b>（水素侵食もクリープも）</li><li><b>低温が絡んだらオーステナイト系ステンレス鋼</b></li><li><b>コロージョン＝腐食／エロージョン＝衝突による摩耗</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>高温の話で「<b>炭素鋼</b>を採用した」→ ほぼ✕。クロムモリブデン鋼が正解</li><li>「高温ガス腐食に<b>電気防食</b>を適用」→ 電気防食は水中・土中の湿食のみ。✕</li><li>「アンモニア溶液に<b>銅合金</b>」→ 使えないので✕</li><li>「酸化速度は皮膜の成長とともに<b>増加</b>」→ 低下するので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>孔食・粒界腐食・応力腐食割れの説明文は素直な内容で○になることが多いです。塩化物＋ステンレス＝孔食、とだけ結び付けておけば十分。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s4&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問4</span><span class=&quot;sec-t&quot;>計装（計測機器・制御）</span></div><p class=&quot;sec-lead&quot;>言葉の入れ替えだけ。中身は問われません。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>フェール・セーフ＝故障しても安全側</b></li><li><b>フール・プルーフ＝人に誤操作させない</b>（カバー、インターロック）</li><li><b>カスケード制御＝ある調節計の出力が別の調節計の目標値になる</b></li><li>オリフィス流量計は<b>圧力損失が大きい</b>。流量は差圧の<b>1/2乗</b>に比例</li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「緊急停止ボタンに<b>カバーを付ける＝フェール・セーフ</b>」→ フール・プルーフなので✕</li><li>「オリフィス流量計は<b>圧力損失が小さい</b>」→ 大きいので✕</li><li>「流量は差圧の<b>2乗</b>に比例」→ 1/2乗なので✕</li><li>「800℃の測定に<b>銅-コンスタンタン</b>」→ 300℃までなので✕</li><li>「<b>容積式</b>流量計は異物を含む流体に用いる」→ 異物が詰まるので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>熱電対の種類は「銅-コンスタンタンは300℃まで」だけ。それ以上の温度は白金系、と覚えておけば足ります。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s5&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問5</span><span class=&quot;sec-t&quot;>配管・弁・装置</span></div><p class=&quot;sec-lead&quot;>コールドスプリングの向きだけ確実に。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>コールドスプリング＝熱変位と「逆向き」</b>に、あらかじめ変形させておく</li><li>サポート設計では<b>雪・氷も風圧も両方</b>考慮する</li><li>蒸留塔は<b>上が低沸点、下が高沸点</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「コールドスプリングは熱変位と<b>同じ向き</b>」→ 逆向きなので✕</li><li>「風圧による荷重は<b>考慮しなかった</b>」→ ✕</li><li>「<b>差込み溶接式</b>管継手を振動や腐食の激しい箇所に使用」→ 避けるべきなので✕</li><li>「塔<b>上</b>部から高沸点、塔<b>下</b>部から低沸点」→ 逆なので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>ベローズ形伸縮管継手、伸縮ループ、突合せ溶接管継手の説明文はそのまま○が多いです。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s6&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問6</span><span class=&quot;sec-t&quot;>ポンプ・圧縮機</span></div><p class=&quot;sec-lead&quot;>「増える／減る」の向きを逆にしてくるだけです。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li>吐出し配管が<b>詰まる</b> → 吐出し量は減り、<b>吐出圧は上がる</b></li><li>往復ポンプの<b>シリンダ数を増やす</b> → 脈動は<b>小さく</b>なる</li><li><b>サージング対策で吐出し弁を絞るのは逆効果</b></li><li>キャビテーション対策＝<b>利用しうるNPSHを大きく</b>する</li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「詰まると吐出圧は<b>下がる</b>」→ 上がるので✕</li><li>「シリンダ数の増加により脈動は<b>大きく</b>なる」→ 小さくなるので✕</li><li>「サージング対策として吐出し弁を絞るのは<b>有効</b>」→ ✕</li><li>「往復ポンプはNPSHを<b>考えなくてもよい</b>」→ ✕</li><li>「液密度が高くなっても過負荷の<b>可能性はない</b>」→ 過負荷になり得るので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>プランジャポンプ＝往復ポンプ、という分類だけ押さえれば分類問題は取れます。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s7&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問7</span><span class=&quot;sec-t&quot;>流動・伝熱・分離</span></div><p class=&quot;sec-lead&quot;>相当長さと熱伝導率、この2つが狙われます。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li>継手や弁の損失は<b>相当「長さ」</b>（等価な直管の長さ）に置き換える</li><li>断熱材の熱伝導率は<b>0.03〜0.05</b>と<b>極めて小さい</b></li><li>層流の平均流速は中心速度の<b>1/2</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「<b>相当直径</b>に置き換えて求める」→ 相当長さなので✕</li><li>「断熱材の熱伝導率は<b>極めて大きい</b>」→ 小さいので✕</li><li>「管路の急激な<b>拡大</b>による損失はない」→ 損失は発生するので✕</li><li>「総括伝熱係数は2つの熱伝達率を<b>合計</b>した係数」→ ✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>膜分離のモジュール形状（中空糸型・平膜型・スパイラル型）、物理吸着と化学吸着の違いは、素直な説明文で○になります。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s8&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問8</span><span class=&quot;sec-t&quot;>流体の漏えい防止</span></div><p class=&quot;sec-lead&quot;>静止部か運動部か。これだけで半分解けます。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>ガスケット＝静止部</b>（フランジ面）／<b>パッキン＝運動部</b>（しゅう動部）</li><li><b>グランドパッキンはわずかに漏れる</b>ので可燃性・毒性には不適</li><li><b>メカニカルシールは精密で振動に弱い</b></li><li><b>金属ガスケットは復元力が小さい</b>ので高温では増し締めが必要</li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「しゅう動部に使用するものを<b>ガスケット</b>と呼ぶ」→ パッキンなので✕</li><li>「グランドパッキンは漏えいを<b>ほぼ完全に止められる</b>」→ ✕</li><li>「メカニカルシールは<b>振動に強い</b>」→ 弱いので✕</li><li>「金属ガスケットは復元力が大きく増し締めは<b>必要ない</b>」→ ✕</li><li>「テンション法は同時に均一に締め付けることが<b>できない</b>」→ できるので✕</li><li>「相対締付け法は各ボルトを<b>一度で</b>締め付ける」→ 複数回に分けるので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>ラビリンスシール、オイルフィルムシールは「漏れが許されないガスに使う」方向の説明なら○です。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s9&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問9</span><span class=&quot;sec-t&quot;>リスクマネジメント</span></div><p class=&quot;sec-lead&quot;>手法の役割分担さえ知っていれば解けます。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>HAZOP＝ずれからハザードを特定</b>（バッチにも使える）</li><li><b>FTA＝頂上事象から原因へ</b>。発生確率を出せる</li><li><b>特性要因図・4M分析＝原因の整理と対策立案だけ</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「<b>特性要因図</b>で事故の発生確率を算出」→ ✕</li><li>「HAZOPは<b>バッチ反応系には適さない</b>」→ 適用できる手法があるので✕</li><li>「複数の手法を併用して解析することは<b>できない</b>」→ ✕</li><li>「リスク評価は<b>社外の第三者</b>が行わなければならない」→ 社内でよいので✕</li><li>「対応策による新しいハザードは<b>考えなくてよい</b>」→ ✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>残留リスク、リスクの低減・移転・保有という言葉は、そのまま○で出ます。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s10&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問10</span><span class=&quot;sec-t&quot;>静電気・防爆構造・非常用電源</span></div><p class=&quot;sec-lead&quot;>防爆構造は4つだけ区別できれば十分です。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>耐圧防爆＝容器内の爆発を外に伝えない</b></li><li><b>内圧防爆＝保護ガスで加圧</b>（圧力低下で作動する保護装置が要る）</li><li><b>本質安全＝故障時もエネルギーが最小発火エネルギー未満</b></li><li><b>非点火＝第二類危険箇所限定</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「非点火防爆構造は<b>頻繁に爆発危険濃度になる場所でも</b>使える」→ 第二類限定なので✕</li><li>「導電率が違っても静電気の低減速度は<b>同じ</b>」→ ✕</li><li>「不導体では蓄積した静電エネルギーの<b>全部が必ず</b>一度に放電する」→ ✕</li><li>「1.0mmのガス用の耐圧防爆構造を0.5mm以下のガスに使う」→ ✕（逆向きの「0.5mm以下用を1.0mmのガスに使う」は○）</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>静電気対策の分類は「夾雑物の除去＝発生抑制」「接地・静電靴＝緩和除去」「不活性ガス注入＝爆発性ガスの形成防止」の3つだけ。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s11&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問11</span><span class=&quot;sec-t&quot;>保安装置（安全弁・逆止弁）</span></div><p class=&quot;sec-lead&quot;>型式の使い分けです。可燃性・毒性は必ず密閉型。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>可燃性・毒性ガス＝密閉型安全弁</b></li><li><b>リフト逆止弁＝水平配管のみ</b>／<b>スイング逆止弁＝垂直でも可</b></li><li><b>破裂板は定期交換が必要</b></li><li><b>緊急遮断装置の操作場所は貯槽から5m以上</b>（コンビ則なら10m以上）</li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「可燃性ガスに<b>開放型</b>安全弁を設置」→ ✕</li><li>「破裂板は定期的に交換する<b>必要がない</b>」→ ✕</li><li>「スイング逆止弁は弁体が<b>垂直に作動</b>するので垂直配管に付けてはならない」→ それはリフト。✕</li><li>「操作場所は貯槽に<b>できる限り近い</b>場所」→ 5m以上離すので✕</li><li>「<b>逆流防止装置</b>は貯槽が負圧のとき空気を吸引する」→ それは負圧防止装置。✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>破裂板が「圧力上昇が速い場合に効果的」という説明は○です。ここは例外的に「不適当」という語が入っていても○。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s12&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問12</span><span class=&quot;sec-t&quot;>防災設備・除害措置</span></div><p class=&quot;sec-lead&quot;>ベントとフレアー、それと除害剤の組合せ。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>ベントスタック＝そのまま大気へ</b>／<b>フレアースタック＝燃焼させてから</b></li><li><b>酸性ガスはアルカリで吸収</b>（カセイソーダ、炭酸ソーダ、消石灰）</li><li><b>アンモニア＝水で吸収、シアン化水素＝カセイソーダ水溶液で吸収</b></li><li>防液堤は液の表面積が<b>小さく</b>なるように</li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「<b>ベントスタック</b>は完全に燃焼させて放出する」→ それはフレアー。✕</li><li>「硫化水素の除害に<b>塩酸水溶液</b>」→ 酸で酸性ガスは吸えない。✕</li><li>「防液堤は液の表面積が<b>大きく</b>なるように」→ ✕</li><li>「障壁は毒性ガスを<b>滞留させる</b>ように配置」→ 滞留させないので✕</li><li>「拡散型は吸引型に比べ検知の遅れが<b>少ない</b>」→ 吸引型の方が速いので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>空気呼吸器と送気式マスクの比較、隔膜イオン電極式＝塩素、定電位電解式＝一酸化炭素・硫化水素。この対応だけ。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s13&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問13</span><span class=&quot;sec-t&quot;>運転管理</span></div><p class=&quot;sec-lead&quot;>現場で「それはまずいだろう」と思う文が✕です。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>フラッディング</b>が起きると塔底液の抜出量は<b>減少</b></li><li><b>ロールオーバー</b>＝低温液の層が入れ替わり大量のガスが発生</li><li><b>ホットスポット</b>＝スケール沈着による局部過熱。強度が下がり破壊のおそれ</li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「フラッディングで塔底液の抜出量が<b>増加</b>」→ 減少するので✕</li><li>「開閉が固いので<b>多勢の運転員で</b>柄の長いハンドル廻しを使って開けた」→ ✕</li><li>「安全弁の元弁を<b>施錠せず</b>すぐ操作できるようにした」→ 施錠すべきなので✕</li><li>「酸素容器のバルブ内部に<b>潤滑油</b>を塗布」→ ✕</li><li>「輝度が大きくなる部分が発生するが強度への<b>影響はない</b>」→ ✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>非定常作業の区分、破壊発生時の孤立化→放出→パージという手順は、そのまま○になります。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s14&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問14</span><span class=&quot;sec-t&quot;>設備管理・工事管理</span></div><p class=&quot;sec-lead&quot;>置換作業の数字と、保全方式の名前。ここは数字を覚えるだけ。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li>置換の順番：<b>爆発下限界の1/4以下まで窒素 → 空気で再置換 → 酸素18〜22%を確認 → 入る</b></li><li><b>TBM＝決めた周期で整備</b>／<b>CBM＝監視して寿命を予測</b>／<b>計画事後保全＝壊れてから</b></li><li>保全計画の順番：<b>対象設備 → 重要度ランク → 保全方式</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「<b>爆発下限界以下</b>になるまで窒素で置換」→ 1/4以下なので✕</li><li>「塔槽内へ<b>入ってから</b>速やかに酸素濃度を測定」→ 入る前なので✕</li><li>「CBMは<b>故障してから</b>整備する方式で費用が小さい」→ それは計画事後保全。✕</li><li>「まず保全方式を決定した後に<b>重要度ランク</b>を決定」→ 順番が逆。✕</li><li>「安全工具を使用すれば消火器の設置は<b>不要</b>」→ ✕</li><li>「計画事後保全は重要度ランクの<b>高い</b>機器に適用」→ 低い機器なので✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>火気工事でガス検知をする、仕切板を挿入する、といった当たり前の手順は○です。</p></div></div></section><section class=&quot;sec&quot; id=&quot;s15&quot;><div class=&quot;sec-h&quot;><span class=&quot;sec-n&quot;>問15</span><span class=&quot;sec-t&quot;>非破壊検査・設備の検査</span></div><p class=&quot;sec-lead&quot;>表を1つ覚えるだけで毎年1点。ここは絶対に落とさないでください。</p><div class=&quot;box keep&quot;><div class=&quot;box-h&quot;>これだけ覚える</div><div class=&quot;box-b&quot;><ul><li><b>PT 浸透探傷＝表面だけ</b>（染色は明所、蛍光は暗所で紫外線）</li><li><b>MT 磁粉探傷＝磁性材料だけ</b>（SUS304など非磁性は不可）</li><li><b>UT 超音波＝内部。減衰が小さいので厚肉に向く</b></li><li><b>RT 放射線＝内部。ブローホール・溶接部・鋳物</b></li><li><b>ET 渦電流＝熱交換器チューブ、線・棒の表面</b></li><li><b>AE＝大型構造物を一度に</b></li><li><b>耐圧試験は原則として水などの液体で行う</b></li></ul></div></div><div class=&quot;box ng&quot;><div class=&quot;box-h&quot;>この言葉が出たら✕</div><div class=&quot;box-b&quot;><ul><li>「<b>浸透探傷</b>試験で内部のブローホールを検出」→ 表面だけなので✕。<b>毎年出ます</b></li><li>「超音波は減衰が<b>大きく厚肉に適さない</b>」→ 小さく厚肉向きなので✕</li><li>「超音波は<b>表面の欠陥には適用できない</b>」→ 表面波で可能なので✕</li><li>「磁粉探傷は<b>導体である金属には適用できる</b>」→ 非磁性は不可なので✕</li><li>「耐圧試験は原則として<b>気体</b>を用いて行う」→ 水なので✕</li><li>「染色浸透液を用いる場合は<b>暗い場所で紫外線</b>」→ 蛍光の話。✕</li></ul></div></div><div class=&quot;box drop&quot;><div class=&quot;box-h&quot;>余計なことは覚えない</div><div class=&quot;box-b&quot;><p>AE試験の原理説明はそのまま○です。「音波を検出」と書いてあれば○で構いません。</p></div></div></section></section>
  <section class=&quot;panel&quot; id=&quot;p-quiz&quot;><div class=&quot;lead&quot;>過去問<b>105問</b>を1問ずつ解きます。選択肢をタップすると、その選択肢が正解／不正解である理由が全部出ます。下のチップで<b>年度別</b>に絞れます。進み具合は自動で保存されます。</div><div class=&quot;yearbox&quot;><div class=&quot;yearbox-h&quot;>年度を選ぶ</div><div class=&quot;cats&quot; id=&quot;catBar&quot;></div></div><div class=&quot;progress-row&quot;><span class=&quot;progress-label&quot; id=&quot;progLabel&quot;>1 / 1</span><div class=&quot;progress-track&quot;><div class=&quot;progress-fill&quot; id=&quot;progFill&quot; style=&quot;width:0%&quot;></div></div><span class=&quot;score-label&quot; id=&quot;scoreLabel&quot;>正解 0</span></div><div class=&quot;card&quot; id=&quot;quizCard&quot;></div></section>
  <section class=&quot;panel&quot; id=&quot;p-kw&quot;><div class=&quot;lead&quot;>誤り選択肢の作り方は<b>4つの型</b>しかありません。中身がわからなくても、言い回しだけで✕を外せます。<b>5択のうち2つ外れれば正答率は倍</b>です。</div><div class=&quot;kwgrp&quot;><div class=&quot;rules-h&quot;>① 地雷ワード</div><div class=&quot;mine&quot;><div class=&quot;mine-head&quot;><div class=&quot;mine-x&quot;>この言い回しが出たら</div><div class=&quot;mine-p&quot;>必要ない／不要／考えなくてよい／〜しなかった</div><span class=&quot;mine-stat&quot;>過去7年 7回登場 → 7回とも✕</span></div><div class=&quot;mine-why&quot;>保安の試験は「やらなくていい」と言い切る文をまず疑う設計になっています。安全側の手間を省く記述はまず正解になりません。</div><div class=&quot;mine-ex&quot;><div class=&quot;mine-ex-lbl&quot;>実際に出た文</div><p>金属ガスケットは復元力が大きく、高温増し締めは<b>必要ない</b>。</p><p>破裂板は破裂するまで使えるので、定期的に交換する<b>必要がない</b>。</p><p>往復ポンプはNPSHを<b>考えなくてもよい</b>。</p><p>雪や氷の荷重は考慮したが、風圧による荷重は<b>考慮しなかった</b>。</p><p>改定理由を明記したので、運転員への教育を<b>実施しなかった</b>。</p><p>対応策で生じる新しいハザードの発生可能性は<b>考えなくてもよい</b>。（R2・R7保安 問9で連続出題）</p></div></div><div class=&quot;mine&quot;><div class=&quot;mine-head&quot;><div class=&quot;mine-x&quot;>この言い回しが出たら</div><div class=&quot;mine-p&quot;>できない／適さない／適用できない／取り付けてはならない</div><span class=&quot;mine-stat&quot;>過去7年 18回登場 → 17回が✕</span></div><div class=&quot;mine-why&quot;>「この方法は使えない」と範囲を狭める文も、たいてい言い過ぎです。実際は条件付きで使えることがほとんど。</div><div class=&quot;mine-ex&quot;><div class=&quot;mine-ex-lbl&quot;>実際に出た文</div><p>超音波探傷試験は材料表面の欠陥の検出には<b>適用できない</b>。（表面波で可能）</p><p>ブルドン管圧力計は負のゲージ圧力の測定には<b>使用できない</b>。（可能）</p><p>HAZOPはバッチ反応系には<b>適さない</b>。（適用できる手法がある）</p><p>オイルフィルムシールはアンモニアガスには<b>適用できない</b>。（むしろ適用対象）</p><p>スイング逆止弁は垂直配管に<b>取り付けてはならない</b>。（取り付け可）</p><p>半導体式ガス検知器は毒性ガスの検知には<b>適さない</b>。（毒性ガス用の製品もある）</p><p>浸透探傷試験は非金属には<b>適用できない</b>。（表面が多孔質でなければ、セラミックスやプラスチックなど非金属にも使える）</p></div><div class=&quot;mine-why&quot;>唯一の例外は「破裂板は圧力上昇が速く<b>不適当</b>な場合に効果的」（R3保安 問11）。これは○です。</div></div><div class=&quot;mine&quot;><div class=&quot;mine-head&quot;><div class=&quot;mine-x&quot;>この言い回しが出たら</div><div class=&quot;mine-p&quot;>影響はない／変化しない／可能性はない</div><span class=&quot;mine-stat&quot;>出れば✕がほぼ確定</span></div><div class=&quot;mine-why&quot;>何かが起きても無害だと言い切る文は、危険を見落とさせるための誤り選択肢です。</div><div class=&quot;mine-ex&quot;><div class=&quot;mine-ex-lbl&quot;>実際に出た文</div><p>加熱管の局部的な輝度上昇は、管の強度への<b>影響はない</b>。（過昇温で破壊のおそれ）</p><p>断熱圧縮では温度は<b>変化しない</b>。（上昇する）</p><p>液密度が高くなっても原動機の過負荷の<b>可能性はない</b>。（過負荷になり得る）</p><p>圧力が上昇しても最小発火エネルギーは<b>変化しない</b>。（著しく低下する）</p></div></div><div class=&quot;mine&quot;><div class=&quot;mine-head&quot;><div class=&quot;mine-x&quot;>この言い回しが出たら</div><div class=&quot;mine-p&quot;>種類によらず／に関係なく／いずれも同じ</div><span class=&quot;mine-stat&quot;>過去7年 8回登場 → 6回が✕</span></div><div class=&quot;mine-why&quot;>物質ごとに値が違うからこそ試験問題になります。「どれも同じ」は成立しません。</div><div class=&quot;mine-ex&quot;><div class=&quot;mine-ex-lbl&quot;>実際に出た文</div><p>最小発火エネルギーは可燃性混合ガスの<b>種類によらず</b>ほぼ同じ。（水素とアンモニアで約1000倍違う）</p><p>不活性ガスの効果は、体積比率が同じなら<b>種類によらず</b>同じ。（二酸化炭素＞窒素）</p><p>接地による静電気の低減速度は、導電率が違っても<b>同じ</b>。（導電率で変わる）</p><p>ヘンリーの法則で溶ける気体の量は分圧に<b>よらず一定</b>。（実際は分圧に比例する）</p><p>圧力を高くすると融点・凝固点は物質の<b>種類に関係なく</b>上がる。（水は逆に下がる例外あり）</p></div></div><div class=&quot;mine&quot;><div class=&quot;mine-head&quot;><div class=&quot;mine-x&quot;>この言い回しが出たら</div><div class=&quot;mine-p&quot;>必ず／すべて／だけ</div><span class=&quot;mine-stat&quot;>言い切りは半分以上が✕</span></div><div class=&quot;mine-why&quot;>完全に言い切る文は例外が1つあれば崩れます。ただし定義を述べる文では正しいこともあるので、地雷ワードの中ではやや弱め(過去7年で6回登場、✕は3回・○も3回と五分五分)。</div><div class=&quot;mine-ex&quot;><div class=&quot;mine-ex-lbl&quot;>実際に出た文</div><p>不導体に蓄積した静電エネルギーの<b>全部が必ず</b>一度に放電する。（一部のことがある）</p><p>リスク評価は社外の第三者によって行われ<b>なければならない</b>。（社内でよい）</p><p>爆ごうはどんな細い管の中でも伝ぱする。（管径が細すぎると伝ぱできない）</p></div></div></div><div class=&quot;kwgrp&quot;><div class=&quot;rules-h&quot;>② どっちがどっち</div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問4 計装</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>フェール・セーフ</div><div class=&quot;pair-desc&quot;>機器が<b>故障しても</b>安全側に止まる。設計の話。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>フール・プルーフ</div><div class=&quot;pair-desc&quot;>人に<b>誤操作させない</b>。カバー・インターロック。人の話。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>「カバーを付ける」「二重に操作させる」と書いてあればフール・プルーフ。故障・異常の話ならフェール・セーフ。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問3 腐食</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>コロージョン</div><div class=&quot;pair-desc&quot;><b>腐食</b>。化学的に材料が侵される。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>エロージョン</div><div class=&quot;pair-desc&quot;><b>摩耗</b>。流体・気泡・固体粒子の衝突による損傷。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>コロージョン＝Corrosion＝腐食。エロージョン＝Erosion＝浸食・削れ。両方が同時に起こるのがエロージョン・コロージョン。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問11 安全弁</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>開放型安全弁</div><div class=&quot;pair-desc&quot;>吹き出した流体が<b>放出口以外からも</b>出る。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>密閉型安全弁</div><div class=&quot;pair-desc&quot;><b>放出口だけ</b>から出る。可燃性・毒性ガスはこちら。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>可燃性・毒性ガスに開放型と書いてあれば即✕。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問11 逆止弁</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>リフト逆止弁</div><div class=&quot;pair-desc&quot;>弁体が弁座に対し<b>垂直</b>に動く。<b>水平配管のみ</b>。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>スイング逆止弁</div><div class=&quot;pair-desc&quot;>弁体が<b>振り子状</b>に動く。垂直配管にも使える。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>「垂直に作動する＝リフト」。スイングに垂直作動と書いてあれば✕。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問12 放出設備</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>ベントスタック</div><div class=&quot;pair-desc&quot;>ガスを<b>そのまま大気へ</b>放出する。着火時に消火できる措置が必要。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>フレアースタック</div><div class=&quot;pair-desc&quot;>ガスを<b>燃焼させてから</b>放出する。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>「完全に燃焼させて放出＝フレアー」。ベントに燃焼と書いてあれば✕。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問8 シール</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>ガスケット</div><div class=&quot;pair-desc&quot;><b>静止部</b>に使う。フランジ面など。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>パッキン</div><div class=&quot;pair-desc&quot;><b>運動部</b>に使う。往復・回転のしゅう動部。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>動くところに使うのがパッキン。ガスケットに「しゅう動部」と書いてあれば✕。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問8 シール</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>グランドパッキン</div><div class=&quot;pair-desc&quot;><b>わずかな漏れが前提</b>。可燃性・毒性には不適。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>メカニカルシール</div><div class=&quot;pair-desc&quot;>端面密封で漏れをほぼ止められるが、<b>精密で振動に弱い</b>。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>「グランドパッキンで完全に止まる」も「メカニカルシールは振動に強い」もどちらも✕。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問14 保全方式</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>状態基準保全 CBM</div><div class=&quot;pair-desc&quot;>温度・振動を<b>監視して寿命を予測</b>し、整備時期を決める。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>計画事後保全</div><div class=&quot;pair-desc&quot;><b>壊れてから直す</b>前提で計画。重要度の低い機器向け。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>「寿命まで使い切るので費用が小さい」と書いてあればCBMではなく計画事後保全。時間基準保全TBMは決めた周期で整備。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問9 リスク解析</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>HAZOP</div><div class=&quot;pair-desc&quot;>プロセスパラメータの<b>ずれ</b>からハザードを特定する。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>FTA</div><div class=&quot;pair-desc&quot;><b>頂上事象から原因へ</b>掘り下げ、発生確率を推算できる。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>特性要因図・4M分析は<b>原因の整理と対策立案</b>用。ハザード特定や確率算出に使うと書いてあれば✕。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問11 保安装置</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>逆流防止装置</div><div class=&quot;pair-desc&quot;>設備内のガスが<b>減圧設備や容器へ逆流</b>するのを防ぐ。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>負圧防止装置</div><div class=&quot;pair-desc&quot;>貯槽が負圧のとき<b>空気や窒素を吸引</b>して圧力低下を防ぐ。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>「負圧になった場合に空気を吸引」と書いてあるのに逆流防止装置と呼んでいれば✕。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問15 非破壊検査</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>浸透探傷試験 PT</div><div class=&quot;pair-desc&quot;><b>表面に開口した</b>欠陥だけ。内部は見えない。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>放射線透過試験 RT</div><div class=&quot;pair-desc&quot;><b>内部</b>のブローホール・溶接部・鋳物。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>「浸透探傷で内部のブローホールを検出」は最頻出の✕。染色浸透液は明所、蛍光浸透液は暗所で紫外線。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問15 非破壊検査</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>超音波探傷試験 UT</div><div class=&quot;pair-desc&quot;>減衰が<b>小さい</b>→<b>厚肉に向く</b>。表面波で表面も可。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>放射線透過試験 RT</div><div class=&quot;pair-desc&quot;>減衰が<b>大きい</b>→厚肉は不利。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>超音波と放射線は減衰の大小が逆。「超音波は減衰が大きく厚肉に適さない」は✕。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問15 非破壊検査</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>磁粉探傷試験 MT</div><div class=&quot;pair-desc&quot;><b>磁性材料のみ</b>。SUS304など非磁性には使えない。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>渦電流探傷試験 ET</div><div class=&quot;pair-desc&quot;><b>導体</b>なら可。熱交換器チューブ、線・棒の表面きず。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>「磁粉探傷は導体である金属には適用できる」は✕（非磁性ステンレスは不可）。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問4 流量計</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>オリフィス流量計</div><div class=&quot;pair-desc&quot;>圧力損失が<b>大きく</b>、沈殿物がたまり<b>やすい</b>。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>ベンチュリ流量計</div><div class=&quot;pair-desc&quot;>圧力損失が<b>小さい</b>。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>オリフィスに「圧力損失が小さい」「異物を含む流体に用いる」と書いてあれば✕。流量は差圧の<b>1/2乗</b>に比例（2乗は✕）。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問5 配管</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>コールドスプリング</div><div class=&quot;pair-desc&quot;>熱変位と<b>逆向き</b>の変形をあらかじめ与えておく。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>（誤りの記述）</div><div class=&quot;pair-desc&quot;>熱変位と<b>同じ向き</b>に変形を与える、と書かれていたら✕。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>冷間で逆に引っぱっておく、と覚えます。</div></div><div class=&quot;pair&quot;><div class=&quot;pair-cat&quot;>保安 問7 流動</div><div class=&quot;pair-grid&quot;><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>相当長さ</div><div class=&quot;pair-desc&quot;>継手や弁の損失を<b>等価な直管の長さ</b>に置き換える。</div></div><div class=&quot;pair-side&quot;><div class=&quot;pair-name&quot;>相当直径</div><div class=&quot;pair-desc&quot;>断面が円でない流路を円管に換算するときの直径。別物。</div></div></div><div class=&quot;pair-key&quot;><strong>見分けるカギ</strong>「挿入物の損失を相当直径に置き換える」は✕。長さに置き換えます。</div></div></div><div class=&quot;kwgrp&quot;><div class=&quot;rules-h&quot;>③ 向きで覚える</div><div class=&quot;dgrp&quot;><div class=&quot;dgrp-h&quot;>燃焼・爆発</div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>圧力を上げる</div><div class=&quot;dthen&quot;>爆発範囲は<b>広がる</b>（下限界↓・上限界↑）</div><div class=&quot;dnote&quot;>「狭くなる」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>温度を上げる</div><div class=&quot;dthen&quot;>爆発範囲は<b>広がる</b></div><div class=&quot;dnote&quot;>同上</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>空気中 → 酸素中</div><div class=&quot;dthen&quot;>爆発範囲は<b>広がる</b></div><div class=&quot;dnote&quot;>「酸素中では狭くなる」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>圧力を上げる</div><div class=&quot;dthen&quot;>消炎距離は<b>小さく</b>なる</div><div class=&quot;dnote&quot;>「大きくなる」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>圧力を上げる</div><div class=&quot;dthen&quot;>最小発火エネルギーは<b>低下</b></div><div class=&quot;dnote&quot;>「変化しない」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>化学量論組成に近づく</div><div class=&quot;dthen&quot;>消炎距離・最小発火エネルギーは<b>最小</b></div><div class=&quot;dnote&quot;>この2つは最小</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>化学量論組成に近づく</div><div class=&quot;dthen&quot;>燃焼速度は<b>最大</b></div><div class=&quot;dnote&quot;>これだけ最大。取り違えが定番</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>最大安全すき間と消炎距離</div><div class=&quot;dthen&quot;>最大安全すき間の方が<b>小さい</b></div></div></div><div class=&quot;dgrp&quot;><div class=&quot;dgrp-h&quot;>ポンプ・圧縮機</div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>吐出し配管が詰まる</div><div class=&quot;dthen&quot;>吐出し量は減り、吐出圧は<b>上がる</b></div><div class=&quot;dnote&quot;>「下がる」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>取扱い液の密度が高くなる</div><div class=&quot;dthen&quot;>軸動力が<b>増える</b>（過負荷の可能性）</div><div class=&quot;dnote&quot;>「可能性はない」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>往復ポンプのシリンダ数を増やす</div><div class=&quot;dthen&quot;>脈動は<b>小さく</b>なる</div><div class=&quot;dnote&quot;>「大きくなる」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>サージング対策</div><div class=&quot;dthen&quot;>吐出し弁を絞るのは<b>逆効果</b></div><div class=&quot;dnote&quot;>風量を下げると悪化</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>キャビテーション対策</div><div class=&quot;dthen&quot;>利用しうるNPSHを<b>大きく</b>する</div><div class=&quot;dnote&quot;>吸込み液面を高くする</div></div></div><div class=&quot;dgrp&quot;><div class=&quot;dgrp-h&quot;>塔・伝熱・材料</div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>蒸留塔の蒸気速度が大きすぎる</div><div class=&quot;dthen&quot;>フラッディング。塔底液の抜出量は<b>減少</b></div><div class=&quot;dnote&quot;>「増加」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>蒸留塔の抜出し</div><div class=&quot;dthen&quot;>塔上部＝<b>低沸点</b>／塔下部＝<b>高沸点</b></div><div class=&quot;dnote&quot;>逆は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>酸化皮膜が成長する</div><div class=&quot;dthen&quot;>酸化速度は<b>低下</b>する</div><div class=&quot;dnote&quot;>「増加する」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>金属ガスケットの復元力</div><div class=&quot;dthen&quot;><b>小さい</b>ので高温では増し締めが必要</div><div class=&quot;dnote&quot;>「大きいので不要」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>断熱材の熱伝導率</div><div class=&quot;dthen&quot;>0.03〜0.05 W/(m・K)で<b>極めて小さい</b></div><div class=&quot;dnote&quot;>「大きい」は✕</div></div><div class=&quot;drow&quot;><div class=&quot;dif&quot;>保温材が濡れる</div><div class=&quot;dthen&quot;>保温能力は<b>低下</b>する</div></div></div></div><div class=&quot;kwgrp&quot;><div class=&quot;rules-h&quot;>④ 数字で覚える</div><div class=&quot;num&quot;><div class=&quot;num-h&quot;>ガスの見分け方 ─ 基準は空気の分子量29</div><table class=&quot;num-t&quot;><tr><td>空気より<b>重い</b></td><td>塩素71／ホスゲン99／硫化水素34／二酸化炭素44／プロパン44／ブタン58</td><td>漏えい時は低所に滞留</td></tr><tr><td>空気より<b>軽い</b></td><td>水素2／メタン16／アンモニア17／シアン化水素27／一酸化炭素28</td><td>漏えい時は上方へ拡散</td></tr></table><div class=&quot;tips&quot;><p class=&quot;tip&quot;><b>シアン化水素27は「軽い」</b>。毒性が強いので重そうに見えるのが罠。最頻出。</p><p class=&quot;tip&quot;><b>メタン16も「軽い」</b>。「空気より重く低所に滞留」と書いてあれば✕。</p><p class=&quot;tip&quot;><b>一酸化炭素は可燃性</b>（不燃性は✕）。<b>二酸化炭素は不燃性</b>（可燃性は✕）。</p></div></div><div class=&quot;num&quot;><div class=&quot;num-h&quot;>爆発下限界と最小発火エネルギー</div><table class=&quot;num-t&quot;><tr><td>水素</td><td>下限界 4.0 vol%</td><td>最小発火エネルギー 0.016 mJ ＝最小クラス</td></tr><tr><td>アセチレン</td><td>2.5 vol%</td><td>0.019 mJ</td></tr><tr><td>エチレン</td><td>2.7 vol%</td><td>0.07 mJ</td></tr><tr><td>エタン</td><td>3.0 vol%</td><td>0.25 mJ</td></tr><tr><td>プロパン</td><td>2.1 vol%</td><td>0.25 mJ</td></tr><tr><td>ブタン</td><td>1.8 vol%</td><td>0.25 mJ</td></tr><tr><td>メタン</td><td>5.0 vol%</td><td>0.28 mJ</td></tr><tr><td>アンモニア</td><td>15 vol%</td><td>14 mJ ＝最大クラス</td></tr></table><div class=&quot;tips&quot;><p class=&quot;tip&quot;><b>下限界は分子が大きいほど小さい</b>。メタン5.0＞エタン3.0＞プロパン2.1＞ブタン1.8。並べ替え問題はこれで解けます。</p><p class=&quot;tip&quot;><b>最小発火エネルギーは水素・アセチレンが極小、アンモニアが極大</b>。両端だけ押さえれば順序問題は落としません。</p></div></div><div class=&quot;num&quot;><div class=&quot;num-h&quot;>試験に出る「決まった数字」</div><table class=&quot;num-t&quot;><tr><td>窒素置換の基準</td><td>爆発下限界の <b>1/4以下</b></td><td>「爆発下限界以下」は✕</td></tr><tr><td>入槽前の酸素濃度</td><td><b>18〜22 vol%</b></td><td>入る前に測定する。入ってからは✕</td></tr><tr><td>空気中の酸素濃度</td><td><b>21 vol%</b></td><td>必要空気量＝酸素mol÷0.21</td></tr><tr><td>空気の平均分子量</td><td><b>29</b></td><td></td></tr><tr><td>大気圧</td><td><b>0.1013 MPa</b></td><td>ゲージ圧力に足すと絶対圧力</td></tr><tr><td>緊急遮断装置の操作場所</td><td>貯槽外面から <b>5m以上</b></td><td>コンビナート則なら10m以上</td></tr><tr><td>CO₂・H₂Oの標準生成エンタルピー</td><td><b>−394</b>／<b>−286</b> kJ/mol</td><td>問8はこの2つで解ける</td></tr><tr><td>気体定数 R</td><td><b>8.314</b> J/(mol・K)</td><td></td></tr></table><div class=&quot;tips&quot;><p class=&quot;tip&quot;><b>1/4</b>と<b>18〜22</b>と<b>5m</b>は保安の問14・問11で毎年狙われます。数字そのものをすり替えてくるので、値ごと覚えます。</p></div></div><div class=&quot;num&quot;><div class=&quot;num-h&quot;>材料の選び方 ─ 環境で決まる</div><table class=&quot;num-t&quot;><tr><td>高温高圧の水素</td><td><b>クロムモリブデン鋼</b></td><td>炭素鋼は水素侵食に弱い。ネルソン線図で選定</td></tr><tr><td>高温クリープ</td><td><b>クロムモリブデン鋼</b></td><td>炭素鋼よりクリープ強度が高い</td></tr><tr><td>低温脆性</td><td><b>オーステナイト系ステンレス鋼</b></td><td>炭素鋼は低温で脆化</td></tr><tr><td>アンモニア溶液</td><td>銅・銅合金は<b>使えない</b></td><td></td></tr><tr><td>塩化物環境</td><td>ステンレス鋼で<b>孔食</b></td><td>SUS304は60℃以上＋塩化物で応力腐食割れ</td></tr><tr><td>電気防食</td><td><b>湿食（水中・土中）のみ</b>有効</td><td>高温ガス腐食には効かない</td></tr></table><div class=&quot;tips&quot;><p class=&quot;tip&quot;><b>迷ったらクロムモリブデン鋼</b>。高温がらみで「炭素鋼を採用した」と書いてあればまず✕です。</p></div></div><div class=&quot;num&quot;><div class=&quot;num-h&quot;>除害剤の組合せ</div><table class=&quot;num-t&quot;><tr><td>塩素</td><td>消石灰／カセイソーダ水溶液</td><td></td></tr><tr><td>硫化水素・亜硫酸ガス</td><td>カセイソーダ／炭酸ソーダ水溶液</td><td></td></tr><tr><td>ホスゲン</td><td>カセイソーダ水溶液</td><td></td></tr><tr><td>アンモニア</td><td>水（大量の水で吸収）</td></tr><tr><td>シアン化水素</td><td>カセイソーダ水溶液</td><td></td></tr></table><div class=&quot;tips&quot;><p class=&quot;tip&quot;><b>酸性ガスをアルカリで吸収</b>する、が原則。「硫化水素に塩酸水溶液」のように<b>酸で酸性ガスを吸収</b>する記述は✕です。</p></div></div></div></section>
  <section class=&quot;panel&quot; id=&quot;p-ref&quot;>
<div class=&quot;ref&quot; id=&quot;ref&quot;>
  <div class=&quot;rules-h&quot;>付録　化学式・ガス早見表</div>

ot;次のイ，ロ，ハ，ニの記述のうち，ガスの性質について正しいものはどれか。\nイ．メタンは，無色，無臭の可燃性のガスで，空気より重く，漏えい時には，低い所に滞留しやすい。\nロ．LPガスは，常温で圧縮すると容易に液化するので，液体として貯蔵，輸送される。\nハ．二酸化炭素は，無色，無臭の可燃性のガスで，水にはほとんど溶解しない。\nニ．塩素は，激しい刺激臭のあるガスで，毒性が極めて強く，可燃性物質に対して支燃性を示す。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ハ&quot;, &quot;ロ, ハ&quot;, &quot;ロ, ニ&quot;, &quot;ハ, ニ&quot;], &quot;a&quot;: 3, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。メタンは空気より軽く，漏えい時には上部に拡散しやすい。　ロ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。メタンは空気より軽く，漏えい時には上部に拡散しやすい。　ハ:✕ 誤り。二酸化炭素は不燃性ガスで，水によく溶解する。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:○ 正しい。　ハ:✕ 誤り。二酸化炭素は不燃性ガスで，水によく溶解する。&quot;, &quot;◎ 正しい組み合わせです。　ロ:○ 正しい。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ハ:✕ 誤り。二酸化炭素は不燃性ガスで，水によく溶解する。　ニ:○ 正しい。&quot;]}, {&quot;s&quot;: &quot;保安 R2(令和2年度)&quot;, &quot;n&quot;: &quot;問3&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，金属の腐食とその対策について正しいものはどれか。\nイ．機器の保温材へ雨水が浸入すると，外面腐食の原因になることがある。\nロ．腐食性液体が流れる配管のエルボおよびティーのように流れの方向が急に変化する箇所は，エロージョン・コロージョンが生じる可能性があるので，肉厚測定の対象とした。\nハ．高温高圧の水素ガス配管の材料として，水素侵食を防ぐため，クロムモリブデン鋼ではなく炭素鋼を採用した。\nニ．炭素鋼配管の高温ガス腐食を防止するために，電気防食法を適用した。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ハ&quot;, &quot;イ, ハ, ニ&quot;, &quot;ロ, ハ, ニ&quot;], &quot;a&quot;: 0, &quot;w&quot;: [&quot;◎ 正しい組み合わせです。　イ:○ 正しい。　ロ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ニ:✕ 誤り。電気防食法は海水中などの湿食環境中の炭素鋼などの湿食防止に適用される。高温ガス腐食にはクロマイズド鋼・アルミナイズド鋼などが有効。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:○ 正しい。　ハ:✕ 誤り。クロムモリブデン鋼は安定な炭化物を作るため炭素鋼より耐水素侵食性がよく，こちらを採用すべき。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ハ:✕ 誤り。クロムモリブデン鋼は安定な炭化物を作るため炭素鋼より耐水素侵食性がよく，こちらを採用すべき。　ニ:✕ 誤り。電気防食法は海水中などの湿食環境中の炭素鋼などの湿食防止に適用される。高温ガス腐食にはクロマイズド鋼・アルミナイズド鋼などが有効。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:○ 正しい。　ハ:✕ 誤り。クロムモリブデン鋼は安定な炭化物を作るため炭素鋼より耐水素侵食性がよく，こちらを採用すべき。　ニ:✕ 誤り。電気防食法は海水中などの湿食環境中の炭素鋼などの湿食防止に適用される。高温ガス腐食にはクロマイズド鋼・アルミナイズド鋼などが有効。&quot;]}, {&quot;s&quot;: &quot;保安 R2(令和2年度)&quot;, &quot;n&quot;: &quot;問4&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，計測機器および制御システムについて正しいものはどれか。\nイ．運転温度800℃での設備の温度監視に銅-コンスタンタンの熱電温度計を使用した。\nロ．比重の異なる2つの液の界面を測定するためには，一般に反射 &quot;: 1, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。破裂板は経年使用による金属疲労などで作動圧力が変化するおそれがあるため，定期的に交換する必要がある。　ロ:○ 正しい。&quot;, &quot;◎ 正しい組み合わせです。　ロ:○ 正しい。　ハ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ハ:○ 正しい。　ニ:✕ 誤り。逆流防止装置は，特定高圧ガス消費設備などで設備内のガスが減圧設備や容器に逆流するのを防止する装置。空気・窒素などを吸引して負圧を防ぐのは貯槽の負圧防止装置。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。破裂板は経年使用による金属疲労などで作動圧力が変化するおそれがあるため，定期的に交換する必要がある。　ロ:○ 正しい。　ニ:✕ 誤り。逆流防止装置は，特定高圧ガス消費設備などで設備内のガスが減圧設備や容器に逆流するのを防止する装置。空気・窒素などを吸引して負圧を防ぐのは貯槽の負圧防止装置。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。破裂板は経年使用による金属疲労などで作動圧力が変化するおそれがあるため，定期的に交換する必要がある。　ハ:○ 正しい。　ニ:✕ 誤り。逆流防止装置は，特定高圧ガス消費設備などで設備内のガスが減圧設備や容器に逆流するのを防止する装置。空気・窒素などを吸引して負圧を防ぐのは貯槽の負圧防止装置。&quot;]}, {&quot;s&quot;: &quot;保安 R4(令和4年度)&quot;, &quot;n&quot;: &quot;問12&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，除害のための措置について正しいものはどれか。\nイ．亜硫酸ガスの除害装置として，炭酸ソーダ水溶液を吸収液に用いた吸収塔を設置した。\nロ．シアン化水素をボイラの燃焼室で完全に燃焼させた。\nハ．硫化水素ガスの除害に塩酸水溶液を用いる吸収塔を設置した。\nニ．塩素の除害剤として，消石灰を保有し，散布する装置を設置した。&quot;, &quot;c&quot;: [&quot;イ, ハ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ハ&quot;, &quot;イ, ロ, ニ&quot;, &quot;ロ, ハ, ニ&quot;], &quot;a&quot;: 3, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ハ:✕ 誤り。硫化水素ガスの除害にはカセイソーダ水溶液や炭酸ソーダ水溶液を用いた吸収塔を設置する。&quot;, &quot;✕ 記述はすべて正しいですが，正しいものが不足しています。　イ:○ 正しい。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:○ 正しい。　ハ:✕ 誤り。硫化水素ガスの除害にはカセイソーダ水溶液や炭酸ソーダ水溶液を用いた吸収塔を設置する。&quot;, &quot;◎ 正しい組み合わせです。　イ:○ 正しい。　ロ:○ 正しい。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:○ 正しい。　ハ:✕ 誤り。硫化水素ガスの除害にはカセイソーダ水溶液や炭酸ソーダ水溶液を用いた吸収塔を設置する。　ニ:○ 正しい。&quot;]}, {&quot;s&quot;: &quot;保安 R4(令和4年度)&quot;, &quot;n&quot;: &quot;問13&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，高圧ガス設備の運転管理について正しいものはどれか。\nイ．安全弁の元弁を安全弁が作動した時に閉止措置ができるよう施錠せず，かつ，ハンドル廻しを近くにおいて確実な操作ができるようにした。\nロ．加熱炉内の加熱管では，火炎の状況の変化や管内のスケール沈着によって局部的に輝度が大きくなる部分が発生することがあるが，管の強度への影響はない。\nハ．配管内の閉塞は，内部の流体が反応して固形物が発生したり，流体の温度条件によっては不純物としての水分などが凍結したり，含有する固形物が沈着することなどで発生し，流速の影響も受ける。\nニ．製造設備の一部で，機器などの破壊が発生した場合は，破壊箇所の前後のバルブを閉止して孤立化させ，その系内のガスをフレアースタック，除害設備やベントスタックに導き放出し，さらに系内に不活性ガスを導入してパージするのが原則である。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot; 的に弁座漏れ検査，作動検査を行い，漏えい量が保安上支障のない量以下であり，確実に開閉ができる機能を有していることを確認する。\nロ．破裂板は，ばね式安全弁に比べて開き始めてから全開まで時間がかかることから，圧力上昇速度が大きい場合には適当ではない。\nハ．減圧弁または減圧を行う設備があるとき，その低圧側を高圧側とは別の圧力区分として安全装置を設置した。\nニ．貯槽用の緊急遮断装置を作動させる操作場所は，状況を目視で確認できるように，貯槽の防液堤内に設置した。&quot;, &quot;c&quot;: [&quot;イ, ハ&quot;, &quot;ロ, ハ&quot;, &quot;ロ, ニ&quot;, &quot;イ, ロ, ニ&quot;, &quot;イ, ハ, ニ&quot;], &quot;a&quot;: 0, &quot;w&quot;: [&quot;◎ 正しい組み合わせです。　イ:○ 正しい。　ハ:○ 正しい。前後で圧力が違うので別々に安全装置が要る。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。<b>逆</b>。破裂板はばね式安全弁より作動が<b>速い</b>ので、圧力上昇が速い場合にこそ有効。　ハ:○ 正しい。前後で圧力が違うので別々に安全装置が要る。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。<b>逆</b>。破裂板はばね式安全弁より作動が<b>速い</b>ので、圧力上昇が速い場合にこそ有効。　ニ:✕ 誤り。操作場所は貯槽外面から<b>5m以上</b>（コンビ則は10m以上）離す。防液堤内は✕。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ロ:✕ 誤り。<b>逆</b>。破裂板はばね式安全弁より作動が<b>速い</b>ので、圧力上昇が速い場合にこそ有効。　ニ:✕ 誤り。操作場所は貯槽外面から<b>5m以上</b>（コンビ則は10m以上）離す。防液堤内は✕。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ハ:○ 正しい。前後で圧力が違うので別々に安全装置が要る。　ニ:✕ 誤り。操作場所は貯槽外面から<b>5m以上</b>（コンビ則は10m以上）離す。防液堤内は✕。&quot;]}, {&quot;s&quot;: &quot;保安 R7(令和7年度)&quot;, &quot;n&quot;: &quot;問12&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，防災設備について正しいものはどれか。\nイ．定電位電解式のガス漏えい検知警報設備は，一酸化炭素，硫化水素の検知に使用できる。\nロ．フレアースタックでの噴出ガス流速が燃焼速度より過大になると，逆火現象が起きやすくなる。\nハ．空気呼吸器は，送気式マスクに比べて比較的自由に行動できるが，容器に充塡されている空気量により時間的な制約を受ける。\nニ．除害のための措置として，シアン化水素をボイラの燃焼室で完全に燃焼させた。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ハ&quot;, &quot;イ, ハ, ニ&quot;, &quot;ロ, ハ, ニ&quot;], &quot;a&quot;: 3, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:○ 正しい。　ロ:✕ 誤り。流速が燃焼速度より過大だと火炎が<b>吹き消える</b>。逆火は流速が小さすぎる場合。&quot;, &quot;✕ 公式解答ではありません。　イ:○ 正しい。　ニ:○ 正しい。シアン化水素は燃焼させて除害する。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。流速が燃焼速度より過大だと火炎が<b>吹き消える</b>。逆火は流速が小さすぎる場合。　ハ:○ 正しい。&quot;, &quot;◎ 正しい組み合わせです。　イ:○ 正しい。　ハ:○ 正しい。　ニ:○ 正しい。シアン化水素は燃焼させて除害する。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。流速が燃焼速度より過大だと火炎が<b>吹き消える</b>。逆火は流速が小さすぎる場合。　ハ:○ 正しい。　ニ:○ 正しい。シアン化水素は燃焼させて除害する。&quot;]}, {&quot;s&quot;: &quot;保安 R7(令和7年度)&quot;, &quot;n&quot;: &quot;問13&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，運転管理について正しいものはどれか。\nイ．バルブ開閉において，開閉操作が通常よりも非常にかたくて困難だったので，通常よりも柄の長いハンドル廻しを用い，多勢の運転員によって開閉作業を行った。\nロ．蒸留塔(棚段塔)内の蒸気速度が大きくなると，飛沫同伴量が増加し，降下液が上段のトレイに運ばれ，フラッディングが発生することがある。\nハ．締切り用バルブにおいて，水撃作用を防止するために，バルブを急速に閉止することを避け，流速変化の割合が小さくなるようにバルブを操作した。\nニ．液化ガス配管のバルブの閉止手順として，払出し先設備の入口弁を閉止した後に，払出し元のポンプの出口弁を閉止することと定めた。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ニ&quot;, &quot;ロ, ハ&quot;, &quot;イ, ハ, ニ&quot;, &quot;ロ, ハ, ニ&quot;], &quot;a&quot;: 2, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。制限トルクを超える力を加えてはならない。運転管理者に報告し基準に定められた措置をとる。　ロ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。制限トルクを超える力を加えてはならない。運転管理者に報告し基準に定められた措置をとる。　ニ:✕ 誤り。<b>順序が逆</b>。先に払出し元のポンプ出口弁を閉じる。先に行き先を閉めると配管内に液が閉じ込められ昇圧する。&quot;, &quot;◎ 正しい組み合わせです。　ロ:○ 正しい。　ハ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。制限トルクを超える力を加えてはならない。運転管理者に報告し基準に定められた措置をとる。　ハ:○ 正しい。　ニ:✕ 誤り。<b>順序が逆</b>。先に払出し元のポンプ出口弁を閉じる。先に行き先を閉めると配管内に液が閉じ込められ昇圧する。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:○ 正しい。　ハ:○ 正しい。　ニ:✕ 誤り。<b>順序が逆</b>。先に払出し元のポンプ出口弁を閉じる。先に行き先を閉めると配管内に液が閉じ込められ昇圧する。&quot;]}, {&quot;s&quot;: &quot;保安 R7(令和7年度)&quot;, &quot;n&quot;: &quot;問14&quot;, &quot;q&quot;: &quot;次のイ，ロ，ハ，ニの記述のうち，設備管理および工事管理について正しいものはどれか。\nイ．電気器具の使用時の電気火花，手動工具使用時の衝撃火花，摩擦火花の生じる火気工事における安全対策としては，防爆器具または安全工具を使用するだけでよい。\nロ．可燃性ガスを扱う塔槽の内部作業のため，当該塔槽内を窒素で置換し，可燃性ガス濃度が基準値以下になったことを確認した後，空気で再置換し，酸素濃度を確認した。\nハ．可燃性ガスを扱う精留塔の内部作業終了後，塔内部を窒素で置換し，仕切板の撤去を行い運転再開に備えた。\nニ．個々の設備の保全計画と全体の長期計画に基づいて，当該年度に実施する保全活動の実施時期を操業計画と調整して保全カレンダーを作成し，工事計画や資材の発注計画立案の参考にした。&quot;, &quot;c&quot;: [&quot;イ, ロ&quot;, &quot;イ, ハ&quot;, &quot;ロ, ニ&quot;, &quot;イ, ハ, ニ&quot;, &quot;ロ, ハ, ニ&quot;], &quot;a&quot;: 4, &quot;w&quot;: [&quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。<b>「〜だけでよい」は✕</b>。ガス検知・飛散防止・消火器の設置なども必要。　ロ:○ 正しい。窒素置換 → 濃度確認 → 空気で再置換 → 酸素濃度確認。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。<b>「〜だけでよい」は✕</b>。ガス検知・飛散防止・消火器の設置なども必要。　ハ:○ 正しい。&quot;, &quot;✕ 公式解答ではありません。　ロ:○ 正しい。窒素置換 → 濃度確認 → 空気で再置換 → 酸素濃度確認。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　イ:✕ 誤り。<b>「〜だけでよい」は✕</b>。ガス検知・飛散防止・消火器の設置なども必要。　ハ:○ 正しい。　ニ:○ 正しい。&quot;, &quot;◎ 正しい組み合わせです。　ロ:○ 正しい。窒素置換 → 濃度 合わせです。　イ:○ 正しい。　ハ:○ 正しい。　ニ:○ 正しい。&quot;, &quot;✕ 誤りを含む組み合わせです。　ロ:✕ 誤り。浸透探傷試験で内部のブローホールは検出できない。　ハ:○ 正しい。　ニ:○ 正しい。&quot;]}];


let filtered = DATA.slice();
let idx = 0;
let score = 0;
let answered = new Array(DATA.length).fill(false);
let activeCat = &quot;ALL&quot;;
const STORAGE_KEY = &quot;otsuka_hoan_v2&quot;;

const cats = [&quot;ALL&quot;, ...Array.from(new Set(DATA.map(d=>d.s)))];
function chipLabel(c){
  if(c === 'ALL') return `全問 ${DATA.length}問`;
  const m = c.match(/\((.+)\)/);
  const name = m ? m[1] : c;
  return `${name} ${DATA.filter(d=>d.s===c).length}問`;
}
const QROOT = document.getElementById('p-quiz');
const catBar = document.getElementById('catBar');
cats.forEach(c=>{
  const b = document.createElement('button');
  b.className = 'chip' + (c==='ALL' ? ' active' : '');
  b.textContent = chipLabel(c);
  b.onclick = () => selectCat(c, b);
  catBar.appendChild(b);
});

function selectCat(c, btn){
  activeCat = c;
  QROOT.querySelectorAll('.chip').forEach(ch=>ch.classList.remove('active'));
  btn.classList.add('active');
  filtered = c==='ALL' ? DATA.slice() : DATA.filter(d=>d.s===c);
  idx = 0; score = 0;
  answered = new Array(filtered.length).fill(false);
  render();
  saveProgress();
}

function render(){
  const total = filtered.length;
  if(idx >= total){ renderDone(); return; }
  const q = filtered[idx];
  document.getElementById('progLabel').textContent = `${idx+1} / ${total}`;
  document.getElementById('progFill').style.width = `${(idx/total)*100}%`;
  document.getElementById('scoreLabel').textContent = `正解 ${score}`;

  const card = document.getElementById('quizCard');
  card.innerHTML = `
    <span class=&quot;sec-tag&quot;>${q.s}</span>
    <div class=&quot;q-num&quot;>過去問題 ${q.n}</div>
    <div class=&quot;q-text&quot;>${escapeHtml(q.q)}</div>
    <div class=&quot;choices&quot; id=&quot;choicesWrap&quot;></div>
    <div class=&quot;result-banner&quot; id=&quot;resultBanner&quot;></div>
    <div class=&quot;actions&quot;>
      <button class=&quot;btn btn-secondary&quot; id=&quot;skipBtn&quot;>スキップ</button>
      <button class=&quot;btn btn-primary&quot; id=&quot;nextBtn&quot; disabled>次の問題 →</button>
    </div>
  `;
  const wrap = document.getElementById('choicesWrap');
  q.c.forEach((choiceText, i)=>{
    const el = document.createElement('div');
    el.className = 'choice';
    const reasonText = (q.w &amp;&amp; q.w[i]) ? q.w[i] : '';
    el.innerHTML = `
      <div class=&quot;choice-main&quot;><span class=&quot;choice-num&quot;>${i+1}</span><span>${escapeHtml(choiceText)}</span></div>
      <div class=&quot;choice-reason&quot; data-reason>${escapeHtml(reasonText)}</div>
    `;
    el.onclick = () => selectChoice(i);
    wrap.appendChild(el);
  });

  document.getElementById('skipBtn').onclick = () => { idx++; render(); saveProgress(); };
  document.getElementById('nextBtn').onclick = () => { idx++; render(); saveProgress(); };

  const resumeNote = document.getElementById('resumeNote');
  if(resumeNote){ resumeNote.remove(); }
}

function selectChoice(i){
  const q = filtered[idx];
  if(answered[idx]) return;
  answered[idx] = true;
  const choiceEls = QROOT.querySelectorAll('.choice');
  choiceEls.forEach((el, j)=>{
    if(j === q.a) el.classList.add('correct');
    if(j === i &amp;&amp; i !== q.a) el.classList.add('wrong');
    if(j !== q.a &amp;&amp; j !== i) el.classList.add('dim');
    const reasonEl = el.querySelector('[data-reason]');
    if(reasonEl &amp;&amp; reasonEl.textContent.trim()){
      reasonEl.classList.add('show');
      const tagSpan = document.createElement('span');
      tagSpan.className = (j === q.a) ? 'tag-ok' : 'tag-ng';
      tagSpan.textContent = (j === q.a) ? '○ ' : '✕ ';
      reasonEl.prepend(tagSpan);
    }
  });
  const banner = document.getElementById('resultBanner');
  banner.classList.add('show');
  if(i === q.a){
    score++;
    banner.classList.add('ok');
    banner.textContent = '✓ 正解!';
  } else {
    banner.classList.add('ng');
    banner.textContent = `✗ 不正解 — 正解は ${q.a+1}`;
  }
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('scoreLabel').textContent = `正解 ${score}`;
  saveProgress();
}

function renderDone(){
  const total = filtered.length;
  const pct = total ? Math.round((score/total)*100) : 0;
  document.getElementById('progLabel').textContent = `${total} / ${total}`;
  document.getElementById('progFill').style.width = `100%`;
  document.getElementById('scoreLabel').textContent = `正解 ${score}`;
  clearProgress();
  const card = document.getElementById('quizCard');
  card.innerHTML = `
    <div class=&quot;done-screen&quot;>
      <span class=&quot;sec-tag&quot;>${activeCat==='ALL' ? '全問' : activeCat} 完了</span>
      <div class=&quot;big&quot;>${score} / ${total}</div>
      <div style=&quot;font-family:-apple-system,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-weight:600;&quot;>正答率 ${pct}%</div>
      <div class=&quot;actions&quot; style=&quot;margin-top:22px;&quot;>
        <button class=&quot;btn btn-secondary&quot; id=&quot;retryBtn&quot;>もう一度</button>
      </div>
    </div>
  `;
  document.getElementById('retryBtn').onclick = () => {
    idx = 0; score = 0;
    answered = new Array(filtered.length).fill(false);
    render();
    saveProgress();
  };
}

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ cat: activeCat, idx, score, answered }));
  }catch(e){ /* storage unavailable, fail silently */ }
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function clearProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){ /* ignore */ }
}

function activateChipFor(cat){
  const label = chipLabel(cat);
  QROOT.querySelectorAll('.chip').forEach(ch=>{
    ch.classList.toggle('active', ch.textContent === label);
  });
}

function showResumeBanner(saved){
  const savedFiltered = saved.cat==='ALL' ? DATA.slice() : DATA.filter(d=>d.s===saved.cat);
  const card = document.getElementById('quizCard');
  card.innerHTML = `
    <div id=&quot;resumeNote&quot; style=&quot;text-align:center;padding:6px 4px;&quot;>
      <span class=&quot;sec-tag&quot;>前回の続き</span>
      <p style=&quot;font-size:14.5px;line-height:1.7;margin:12px 0 4px;&quot;>
        「${saved.cat==='ALL' ? '全問' : saved.cat}」を <b>${saved.idx} / ${savedFiltered.length}</b> 問目まで進めていました(正解 ${saved.score} 問)。

      </div>
    </div>
  `;
  document.getElementById('resumeBtn').onclick = () => {
    activeCat = saved.cat;
    filtered = savedFiltered;
    idx = saved.idx;
    score = saved.score;
    answered = (Array.isArray(saved.answered) &amp;&amp; saved.answered.length === filtered.length)
      ? saved.answered
      : new Array(filtered.length).fill(false);
    activateChipFor(activeCat);
    render();
  };
  document.getElementById('restartBtn').onclick = () => {
    clearProgress();
    activeCat = 'ALL';
    filtered = DATA.slice();
    idx = 0; score = 0;
    answered = new Array(filtered.length).fill(false);
    activateChipFor('ALL');
    render();
  };
}

function initApp(){
  const saved = loadProgress();
  const savedTotal = saved ? (saved.cat==='ALL' ? DATA.length : DATA.filter(d=>d.s===saved.cat).length) : 0;
  if(saved &amp;&amp; typeof saved.idx === 'number' &amp;&amp; saved.idx > 0 &amp;&amp; saved.idx < savedTotal){

  } else {
    render();
  }
}
